work begins with material gathered there. The place matters through its surfaces, recordings, and the people involved in collecting them. The proposal also responds to Jeju’s repeated appearance as a beautiful tourist image. I wanted to ask what another relationship with those familiar images could produce. A basalt surface can become a source of rules. Water movement can become a structure for another image. That does not free the work from making another beautiful image of Jeju. It gives me a way to examine how that beauty is being produced.\n","b":false,"i":false}]}],"lesson":{"words":544,"vocab":[{"word":"prototype","ko":"시제품, 기능을 시험하는 초기 버전","form":"prototype","example":"Ahn: That was an interaction plan for the prototype."},{"word":"cavities","ko":"움푹 파인 곳들, 구멍들","form":"cavities","example":"Basalt has cavities and irregularities that can become starting points for another structure."},{"word":"composition","ko":"구성, 화면 배치","form":"composition","example":"I like that the material can resist a familiar composition."},{"word":"distinction","ko":"구별, 차이","form":"distinction","example":"The distinction helps the artistic question stay useful."}],"grammar":{"title":"how to + 동사원형","ko":"어떻게 ~하는지를 짧게 표현한다. know, learn, decide 같은 동사 뒤에 자주 온다.","quote":"I choose which features to extract, how to simplify them, and how to translate a surface into another arrangement.","answer":"how to","blank":"I choose which features to extract,  ____  simplify them, and how to translate a surface into another arrangement.","wrong":["how for","how that"],"example":"We are learning how to document the process.","translation":"우리는 과정을 어떻게 기록할지 배우고 있다."},"question":"What can a stone contribute to a digital artwork?","frame":"The stone provides __, which I use to __."}},{"title":"3 How a Wave Becomes a Flower","blocks":[{"kind":"p","r":[{"t":"I want to explain the title ","b":false,"i":false},{"t":"The Algorithm of Flowers and the Grammar of Waves","b":false,"i":true},{"t":" through a simple example.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Begin with a circle. Move it slightly. Keep a trace of where it was. Move it again and let the earlier traces become fainter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Depending on the path and the spacing, the image may begin to look like a flower. The resemblance emerges from movement and accumulation. We can change the result by changing how long the traces remain, how far they separate, and how strongly they overlap.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"This is an artistic rule for generating an image. It does not explain how a living flower develops.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That difference gives the work room to move. A motion taken from one context can become a form in another.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A recorded movement\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In the early proposal, I describe recording a tethered, buoyant object whose form refers to basalt. Its movement on water would provide positions, turns, and repetitions for the visual experiments.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Even this simple description contains a whole arrangement. The object has a particular weight and shape. The tether affects its movement. The camera gives us a view from one position. The recording lasts for a chosen duration.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The result is a record of that encounter. It cannot stand for every possible motion of the sea.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"But it can give us a particular rhythm to work with. A turn may repeat unevenly. A sudden displacement may interrupt a quieter passage. Those differences can travel into the next image.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The grammar\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I use “grammar” to describe relationships that let a movement become legible within the work.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"If a recorded motion becomes faster, perhaps a visual trace spreads farther. If the motion turns, perhaps the bloom changes its direction. If traces overlap more densely, the form may become heavier or more opaque.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"These are choices I make and test. There is no single correct translation from water to flower.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Calling it a grammar reminds me that I am choosing how one thing can follow another. I am also choosing which differences will matter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Suppose I make every small fluctuation visible. The result may become busy and difficult to read. Suppose I smooth the movement too heavily. I may lose the quality that made the recording interesting.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The work develops between those decisions.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The stone gives the movement somewhere to happen\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The basalt surface supplies another layer. The positions extracted from its cavities become possible sites for the forms to appear.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Now a recorded movement can be distributed through a field. Similar rules may act at different positions or scales. The image can move together while retaining differences within it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I am interested in the moment when a viewer recognizes both the overall rhythm and a particular bloom. Attention can move between the field and the individual form.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That relationship will return in the mountain project. A landscape can hold many distinct events while appearing continuous from far away.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Recognition arrives late\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"There is a pleasure in seeing something before knowing what to call it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A viewer may first see circles or moving particles. Then a form opens enough to become a flower. Once the resemblance appears, it may be difficult to unsee.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to stay close to that threshold. The image can carry traces of water without looking like a wave. It can suggest a flower without settling into a botanical illustration.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The work gives me a way to ask how recognition develops. What does the movement contribute? What does the viewer bring? How much of a familiar form is enough for a name to appear?\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The rule and the result\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A generative artwork can be described through its rules, but the description does not replace the experience of watching it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I may know how the image is made and still have to wait to see what happens next. A density that looks excessive in a still image may become meaningful over time. A quiet interval may make a later movement visible.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"This is where my interest in film remains present. Even when a system generates the image, attention still develops through duration.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The flower takes time to become recognizable. It also takes time to disappear.\n","b":false,"i":false}]}],"lesson":{"words":671,"vocab":[{"word":"legible","ko":"읽을 수 있는, 쉽게 파악할 수 있는","form":"legible","example":"I use “grammar” to describe relationships that let a movement become legible within the work."},{"word":"displacement","ko":"이동, 변위","form":"displacement","example":"A sudden displacement may interrupt a quieter passage."},{"word":"accumulation","ko":"축적","form":"accumulation","example":"The resemblance emerges from movement and accumulation."},{"word":"buoyant","ko":"물에 뜨는, 부력이 있는","form":"buoyant","example":"In the early proposal, I describe recording a tethered, buoyant object whose form refers to basalt."}],"grammar":{"title":"may / might + be","ko":"가능성을 표현한다. may와 might 뒤에 be 원형을 쓴다.","quote":"Once the resemblance appears, it may be difficult to unsee.","answer":"may be","blank":"Once the resemblance appears, it  ____  difficult to unsee.","wrong":["may is","might being"],"example":"The difference might be hard to notice.","translation":"그 차이는 알아차리기 어려울 수도 있다."},"question":"How does the movement of a wave become a flower?","frame":"I turn the movement of the wave into __."}},{"title":"4 When the Rules Surprise Their Maker","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" In the proposal, you ask whether nature can adapt to technology and generate a new world. What does that mean in the work?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It is a way of changing my starting position. If I begin by asking how to reproduce a landscape, I may judge the result mainly through resemblance. If I begin with the material as a source of constraints and rules, I become interested in what it can lead me to make. The phrase is an artistic proposition. The stone does not literally learn to operate the software. Its recorded features enter a system, and I organize that translation.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Then why use the language of agency?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Because it asks me to give the material more influence over the result. It reminds me to notice when I am forcing everything into a composition I had already decided on. That influence can be concrete. A distribution of cavities changes the visual density. An irregular movement changes the timing. A particular recording gives the work something I would not have chosen from an empty screen.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" But you could still change any of those things.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. I retain responsibility for the system. Giving a source influence does not remove authorship. It changes how I exercise it. The interesting question is which decisions I leave open long enough to be affected by the material.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How do you know when to leave something alone?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I need time with it. An unexpected result can be interesting simply because it is new. After the surprise passes, I can ask whether it continues to hold attention and whether its relationship to the source matters. Sometimes I should change the rule. Sometimes I should change my expectation.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Where is AI in this project?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" My broader practice includes AI, and the proposal places the work in that context. But I should be precise about the particular operations. Scanning a stone, tracking movement, generating particles, and rendering in a real-time engine do not automatically make a system AI. The flower project can address questions raised by AI through its treatment of creation, agency, and representation, even where a particular image comes from an explicitly designed algorithm. The mountain project uses AI interpretation more directly as part of its proposed process.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Does a creation exceed its creator when a system produces something unexpected?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That is one modest sense of exceeding. The rules can produce a configuration I did not picture in advance. A larger question appears when the creation changes the conditions around its maker. An image can change what people expect from an artist. A system can begin to organize how someone’s actions are understood. Then the creator has to respond to something that now participates in the world.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Do you welcome that possibility?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I want to be open to it without treating surprise as an excuse. If an image misrepresents someone, I cannot say that the system became independent and leave the problem there. My interest in coexistence begins with continuing to take part in the relationship. Making something is the beginning of that responsibility.\n","b":false,"i":false}]}],"lesson":{"words":520,"vocab":[{"word":"constraint","ko":"제약","form":"constraints","example":"If I begin with the material as a source of constraints and rules, I become interested in what it can lead me to make."},{"word":"density","ko":"밀도","form":"density","example":"A distribution of cavities changes the visual density."},{"word":"render","ko":"렌더링하다, 화면을 그려내다","form":"rendering","example":"Scanning a stone, tracking movement, generating particles, and rendering in a real-time engine do not automatically make a system AI."},{"word":"retain","ko":"유지하다, 남겨두다","form":"retain","example":"I retain responsibility for the system."}],"grammar":{"title":"would + 동사원형","ko":"가정 속 선택이나 조심스러운 의견을 말한다. would 뒤에는 동사원형이 온다.","quote":"A particular recording gives the work something I would not have chosen from an empty screen.","answer":"I would","blank":"A particular recording gives the work something  ____  not have chosen from an empty screen.","wrong":["I would to","I would am"],"example":"I would keep the original recording.","translation":"나라면 원본 녹음을 보존하겠다."},"question":"How can a system surprise its maker?","frame":"I can set the rules and still be surprised by __."}},{"title":"5 A Body Enters the Garden","blocks":[{"kind":"p","r":[{"t":"There is a point in the early flower-and-wave proposal where a human body enters the field.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The plan is to use motion-capture material from a dancer. The figure appears as a transparent presence or a trace of movement. Its motion changes what happens around it: the direction or density of the flowers, the rhythm of their movement, perhaps the way sound develops.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I am interested in how long a body can remain recognizable through its effects.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A person may be difficult to see, yet something passes through the field. Flowers change direction. A movement leaves an interval behind it. The viewer begins to locate a body through what it alters.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"How a body becomes a force\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Once movement enters software, I have to decide what part of it will act on the environment.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Should the hand affect only what is near it? Should the whole body create a larger disturbance? Should a slow movement produce a different response from a fast one? How quickly should the environment return to an earlier condition?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Those choices determine the apparent relationship between the human and the landscape.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"If every movement makes the field respond immediately and beautifully, the body can become a very comfortable center of power. The world exists to confirm that someone has acted.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Another arrangement might require waiting. A small movement could have a delayed effect. Different parts of the field could respond at different times. The viewer might have to learn how to notice the result.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to explore what each arrangement asks us to believe about our place in the environment.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The difference between a trace and a person\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A motion recording can carry timing, posture, and rhythm. It does not explain everything that led the dancer to move that way.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That limit becomes more important when the project turns toward everyday human relationships.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In the garden, I can use a recorded path as a visual force. In a record of people gathering, a path may also belong to a friendship, a habit, a worry, or a practical need. Its meaning extends beyond the positions I can capture.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I began to ask what happens when a system gives a description of those movements. How does it decide which explanation fits? What information would it need to know why someone came closer or stayed longer?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The transition toward ","b":false,"i":false},{"t":"Mountains of Gathering and Valleys of Potential","b":false,"i":true},{"t":" grows from that difficulty.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A world already occupied\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The later proposal describes ","b":false,"i":false},{"t":"The Algorithm of Flowers and the Grammar of Waves","b":false,"i":true},{"t":" as a twenty-eight-minute digital moving-image work presented on the Art Korea Lab media wall in 2026. That completed work is one point in a longer development. The earlier interactive and choreographic plans remain useful questions without all becoming claims about what the exhibition contained.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to keep that distinction because an artwork changes as it is made. A proposal gathers possibilities. A finished work chooses a particular form and duration.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The questions that remain can travel into another project.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"When I begin recording people, I enter a world that already has its own relationships. My system arrives later. It has to find a way to describe something it did not create.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That changes the meaning of giving the source influence.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The people in the recording can answer.\n","b":false,"i":false}]}],"lesson":{"words":527,"vocab":[{"word":"presence","ko":"존재감, 현존감","form":"presence","example":"The figure appears as a transparent presence or a trace of movement."},{"word":"carry","ko":"전달하다, 감정을 품다","form":"carry","example":"A motion recording can carry timing, posture, and rhythm."},{"word":"condition","ko":"조건, 상태","form":"condition","example":"How quickly should the environment return to an earlier condition?"},{"word":"affect","ko":"영향을 주다","form":"affect","example":"Should the hand affect only what is near it?"}],"grammar":{"title":"have to + 동사원형","ko":"상황이나 책임 때문에 해야 할 일을 말한다. to 뒤에는 동사원형이 온다.","quote":"Once movement enters software, I have to decide what part of it will act on the environment.","answer":"I have to","blank":"Once movement enters software,  ____  decide what part of it will act on the environment.","wrong":["I have for","I have to be to"],"example":"I have to check the timing again.","translation":"타이밍을 다시 확인해야 한다."},"question":"How can a dancer leave a trace without appearing clearly?","frame":"Even when the body is hard to see, its movement __."}},{"title":"6 Why People Keep Coming Back","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" The mountain project begins with people gathering in ordinary places. What caught your attention?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" In the 2027 application, I describe spending two months in Jeju during the summer and meeting people at a small salon near Sanbangsan. People with different lives came there, talked, and shared food. What interested me was the repeated movement toward the same place. From outside, it could look like an uneventful routine. From within a relationship, the repetition might carry years of meaning.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" You found a related pattern in Seoul.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. I describe a playground in Ssukgogae where children gathered around similar times without an explicit appointment, and an older person’s clothing shop where people continued to gather even when there were no customers buying clothes. These places made me ask what a location does beyond its stated function. A salon is a place for cutting hair. A shop is a place for buying something. Yet people may also use them to remain near each other.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Do you already know why they return?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I have impressions and questions. I would need to listen to the people involved before treating an explanation as theirs. Familiarity, care, convenience, obligation, or something else could matter. Different people may have different reasons for arriving in the same room. The project should be able to keep those differences.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How does AI enter the encounter?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The plan is to give it short sections of recordings and ask it to interpret speech, actions, and relationships. Then we compare its descriptions with the recording, conversation records, and explanations from the people involved. I want to examine how a system moves from something visible or audible to a claim about a situation.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Could a human viewer make the same mistake?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Certainly. Someone watching a short clip without context may have very little to work with. That comparison is important. I do not want the project to imagine a human observer who understands everyone immediately. The production team can also misunderstand. We choose the clip and the questions. We may fail to ask about something that changes the meaning of a scene.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Why compare Jeju and Seoul?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The recordings would come from different environments and relationships. That gives us a way to explore how interpretation changes with context. I want to avoid making Jeju represent an untouched past and Seoul represent a technological future. People in both places have complex lives. The contrast should come from the actual recordings and what we learn through them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What counts as a meaningful scene?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It may be something very small: a change of speaker, an action whose reason is unclear, a conversation that relies on shared knowledge. I would want to choose scenes for what they let us examine, with the agreement of the people involved. The project does not need everyone to reveal something intimate. Ordinary activity can already show how much context a description requires.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" The project includes children in the playground material. Does that change how you approach it?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It means the filming and any public use need particular care and appropriate permission. A public setting does not make every person’s image available for whatever I want to do with it. I would need to plan what can be recorded, analyzed, and shown. If a scene cannot be used responsibly, the work can take another route.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What do you hope the participants recognize in the finished landscape?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I cannot know that yet. I hope the work gives them enough access to its process to discuss what happened to their recordings. Their own response may be very different from my expectation. That would be information the work needs to receive.\n","b":false,"i":false}]}],"lesson":{"words":621,"vocab":[{"word":"permission","ko":"허락","form":"permission","example":"Ahn: It means the filming and any public use need particular care and appropriate permission."},{"word":"recognize","ko":"알아보다, 인정하다","form":"recognize","example":"Interviewer: What do you hope the participants recognize in the finished landscape?"},{"word":"available","ko":"이용할 수 있는","form":"available","example":"A public setting does not make every person’s image available for whatever I want to do with it."},{"word":"meaningful","ko":"의미 있는","form":"meaningful","example":"Interviewer: What counts as a meaningful scene?"}],"grammar":{"title":"should / must + be","ko":"필요하거나 바람직한 상태를 말한다. 조동사 뒤에는 be 원형이 온다.","quote":"The project should be able to keep those differences.","answer":"should be","blank":"The project  ____  able to keep those differences.","wrong":["should is","must being"],"example":"The source should be clear.","translation":"출처가 분명해야 한다."},"question":"Why might people keep gathering in the same place?","frame":"People may return because __."}},{"title":"7 The Mountain Is Made of Interpretations","blocks":[{"kind":"p","r":[{"t":"The image is simple to describe.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"An AI system moves along a recording as a cloud might move across a landscape. When its interpretation goes wrong, an error falls like rain. The errors accumulate. A mountain begins to rise.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Repeated across recordings, the process creates a range. From far away, we see a landscape. From close by, we discover fragments of the lives from which it formed.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The simplicity of the image makes the decisions behind it especially important.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Thirty seconds\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The proposal divides the recordings into thirty-second segments. A segment gives the system a limited encounter with a longer event.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That boundary affects what can be understood. The beginning of a sentence may fall outside it. Someone visible in one segment may have been introduced earlier. A familiar gesture may depend on a conversation that happened before the recording began.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"So the segment has to remain identifiable as a selection. It cannot quietly stand in for an entire relationship.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The proposed comparison uses three conditions: video without sound, sound without the image, and the two together. Each condition makes different information available.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"This gives us a way to ask what changes when the system gains another source. Does the sound clarify an action? Does the image help identify a speaker? Does combining them introduce a new assumption?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The project has to discover the answers through the material. It should not decide in advance which condition will produce the most interesting failures.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Comparing an answer with an event\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Some differences are relatively straightforward to examine. A system may transcribe a word incorrectly or attribute an audible sentence to the wrong visible speaker.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Other differences are harder. A description of a relationship may be unsupported by the clip, contradicted by an account from those involved, or impossible to establish with the available material.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"These cases should not all receive the same label.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In developing the work, I would want to distinguish a confirmed mismatch from an unsupported inference and from a question we cannot resolve. The proposal provides a starting method. This distinction is a way to make that method more careful as the project develops.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Uncertainty can remain visible. The landscape does not require every question to end in a verdict.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"What height can mean\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The proposal links a greater accumulation of errors with higher peaks.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That gives the viewer an immediate visual relationship. It also creates a temptation to read height as importance, complexity, or humanity.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to resist letting the mountain make that claim silently.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A high peak could reflect a difficult recording, unfamiliar speech, a poorly framed task, or repeated failures under a chosen condition. A low peak could accompany an accurate account of an ordinary but deeply meaningful scene.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The height belongs to this encounter between recording, task, system, and evaluation. It cannot measure the worth of the people in the clip.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I am drawn to error because it opens a question. The question needs more attention than a count can provide.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Making the land\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"An accumulation becomes a mountain only through another set of decisions.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"How much height does one event add? How broadly does it spread? Do different kinds of disagreement produce different particles? What does a change in time look like across the surface?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The final geometry will make some things noticeable and allow others to disappear. A dramatic peak may dominate a quieter region. A smooth surface may conceal the fact that several very different cases sit beneath it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I need to make the artistic rules legible enough that someone can question them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The terrain is a visualization shaped by an artist. It does not arrive from the recording as a discovered natural object.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The valleys\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The title calls the spaces between the mountains “valleys of potential.”\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I use that phrase to keep an opening within the image. A system has produced a description, but the people in the recording still have more to say. Their relationships continue beyond the clip. An account can remain unfinished.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The valley gives that unfinished condition a place in the composition. It is a poetic space, rather than a separate quantity that the software has measured.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We should be able to spend time there without requiring a new error to justify the visit.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A route back\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The most important connection in the terrain is the route from a visible form back to its source.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A viewer should be able to approach a region and encounter the relevant recording, the system’s answer, and enough context to understand how the comparison was made. Some material may require editing or restricted access according to what participants agree to share.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Without that route, the mountain could become a beautiful diagram of someone else’s conclusion.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"With it, the viewer can begin to judge the relationship for themselves.\n","b":false,"i":false}]}],"lesson":{"words":777,"vocab":[{"word":"disagreement","ko":"의견 차이, 불일치","form":"disagreement","example":"Do different kinds of disagreement produce different particles?"},{"word":"inference","ko":"추론","form":"inference","example":"In developing the work, I would want to distinguish a confirmed mismatch from an unsupported inference and from a question we cannot resolve."},{"word":"unsupported","ko":"근거가 부족한","form":"unsupported","example":"A description of a relationship may be unsupported by the clip, contradicted by an account from those involved, or impossible to establish with the available material."},{"word":"terrain","ko":"지형","form":"terrain","example":"The terrain is a visualization shaped by an artist."}],"grammar":{"title":"want to + 동사원형","ko":"하고 싶은 일을 말할 때 want 뒤에 to와 동사원형을 쓴다.","quote":"I want to resist letting the mountain make that claim silently.","answer":"I want to","blank":" ____  resist letting the mountain make that claim silently.","wrong":["I want for","I want that"],"example":"I want to show how memory changes.","translation":"기억이 어떻게 달라지는지 보여주고 싶다."},"question":"What does the height of a mountain in this work represent?","frame":"The height reflects __ under a particular set of conditions."}},{"title":"8 A Train That Can Stop","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Your mountain project returns to the window. Why a train?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A train gives the audience a moving frame within the world. In the proposal, the viewer sits on a physical chair and encounters a corresponding seat inside the virtual carriage. That connection between the two positions matters. The journey begins from somewhere the body already occupies.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What can the viewer control?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The proposed experience lets them adjust the movement speed and viewpoint, including stopping near a peak. It is a journey with opportunities to remain with a scene. From a distance, the terrain appears as a mountain range. As the viewer slows or approaches, particles and moving-image fragments become more distinct. Individual voices emerge from the surrounding sound.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What happens at a stop?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The plan is to show the thirty-second source recording associated with that region and the AI interpretation. The viewer can hear the conversation and examine the mismatch or question that contributed to the terrain. The stop makes a change of scale possible. The landscape becomes an encounter with a particular moment.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Is the experience telling people to slow down?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It gives slowing down a visible consequence. I do not want to turn it into a moral test where the patient viewer is automatically a better person. An exhibition has practical limits. Someone may have little time or find a headset tiring. The work should still give them a meaningful encounter. What interests me is whether the viewer can notice how speed changes what is available. Then they have a choice about how to continue.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Does the train offer real freedom if the route already exists?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It offers a particular kind of freedom. I design the route and the possible stops. The viewer changes their pace and attention within that arrangement. I should describe that honestly. A designed experience does not become unlimited simply because it is interactive.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Could the viewer mistake a higher peak for a more interesting person?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes, which is why the interface and the book need to explain what generated the height. I also want the design to offer ways of encountering less dramatic parts of the terrain. If every reward sits on the tallest mountain, the interaction would encourage a reading I am trying to question.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Why include a media-wall version as well?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The media wall gives the work a shared scale and a composed duration. The proposal describes an approximately eight-to-ten-minute loop in which mountains form, connect, and become individual recordings as the camera approaches. The VR journey gives each visitor a different relationship to pace. The media-wall work can establish a sequence that several people watch together. Each format makes another kind of attention possible.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Can people outside the headset participate?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The proposal considers a projected preview so that other visitors can follow the virtual experience. I want the public presentation to include people who choose another way to watch. That changes the room. A private view can become something people discuss while they are near each other. Their conversation may become as significant as the movement of the train.\n","b":false,"i":false}]}],"lesson":{"words":525,"vocab":[{"word":"consider","ko":"고려하다","form":"considers","example":"Ahn: The proposal considers a projected preview so that other visitors can follow the virtual experience."},{"word":"emerge","ko":"드러나다, 나타나다","form":"emerge","example":"Individual voices emerge from the surrounding sound."},{"word":"proposal","ko":"제안서, 구상","form":"proposal","example":"In the proposal, the viewer sits on a physical chair and encounters a corresponding seat inside the virtual carriage."},{"word":"source","ko":"출처, 원본 자료","form":"source","example":"Ahn: The plan is to show the thirty-second source recording associated with that region and the AI interpretation."}],"grammar":{"title":"do not + 동사원형","ko":"현재의 의견이나 습관을 부정할 때 do not 뒤에 동사원형을 쓴다.","quote":"I do not want to turn it into a moral test where the patient viewer is automatically a better person.","answer":"I do not","blank":" ____  want to turn it into a moral test where the patient viewer is automatically a better person.","wrong":["I does not","I am not to"],"example":"I do not assume that every viewer agrees.","translation":"관객 모두가 동의한다고 가정하지 않는다."},"question":"How does stopping the train change the experience?","frame":"When the train stops, the viewer can __."}},{"title":"9 Questions About Error","blocks":[{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" If AI gets everything right, do you lose your artwork?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The mountain would have less error material under those conditions. That would be a result worth showing. I would still have questions about what the system was asked, what counted as correct, and how much of the encounter remained outside the task. I should not create failures simply because I want a dramatic landscape.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Could you make a harder prompt until it fails?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I could, but that would change the event the terrain describes. Difficulty is something the artist can manipulate. I want to retain the questions and conditions so that the viewer can recognize that influence.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" How would you decide whether someone’s relationship has been interpreted correctly?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" First I would need to be precise about what was claimed. Identifying who spoke is different from deciding that two people are close friends. Participants may help establish some facts. Other aspects may remain private or open to different accounts. The work needs a way to mark that limit.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Aren’t people the experts on their own lives?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Their accounts are essential, and the project should give them real influence. People can also disagree about a shared event. I do not want to remove those differences just to produce a single convenient answer for the system. A record can include several accounts and explain what remains unresolved.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" If the camera records affection, why do you need someone to explain it?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The camera records gestures, speech, proximity, and many other visible or audible details. Calling those details affection is already an interpretation. It may be reasonable, and it may be mistaken. I want to notice the step between what the image shows and what we say it means.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What if an error comes from background noise rather than a complicated relationship?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Then that should be identified. Poor sound can create a very high mountain without revealing anything special about the people recorded. The cause matters if I am going to connect the image to a claim about interpretation.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Why make an error beautiful?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Beauty can give someone a reason to approach. I want the approach to lead to the people and the conditions behind the image. If beauty makes the source disappear, I need to reconsider how the work is organized.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Could people feel embarrassed by their recordings becoming a spectacle?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. That is something to discuss before public presentation. The point is to examine a system’s interpretation, but framing still affects how a viewer treats the person on screen. Consent needs to cover the actual use, and participants need a way to raise concerns about the result.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Does an AI error reveal human uniqueness?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It reveals a limit under particular conditions. The next question is what kind of limit it is. It might involve missing context, recording quality, the task, or the system. I would not use it as proof that the people involved possess a quality no technology could ever describe.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Does that weaken the idea of the valleys containing humanity?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It makes the metaphor more careful. The valleys can give space to what this description has not settled. Humanity also appears in clear speech, predictable habits, and moments a system describes accurately. I do not want the work to require people to remain mysterious in order to matter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Could the artist’s interpretation also become part of the landscape?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That is a useful possibility to explore. Even if I do not add another terrain, I can show where my own choices shaped the result. The selected clips, the evaluation notes, and the mapping rules would make that influence more available.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Are natural systems more honest than AI systems?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Honesty is a human description I would use carefully there. A wave does not give me a statement about what it means. When I turn its recorded movement into an image, I create a representation and can explain my choices. With AI, an additional generated description becomes part of that chain.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Why preserve human agency if the system can make a better interpretation?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A useful interpretation can help someone. Its usefulness does not remove their stake in how it is used. Agency includes the ability to question a description, set boundaries, and make choices about the consequences. Those abilities still matter when a system performs well.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What would you like someone to do after leaving the exhibition?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Perhaps ask a question before deciding what a scene means. Perhaps return to a conversation they had treated as ordinary. I would also be interested if they began to notice the conditions behind a convincing image, including one of mine.\n","b":false,"i":false}]}],"lesson":{"words":805,"vocab":[{"word":"consent","ko":"동의","form":"Consent","example":"Consent needs to cover the actual use, and participants need a way to raise concerns about the result."},{"word":"proximity","ko":"가까이 있음, 근접","form":"proximity","example":"Ahn: The camera records gestures, speech, proximity, and many other visible or audible details."},{"word":"framing","ko":"어떤 틀과 관점으로 제시하는 방식","form":"framing","example":"The point is to examine a system’s interpretation, but framing still affects how a viewer treats the person on screen."},{"word":"approach","ko":"접근하다, 접근법","form":"approach","example":"Ahn: Beauty can give someone a reason to approach."}],"grammar":{"title":"has been + 과거분사 또는 보어","ko":"과거부터 현재까지 이어지는 상태나 결과를 말한다. 과거분사가 뒤따르면 현재완료 수동태가 될 수 있다.","quote":"Audience member: How would you decide whether someone’s relationship has been interpreted correctly?","answer":"has been","blank":"Audience member: How would you decide whether someone’s relationship  ____  interpreted correctly?","wrong":["has being","have been to"],"example":"The image has been edited.","translation":"이미지가 편집되었다."},"question":"What is the difference between an error and uncertainty?","frame":"An error is __. Uncertainty means __."}},{"title":"10 From Who Am I to What Am I","blocks":[{"kind":"p","r":[{"t":"“Who am I?” often leads me toward a story.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I can speak about where I studied, the work I make, the people I know, and the places I have lived. The answer gives me a position among other people.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"“What am I?” changes the scale of the question.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I begin to think about a body, its material conditions, and the forms of dependence that let it continue. My story remains important. It takes place within a world that did not begin with me.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The 2027 application describes this movement between the questions as part of my practice. The two landscape projects give it a concrete form.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A human within nature\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In the flower project, I work with material and recorded motion to create a virtual environment. When a human trace enters that environment, it becomes one influence among others.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The scale can shift. The stone can surround us. A hand movement can affect a whole field. A motion from water can shape something we recognize as a flower.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"These changes make familiar categories less stable. The human figure may remain recognizable while losing its usual position at the center of the image.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I am interested in whether that experience can change how we ask about ourselves. What if we begin by noticing a relationship of movement, rather than asking which thing controls every other thing?\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A human described by technology\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The mountain project introduces another position. Here, people already have relationships with each other. A system receives recordings and produces descriptions.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The person becomes the subject of an account they did not necessarily write. That account may be accurate, useful, partial, or wrong.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"My question is how the account returns to the person. Can they understand it? Can they respond? Can their response change what the artwork presents?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The technical system can be complex. The encounter still includes a basic human experience: someone else has said what they think you are doing.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Most of us know how quickly that can become uncomfortable.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Being understood\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"There is a wish to be understood and a wish to remain free from another person’s final explanation.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"An accurate description can feel generous. It can also become restrictive when it turns into an expectation. Someone recognizes a habit, and soon the habit becomes all they see.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"An AI description can enter that same difficulty. The question extends beyond whether one answer is correct. It includes how long the description lasts, where it travels, and what decisions become attached to it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In the artwork, I can begin by keeping the recording and the description close enough to examine together. I can make the description visible as something produced under conditions, with a date and a task.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That gives it a history. It becomes easier to imagine changing it.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Coexistence and the right to continue changing\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I have asked why humans should refuse coexistence with AI when we already live in dependence on nature.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The language is poetic. Nature does not offer a single intention, and AI is a human-made collection of systems with particular owners, designs, and uses. Their differences matter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"What I carry between them is the problem of living with something we cannot completely control.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Coexistence has to include the possibility of revising a relationship. We can change a design, stop a particular use, or choose a slower form of attention. A person can also change after the record has been made.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want my work to keep that future available.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A recording may hold a moment very carefully. The person remains able to become someone the recording does not yet know.\n","b":false,"i":false}]}],"lesson":{"words":579,"vocab":[{"word":"motion","ko":"움직임","form":"motion","example":"In the flower project, I work with material and recorded motion to create a virtual environment."},{"word":"attention","ko":"주의, 관심","form":"attention","example":"We can change a design, stop a particular use, or choose a slower form of attention."},{"word":"include","ko":"포함하다","form":"includes","example":"The encounter still includes a basic human experience: someone else has said what they think you are doing."},{"word":"describe","ko":"묘사하다, 설명하다","form":"describes","example":"The 2027 application describes this movement between the questions as part of my practice."}],"grammar":{"title":"there is / there are","ko":"무엇이 존재한다고 말할 때 사용한다. 뒤에 오는 명사의 수에 맞춰 is 또는 are를 선택한다.","quote":"There is a wish to be understood and a wish to remain free from another person’s final explanation.","answer":"There is","blank":" ____  a wish to be understood and a wish to remain free from another person’s final explanation.","wrong":["there being","there be"],"example":"There are several ways to read the scene.","translation":"이 장면을 읽는 방식은 여러 가지다."},"question":"How do the questions “Who am I?” and “What am I?” differ?","frame":"The first question makes me think about __. The second makes me think about __."}},{"title":"11 A Book Beside the Landscape","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" The mountain proposal includes an artist book. What can a book do beside an immersive work?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It can give the viewer another pace. In an installation, sound and movement continue while attention shifts. A book can hold a frame beside an explanation long enough for someone to compare them. The proposal imagines a publication containing archive material, AI analysis, terrain development, visual research, and production notes. I would want it to let the reader follow a particular case through the process.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How would that case appear?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Perhaps as a sequence: a still from the recording, relevant speech, the task given to the system, its response, the grounds for the evaluation, and the form that enters the terrain. If the comparison remains uncertain, the page can keep that uncertainty visible. The reader should be able to see where we reached a limit. That would be a documentary artist book made through the project.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Does explaining the algorithm take away the image’s mystery?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It can change the experience. I often find that understanding a rule gives me more to watch. I begin to notice the decisions and the differences between what I expected and what happened. The image can remain beautiful after I know how it was made. If its meaning depends on hiding a basic misunderstanding about the process, I would want to address that.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What would you include from the flower project?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I would like to show how a material feature becomes a position, how recorded motion becomes a visual relation, and how the image changes through tests. The reader could follow a path across different forms. I would also separate early plans from what the completed work actually used. A project can have a useful history without pretending every proposed experiment succeeded or entered the final presentation.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Who belongs in that history?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The people whose work shaped the material and the result. The early flower proposal includes collaborators for Jeju field recording, prototype fabrication, animation development, installation, and documentation. Those tasks influence what the audience encounters. An artist’s first-person account can make a project sound as if it developed in one mind. A book gives us space to restore the relationships behind that voice.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How do your technical roles in other projects belong in this discussion?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" They have taught me that a system’s behavior is part of its artistic form. In a collaborative work, the timing of an image response or the position of a camera can change the encounter significantly. But the credit should remain specific. Contributing to Yaloo’s digital-human or VR work does not make it my sole authorship. Co-making ","b":false,"i":false},{"t":"Dada Myeongdong","b":false,"i":true},{"t":" with Jiyeon Oh has another structure again. Those differences help explain how the work came into being.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What can a book preserve that the installation cannot?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It can preserve a reason for changing something. A finished image often hides the moment when a collaborator objected, a test failed, or someone recognized a better direction. Those moments can be useful to another artist. They show judgment developing through contact with the material and other people.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Would you include participant disagreement?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Where they agree to share it, and where the context can be represented fairly. Disagreement can change the work. It should not become another attractive detail extracted for the book. Some conversations can remain private while still affecting the final form.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How do you imagine the project expanding to other places?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The proposal imagines new recordings producing other ranges. I would want each place to affect the method, including the questions we ask and the context we need. A series should have enough continuity for its parts to speak to each other. It should also be able to learn that the first arrangement was incomplete.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" And what would count as the book being finished?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A reader should be able to understand what we did, what we learned, and what remains open. The last page does not have to claim that the questions have ended.\n","b":false,"i":false}]}],"lesson":{"words":678,"vocab":[{"word":"continuity","ko":"연속성","form":"continuity","example":"A series should have enough continuity for its parts to speak to each other."},{"word":"specific","ko":"구체적인, 특정한","form":"specific","example":"But the credit should remain specific."},{"word":"documentation","ko":"문서화, 제작 기록","form":"documentation","example":"The early flower proposal includes collaborators for Jeju field recording, prototype fabrication, animation development, installation, and documentation."},{"word":"restore","ko":"복원하다","form":"restore","example":"A book gives us space to restore the relationships behind that voice."}],"grammar":{"title":"would like to + 동사원형","ko":"하고 싶은 일을 말하는 부드러운 표현이다. would like 뒤에 동작을 넣을 때 to를 쓴다.","quote":"Ahn: I would like to show how a material feature becomes a position, how recorded motion becomes a visual relation, and how the image changes through tests.","answer":"I would like to","blank":"Ahn:  ____  show how a material feature becomes a position, how recorded motion becomes a visual relation, and how the image changes through tests.","wrong":["I would like for","I would liked to"],"example":"I would like to return to the first scene.","translation":"첫 장면으로 돌아가고 싶다."},"question":"What can an artist book show about a finished image?","frame":"An artist book can show how __ became __."}},{"title":"12 The Window Remains Open","blocks":[{"kind":"p","r":[{"t":"At the beginning, I described looking through the window of a moving car.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to return to the person beside the road. We saw them briefly. We gave them a reason for standing there, and then the image passed.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Perhaps our explanation was right. Perhaps it was enough for the small amount of attention we gave the scene.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Then imagine that we stop.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The person has time to speak. Someone else arrives. The thing we thought was happening begins to change through another detail. We discover that the scene was already part of a longer life.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"My work keeps returning to that change in attention.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A flower carries a movement\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In ","b":false,"i":false},{"t":"The Algorithm of Flowers and the Grammar of Waves","b":false,"i":true},{"t":", one kind of movement becomes available through another form. A recorded turn can open into a bloom. A material surface can become the distribution of a field.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The translation makes a new image. It also gives me a reason to return to the source and see it differently.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That return matters. Otherwise the natural material can become something I used once and forgot after it produced the effect I wanted.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want the work to keep a connection to the conditions that made it possible.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A mountain carries a conversation\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In ","b":false,"i":false},{"t":"Mountains of Gathering and Valleys of Potential","b":false,"i":true},{"t":", the proposed transformation is more difficult because people’s lives enter the image directly.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A conversation becomes a recording. A recording becomes a task. A system gives an answer. We evaluate it and make a terrain. The viewer approaches and finds the conversation again.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Each stage adds something. Each stage can also lose something.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The route back cannot recover every detail, but it can prevent the final landscape from pretending it has no history.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"It can show the viewer that this mountain was made through decisions, and that the people within it continue beyond those decisions.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The creator remains in the room\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I am interested in creations that surprise their creators. I want to make systems capable of producing images I could not fully plan.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I also want to remain present when someone asks how those images came to be.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That is part of what coexistence means to me as an artist. I can allow a system to contribute without letting it absorb every responsibility. I can be changed by a result and still decide that it needs revision.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The relationship remains active.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Time to answer\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"If the two projects share a hope, it is that a viewer will feel the possibility of another encounter within a familiar image.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A stone can become large enough to change where we imagine ourselves. A flower can reveal a history of movement. A mountain can become a place where an ordinary voice is heard clearly.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The work does not have to make that voice extraordinary before it deserves attention.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to leave enough time for the scene to become more specific than our first description.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The window is still there.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We can choose when to stop.\n","b":false,"i":false}]}],"lesson":{"words":483,"vocab":[{"word":"transformation","ko":"변환, 변화","form":"transformation","example":"In Mountains of Gathering and Valleys of Potential, the proposed transformation is more difficult because people’s lives enter the image directly."},{"word":"bloom","ko":"꽃이 피다, 꽃","form":"bloom","example":"A recorded turn can open into a bloom."},{"word":"coexistence","ko":"공존","form":"coexistence","example":"That is part of what coexistence means to me as an artist."},{"word":"encounter","ko":"만남, 마주침","form":"encounter","example":"If the two projects share a hope, it is that a viewer will feel the possibility of another encounter within a familiar image."}],"grammar":{"title":"be interested in + 명사 또는 -ing","ko":"in은 전치사라 뒤에 명사, -ing 형태, 또는 what/how절이 올 수 있다.","quote":"I am interested in creations that surprise their creators.","answer":"I am interested in","blank":" ____  creations that surprise their creators.","wrong":["I am interested on","I am interest in"],"example":"I am interested in how people recognize a face.","translation":"사람들이 얼굴을 어떻게 알아보는지에 관심이 있다."},"question":"Why is it important to return to a source?","frame":"Returning to the source helps me notice __."}}]},{"title":"After the Silence","url":"https://docs.google.com/document/d/1KjsKJPeNpMKcmrZimqPOoVYSJbzvGD1InP1FSyixAyE","sections":[{"title":"1 The Lights Come Up","blocks":[{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" I want to begin with the title. We have spent the film watching people remain silent for very different reasons. When you say ","b":false,"i":false},{"t":"The Silence We Share","b":false,"i":true},{"t":", who is included in “we”?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Jonghoon Ahn:","b":true,"i":false},{"t":" The first answer is Hye-mi and Jun. They find a way to remain near each other without requiring an explanation. But the word becomes less comfortable as the film continues. The adults share a silence too. They withhold information, manage appearances, or speak on someone else’s behalf until that person has almost no room left to answer. By the time we reach the police station, silence has become part of several relationships at once. Then there is the audience. We have seen things the investigator does not know. We carry a version of the event that cannot enter the room where the questions are being asked.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Does that make us responsible for what we have seen?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It gives us a position to think about. Watching a fiction does not make us responsible for causing its events. But the film can make us aware of the habits we bring to witnessing. What do we notice? Which account do we accept first? Whose difficulty speaking becomes a reason to stop listening?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" The houses look safe. The routines look orderly.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That order is part of how the world protects its own appearance. A trimmed lawn tells us very little about the life behind a window. A report card can show improvement while hiding what it has cost someone to keep going. I wanted the film to remain close to these ordinary signs. The violence is already there. It does not need the whole neighborhood to look threatening before we can recognize it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" At the beginning, Hye-mi closes her window after seeing Jun. Some viewers may judge that action very harshly.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" They may. It is important that she does it. She sees him, and she withdraws. I do not want her to enter the story already prepared to save another person. She is eighteen and living under intense control. Recognition does not immediately give her a way to act. The distance between those two things is part of the film.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Then a relationship begins across that distance.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Through very small acts. A page moves between them. A problem receives an answer. Someone waits for the next exchange. The world around them places enormous value on achievement. They begin using schoolwork for another purpose: to make contact. The same page can carry pressure and care.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Do you think of the film as a story about rescue?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Rescue is part of what Hye-mi attempts. I am more interested in the conditions under which she has to attempt it. Two young people should not have to make a secret world in order to receive ordinary tenderness. Their relationship matters even though it cannot make the world around them safe. I would not want its value to depend on whether it produces a happy ending.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" What would you like us to keep in mind during this conversation?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Perhaps that a person’s silence does not carry its explanation on the surface. We have to keep asking what surrounds it.\n","b":false,"i":false}]}],"lesson":{"words":537,"vocab":[{"word":"withdraw","ko":"물러나다, 관계에서 한발 물러서다","form":"withdraws","example":"She sees him, and she withdraws."},{"word":"tenderness","ko":"다정함","form":"tenderness","example":"Two young people should not have to make a secret world in order to receive ordinary tenderness."},{"word":"recognition","ko":"알아봄, 인식","form":"Recognition","example":"Recognition does not immediately give her a way to act."},{"word":"witness","ko":"목격자, 목격하다","form":"witnessing","example":"But the film can make us aware of the habits we bring to witnessing."}],"grammar":{"title":"would + 동사원형","ko":"가정 속 선택이나 조심스러운 의견을 말한다. would 뒤에는 동사원형이 온다.","quote":"I would not want its value to depend on whether it produces a happy ending.","answer":"I would","blank":" ____  not want its value to depend on whether it produces a happy ending.","wrong":["I would to","I would am"],"example":"I would keep the original recording.","translation":"나라면 원본 녹음을 보존하겠다."},"question":"Who shares the silence in the film, and why?","frame":"For Hye-mi and Jun, silence can __. For the adults, it can __."}},{"title":"2 Learning to Watch","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" In your biographical statement, you describe choosing silence as a child after moving to the United States with your family. What does choosing mean in that situation?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It describes a way of getting through an environment where language had become difficult. If speaking exposed the distance between what I wanted to express and what I could say, remaining quiet could feel safer. There is a choice within that experience, but the conditions around the choice matter. I do not want to turn it into a simple story about being naturally quiet.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" You say that silence continued after you returned to Korea.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. The original language barrier changed, but the habit of watching remained. In competitive environments, it could be easier to observe expectations before deciding what to reveal. That is the connection I describe in the statement. I do not need every event in Hye-mi’s story to be something that happened to me. Fiction lets me develop a pressure through people and situations that have their own lives within the work.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How close is she to you?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" There is a closeness in the question she carries: what happens when someone learns that speaking may make their position less safe? Beyond that, she needs room to be a character rather than evidence of my biography. She has her own relationship with making clothes, with Jun, with her mother, and with the system supervising her. I want those particulars to lead us through the story.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Your biography also describes encountering Tarkovsky’s ","b":false,"i":false},{"t":"Stalker","b":false,"i":true},{"t":" in high school.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I describe it as discovering a way for cinema to carry emotion through time. The experience opened a possibility for me. A scene could ask me to remain with it rather than prove its force immediately. That influenced how I imagined visual storytelling. Duration could become an active part of the encounter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What did that give you as someone who was used to observing?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It suggested that watching could have a form. I could make a situation in which a viewer had time to notice something small, return to an earlier impression, or become uncertain about an easy explanation. The film could make room for a kind of attention I already knew, while also challenging its limits.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What limits?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Watching can become a shelter. It can also become a way to delay an answer. I do not want to assume that an observer always sees clearly or acts generously. Hye-mi watches from a window. Celine watches her wrist, her belongings, and her grades. The detective watches her face. Their attention has different purposes and consequences.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" So your own perspective is under examination too.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It should be. I am arranging what another person can see. That gives me influence over which character appears credible, which detail seems important, and when an explanation becomes available. If I ask viewers to question other people’s accounts, the film should allow them to question mine as well.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Did finding a cinematic voice mean leaving silence behind?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I think of it as gaining another way to work with it. I can give silence a setting, a duration, a relationship to sound. I can ask what it allows and what it conceals. It remains part of the voice.\n","b":false,"i":false}]}],"lesson":{"words":550,"vocab":[{"word":"assume","ko":"가정하다, 당연하다고 여기다","form":"assume","example":"I do not want to assume that an observer always sees clearly or acts generously."},{"word":"develop","ko":"발전시키다, 전개하다","form":"develop","example":"Fiction lets me develop a pressure through people and situations that have their own lives within the work."},{"word":"evidence","ko":"증거, 근거","form":"evidence","example":"Beyond that, she needs room to be a character rather than evidence of my biography."},{"word":"account","ko":"설명, 사건을 서술한 이야기","form":"accounts","example":"If I ask viewers to question other people’s accounts, the film should allow them to question mine as well."}],"grammar":{"title":"what happens when ~","ko":"when절은 상황이나 조건을 붙이고, what은 그 상황에서 일어나는 일을 묻는다.","quote":"Ahn: There is a closeness in the question she carries: what happens when someone learns that speaking may make their position less safe?","answer":"what happens when","blank":"Ahn: There is a closeness in the question she carries:  ____  someone learns that speaking may make their position less safe?","wrong":["what happen when","what happens which"],"example":"What happens when the audience sees the original footage?","translation":"관객이 원본 영상을 보면 어떤 일이 일어날까?"},"question":"How did silence shape the filmmaker’s way of watching?","frame":"Silence gave me time to __."}},{"title":"3 Who Shares the Silence","blocks":[{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Can we talk about the danger of treating silence as a single symbol? The film seems to keep resisting that.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A symbol becomes limiting when it tells us what to think before the scene has happened. If silence always means repression, then the children’s time together becomes difficult to understand. If it always means depth or dignity, the adults can hide inside it. I want the surrounding action to change what we hear in a quiet moment.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" The classroom gives silence a positive interpretation very early.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The teacher has a sentence abo
