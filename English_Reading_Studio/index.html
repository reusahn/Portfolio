<section class="hero"><div><p class="kicker">Jonghoon Ahn · English practice</p><h1>Read it. Say it.</h1><p>내 책으로 읽고, 익히고, 내 말로 설명하는 영어 연습.</p></div><div class="meter"><span class="small">47일 과정</span><div><strong id="progress-label"></strong> <span class="small">완료</span></div><progress id="progress-bar" max="47" value="0" aria-label="학습 진행률"></progress></div></section>

<script type="application/json" id="books">[{"title":"Under the First Sun","url":"https://docs.google.com/document/d/16YdUoi-BNzNUEK2jV_JINq5o_1q8vyx0NJdxmfOhmpg","sections":[{"title":"1 The Creature Looks Back","blocks":[{"kind":"p","r":[{"t":"I want to begin with a sentence I sometimes use to describe my work:\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"My art explores the relationships between nature, humans, and AI.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"It is a useful sentence, but it makes those three things sound more separate than they are.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"When I say nature, I am already speaking as a human. When I use AI, I am working with something made through human decisions, human labor, and physical resources. The machine belongs to the same world as the body standing beside it. We give these things different names so that we can talk about them. Then we can forget how much passes between them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"What interests me is the moment when a relationship becomes difficult to describe.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Humans emerge from nature and then begin to reshape the conditions of their own lives. We cultivate, build, extract, protect, destroy, and repair. We make tools that allow us to do things our bodies cannot do alone. Eventually, some of those tools begin to produce images of us, speak in our voices, and participate in how we understand ourselves.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We make a creation. Then we have to live with what it does.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That is where my work begins.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The desire to be exceeded\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"There is something strange about being a creator. We often want what we create to grow beyond us. A teacher hopes a student will discover something the teacher does not know. An artist hopes a work will continue to mean something after it leaves the studio.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Yet we also want to remain important to it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We want the creation to become independent, and we want it to remember where it came from. We want surprise, but we want a familiar kind of surprise. When the creation exceeds our expectations, pride and fear can arrive together.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"These examples are analogies. A child, an artwork, and an AI system have very different needs and responsibilities attached to them. I bring them into the same conversation because they expose a feeling: the difficulty of caring for something whose future we cannot fully direct.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In my work, a creation surpassing its creator does not have to mean a machine defeating a human. A digital image may travel farther than the person it represents. A recording may continue speaking after the speaker is gone. A work may become known for an interpretation its maker never intended.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The creation gains a life in the world. Its maker has to respond.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Nature as a difficult teacher\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I have asked: “Nature has chosen to coexist with us, so why shouldn’t we coexist with AI?”\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I use that sentence as a provocation. I do not mean that nature is a person who held a meeting and decided to tolerate humanity. Nature also includes processes that injure and kill us. The language of choosing gives an ethical shape to a relationship that is much larger than human intention.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"What the sentence asks me to consider is our dependence.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We live through relationships we did not invent and cannot completely control. Our lives require other forms of life, material conditions, and systems we barely notice until they change. Independence is something we experience within those relationships.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"So when I ask about coexistence with AI, I am asking how we will arrange a relationship we are already entering. Who makes the decisions? Who carries the costs? What can someone refuse? What happens when a system misunderstands a person and its description becomes more influential than that person’s own account?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"An artwork cannot settle these questions. It can give them a body, a room, and a duration.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A smaller beginning\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I work with digital humans, moving images, performance, and interactive systems. These forms allow me to create situations in which a representation and a living person become difficult to separate emotionally, even when we understand the technical difference.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"But I want to keep beginning with something specific.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A person remembers a place. Someone else listens. A dancer responds. A system generates an image. The person who first spoke looks at the result.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"What do they recognize?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"What do they want to correct?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"And will the work still allow them to speak?\n","b":false,"i":false}]}],"lesson":{"words":676,"vocab":[{"word":"representation","ko":"재현, 표상","form":"representation","example":"These forms allow me to create situations in which a representation and a living person become difficult to separate emotionally, even when we understand the technical difference."},{"word":"coexistence","ko":"공존","form":"coexistence","example":"So when I ask about coexistence with AI, I am asking how we will arrange a relationship we are already entering."},{"word":"intention","ko":"의도","form":"intention","example":"The language of choosing gives an ethical shape to a relationship that is much larger than human intention."},{"word":"account","ko":"설명, 사건을 서술한 이야기","form":"account","example":"What happens when a system misunderstands a person and its description becomes more influential than that person’s own account?"}],"grammar":{"title":"what happens when ~","ko":"when절은 상황이나 조건을 붙이고, what은 그 상황에서 일어나는 일을 묻는다.","quote":"What happens when a system misunderstands a person and its description becomes more influential than that person’s own account?","answer":"What happens when","blank":" ____  a system misunderstands a person and its description becomes more influential than that person’s own account?","wrong":["what happen when","what happens which"],"example":"What happens when the audience sees the original footage?","translation":"관객이 원본 영상을 보면 어떤 일이 일어날까?"},"question":"What relationship does your work explore?","frame":"My work explores the relationship between __ and __."}},{"title":"2 Beginning with a Person","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Your statement begins with nature, humans, and AI. Those are enormous subjects. Why does ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":" begin in a hair salon?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Jonghoon Ahn:","b":true,"i":false},{"t":" Because I need somewhere those subjects can become a relationship between people. A salon gives the project a place to listen. Someone works there, people visit, and the same gestures happen over many years. A place can carry a history through ordinary use. The project begins with Ko Insun, who runs a salon near Sanbangsan in Jeju. Her name becomes the title, ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":". We also hear the English words “in sun” within it. That opens a second image: a person living under their first sun.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What is a first sun?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Perhaps the first light someone encounters is a light on a hospital ceiling. Calling that a sun is a poetic way to begin. From there, I imagine someone who has lived for many years in the region where that first light appeared. The place changes around them. Shops disappear, roads change, and people leave. They carry versions of the place that are no longer available simply by walking through it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Does remaining in one place give someone a more authentic memory of it?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I would be careful with that word. A long relationship with a place gives someone a particular kind of knowledge. It does not make them the owner of its only true story. People who move away carry knowledge too. So do people who arrive later. For this project, long residence gives us a way to study repeated contact: the same route taken at different ages, the same room used by different generations, a gesture repeated until it becomes difficult to explain in words. It is a starting condition for the project. It is not a ranking of who belongs.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" The proposal also includes Matthew Ahn in the United States.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. The proposal identifies Matthew as a Korean American who was born in Orange County and has lived there for twenty-seven years. The planned research includes places around Santa Ana connected with his everyday life. That gives us another relationship to staying. A Korean American life in California and a salon owner’s life in Jeju should not become interchangeable symbols. I want the differences in generation, community, and everyday experience to stay present.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Then what holds the two stories together?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A set of questions. Which place comes to mind first? What did you call it then? Who was there? What did you do together? Is there a song, a movement, or a repeated action that returns with the memory? The questions are shared. The answers do not have to match.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Why ask what a place used to be called?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Because the official name may tell us how to locate it, while another name tells us how people used it. A place might be remembered through its owner, an activity, or a person who waited there. That name can hold a relationship an address does not explain. I am interested in whether a record can keep both kinds of information without forcing one to disappear.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What if someone cannot remember?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Then that becomes part of the encounter. We can give them time. We can return to the place, look at a drawing, or ask whether a movement helps. But the project should have room for an unanswered question. It would be easy to fill every gap because we are making a film and want a clear sequence. I want to resist that pressure when it would make the memory sound more certain than it is.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Is this your project alone?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" No. Jisu Ha and I are co-planning it through 영화몽. The proposal brings documentary, choreography, production, filming, editing, digital reconstruction, and AI image-making into the same process. My own responsibilities include research in the United States, digital people and spaces, and the mixed-reality system. Those responsibilities shape what I can say about the work. The choreographer will hear things I do not hear. The editor will discover connections through the material. The participants will know when an interpretation has missed something significant. The work depends on those differences becoming audible.\n","b":false,"i":false}]}],"lesson":{"words":697,"vocab":[{"word":"interpretation","ko":"해석","form":"interpretation","example":"The participants will know when an interpretation has missed something significant."},{"word":"encounter","ko":"만남, 마주침","form":"encounters","example":"Ahn: Perhaps the first light someone encounters is a light on a hospital ceiling."},{"word":"ordinary","ko":"일상적인, 평범한","form":"ordinary","example":"A place can carry a history through ordinary use."},{"word":"reconstruction","ko":"재구성, 복원","form":"reconstruction","example":"The proposal brings documentary, choreography, production, filming, editing, digital reconstruction, and AI image-making into the same process."}],"grammar":{"title":"want to + 동사원형","ko":"하고 싶은 일을 말할 때 want 뒤에 to와 동사원형을 쓴다.","quote":"I want to resist that pressure when it would make the memory sound more certain than it is.","answer":"I want to","blank":" ____  resist that pressure when it would make the memory sound more certain than it is.","wrong":["I want for","I want that"],"example":"I want to show how memory changes.","translation":"기억이 어떻게 달라지는지 보여주고 싶다."},"question":"Why did you choose to begin with a person?","frame":"I began with a person because __."}},{"title":"3 What a Record Leaves Out","blocks":[{"kind":"p","r":[{"t":"Imagine that you are recording someone describing a shop that has closed.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"They give you its name. Then they hesitate. They change the name. They point to the left, then slightly behind themselves. They laugh and say that someone else would remember better.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"You now have several decisions to make.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"You can keep the corrected name and remove the earlier one. You can turn the pointing gesture into a location on a map. You can cut the laugh because it interrupts the sentence. You can leave out the reference to the other person because that person does not appear in your film.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"After those decisions, you may have a much clearer record.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"You also have a different encounter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The finished record may tell us where the shop was. It may no longer tell us how someone reached that answer, whom they trusted, or how remembering felt in that moment.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Different meanings of noise\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In the ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":" proposal, we use the word “noise” to think about details that can disappear when human experience becomes organized data.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The word needs care. In a recording, noise can mean an electrical hum that prevents us from hearing someone. Removing that hum can help preserve their testimony. A hesitation, a laugh, or an uncertainty has a different function.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I do not want to keep every technical defect and call it humanity. I want to ask what we are removing and why.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Sometimes a pause carries no particular meaning. Sometimes it changes the meaning of everything around it. An editor has to listen closely enough to make that judgment and remain willing to reconsider it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"If we preserve only the sentence, we may lose the speaker’s relationship to the sentence.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Memory needs company\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Memory is a complicated source. A person may combine events, change a date, or remember a building differently from someone else. Documentary work has to make room for checking what can be checked.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"At the same time, a correction does not exhaust the significance of a memory.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Suppose an old photograph shows that a room was smaller than someone remembers. The photograph helps us establish its visible proportions. The remembered size may tell us something about being a child in that room, or about how many people seemed to fit inside it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"These are different claims. We can identify them clearly and allow them to remain near each other.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":", I want a place filmed in the present to sit beside a description of the past. Where photographs, maps, or other accounts exist, they can join the conversation. Where information is missing, I want the record to acknowledge the limit.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The archive as a sequence of decisions\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"An archive often looks stable because its decisions have become difficult to see.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Someone selected the clip. Someone wrote its title. Someone translated a word. Someone decided where the clip begins and ends. Someone gave permission for one use that may later be mistaken for permission for every use.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"For ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":", the proposed archive includes the original interviews and place recordings, the development of choreography, digital representations, AI inputs and outputs, and participant responses.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That means the archive can preserve more than the finished images. It can show a movement developing from a phrase, or a generated image changing after a photograph is added. It can show where the production team supplied information the participant did not provide.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The path matters because a convincing result can hide a weak connection to its source.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A limit on preservation\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"There is another difficulty. Recording more is not always a form of care.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A personal story may include someone who never agreed to be recorded. A participant may be comfortable speaking in a small room and uncomfortable seeing that moment circulated widely. A private detail can be useful to the production and still be inappropriate for public release.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"So the wish to preserve needs boundaries. Some material can be retained with restricted access. Some can be described without being shown. Some may need to be left out.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want an archive that can explain these decisions. Its gaps should not automatically be read as failures. A gap may also show that someone was able to set a boundary.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"If the archive is going to help us remember people, it should preserve some evidence of how we listened to them.\n","b":false,"i":false}]}],"lesson":{"words":703,"vocab":[{"word":"evidence","ko":"증거, 근거","form":"evidence","example":"If the archive is going to help us remember people, it should preserve some evidence of how we listened to them."},{"word":"technical","ko":"기술적인","form":"technical","example":"I do not want to keep every technical defect and call it humanity."},{"word":"gesture","ko":"몸짓","form":"gesture","example":"You can turn the pointing gesture into a location on a map."},{"word":"uncertainty","ko":"불확실성","form":"uncertainty","example":"A hesitation, a laugh, or an uncertainty has a different function."}],"grammar":{"title":"do not want to + 동사원형","ko":"want의 부정은 do not want로 만들고 그 뒤에 to와 동사원형을 쓴다.","quote":"I do not want to keep every technical defect and call it humanity.","answer":"I do not want to","blank":" ____  keep every technical defect and call it humanity.","wrong":["I do not wants to","I do not want for"],"example":"I do not want to simplify the story.","translation":"이야기를 단순화하고 싶지 않다."},"question":"What can get lost when we organize a record?","frame":"When we organize a record, we can lose __."}},{"title":"4 A Face That Can Answer","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" You have worked with digital humans. What draws you to a human face?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A face creates expectations very quickly. We look for attention, intention, and feeling. A small change in the eyes or the timing of a response can change what we think is happening. For someone making digital humans, that sensitivity is both an artistic material and a responsibility. The image can become emotionally convincing before it becomes technically perfect.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What does that responsibility look like in practice?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It begins with being precise about the relationship between the image and the person. A scan, a performed character, a recorded gesture, and a system generating new speech are different arrangements. They may appear on a similar face. The audience still needs a way to understand what kind of encounter they are having.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Your earlier project ","b":false,"i":false},{"t":"Seon-a’s Family","b":false,"i":true},{"t":" connects a real family’s story with digital humans and documentary material. What question does that raise for you?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It raises the question of what a representation carries when it enters a family relationship. A viewer may recognize a face through a detail that means very little to anyone else. The same image can feel intimate to one person and distant to another. I do not want to assume that increased realism produces increased recognition in every case. A technically accurate image can still feel wrong. A less detailed gesture can bring someone to mind very strongly.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Can a digital human preserve a person?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It can preserve and recombine traces: appearance, movement, a recording of a voice. Those traces can matter deeply. They do not give us unrestricted access to the person’s intentions. The difficulty becomes sharper when a system generates a new answer through a familiar face. The face can give the answer an authority it has not earned. Someone may know it is generated and still feel addressed by the person they recognize. That emotional experience deserves serious attention. It also makes the boundary between recorded speech and generated speech essential.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Does a digital person need to be uncomfortable to make that boundary visible?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" No. Discomfort is one possible material. It should not become a requirement. I am interested in the choices that let an audience understand the encounter: how the work is introduced, how the image behaves, and whether its sources are available. A beautiful or comforting image can still be clear about how it was made.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" You also contributed to Yaloo’s digital-human work involving Shin Inho. How do you discuss that alongside your own projects?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" By making the collaboration clear. A technical contribution has artistic consequences, but it does not make every work I participate in my sole authorship. Credit helps the audience understand whose questions shaped the project and how the work was made. Working within another artist’s project can also change the questions I bring to my own practice. I learn through the requirements of a particular image or movement, and through the decisions we have to make together.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" In ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":", are you trying to build digital versions of the participants?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The proposal places particular emphasis on digital representations of the dancers and on spaces developed from testimony and site material. It is important to describe that accurately. A digital body in the performance should not automatically be understood as a replica of the person whose memory we heard. That distinction is part of the work. A memory passes through another person’s body. The digital representation extends that response. Each stage has its own author and its own limits.\n","b":false,"i":false}]}],"lesson":{"words":595,"vocab":[{"word":"recognition","ko":"알아봄, 인식","form":"recognition","example":"I do not want to assume that increased realism produces increased recognition in every case."},{"word":"authority","ko":"권위, 판단을 좌우하는 힘","form":"authority","example":"The face can give the answer an authority it has not earned."},{"word":"performance","ko":"공연·연기 또는 시스템 성능","form":"performance","example":"A digital body in the performance should not automatically be understood as a replica of the person whose memory we heard."},{"word":"timing","ko":"타이밍, 동작이 일어나는 시점","form":"timing","example":"A small change in the eyes or the timing of a response can change what we think is happening."}],"grammar":{"title":"be interested in + 명사 또는 -ing","ko":"in은 전치사라 뒤에 명사, -ing 형태, 또는 what/how절이 올 수 있다.","quote":"I am interested in the choices that let an audience understand the encounter: how the work is introduced, how the image behaves, and whether its sources are available.","answer":"I am interested in","blank":" ____  the choices that let an audience understand the encounter: how the work is introduced, how the image behaves, and whether its sources are available.","wrong":["I am interested on","I am interest in"],"example":"I am interested in how people recognize a face.","translation":"사람들이 얼굴을 어떻게 알아보는지에 관심이 있다."},"question":"What does a realistic face let a viewer assume?","frame":"A realistic face can lead a viewer to assume __."}},{"title":"5 Three Ways to Remember a Place","blocks":[{"kind":"p","r":[{"t":"Imagine a place that someone remembers clearly but that we can no longer film as it was.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We can visit its location. We can record what stands there now. We can ask someone to describe it, draw it, or show us how they moved through it. We can listen to another person who remembers it differently.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Each of these actions gives us something. Together they also show how much remains unavailable.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"INSUN","b":false,"i":true},{"t":" approaches that condition through three forms: documentary, mixed-reality performance, and AI-generated moving images. The proposal sets out an approximately twenty-minute documentary and approximately twelve-minute performance and AI components. Those durations are a production framework. The artistic relationship begins with the material they share.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The documentary standing where something happened\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The documentary begins with interviews and present-day places. We plan to ask Ko Insun and Matthew Ahn about locations, people, events, songs, and habitual movements.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A place can be filmed in detail without revealing why it matters to someone. A doorway becomes different when we hear who used to stand there. A route can look ordinary until someone describes the person they took it with.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The camera has a task it can actually perform: recording what is in front of it now. The testimony introduces another time. The distance between them gives the image much of its meaning.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want the documentary to let that distance remain visible.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The performance listening through a body\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The choreographer receives the same testimony. In the proposal, Jooyoung Lee leads the choreography and performs, with an additional dancer to be arranged through that process.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The first encounter is with the voice and the words. Later, place recordings and the participant’s own gestures can become part of the development.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We can ask which phrase prompted a movement. We can ask how a silence changed its timing. We can ask where the choreographer’s own experience entered the response.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Those questions help us describe what is happening. A dancer does not have to claim access to another person’s memory to respond to it with care. The performance can show a meeting between experiences.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"This is why I want to record the rehearsal process. A finished gesture can appear inevitable. Rehearsal shows the listening, trials, and choices that gave it form.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The generated image giving a gap an appearance\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The AI component begins with testimony and descriptions of places. The proposal also considers how outputs change when drawings, photographs, and present-day recordings are added.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A generated image may make an uncertain place look complete. It may supply walls, clothing, objects, or light that the testimony never specified.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That can produce a compelling image. It can also make an assumption difficult to notice.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"For the work, I want to keep track of those additions. What did the participant say? What did the production team add to the instructions? What became visible only in the generated result? Which result did we select, and what did we remove in editing?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The image is an outcome of that whole process. Its beauty does not answer those questions for us.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Why place them together\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The three forms allow an audience to encounter a shared source through different operations.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A present-day recording can establish visible details. A dancer can give time and force to a response. A generated scene can make the act of supplying missing information unusually apparent.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"None of the forms is free from interpretation. The camera has a position. The performance has an author. The generated image has inputs, settings, selections, and an editor.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We plan to connect material through memory numbers and titles so that viewers can follow a particular memory across the work. That small organizational choice matters. Without it, three images might share a room while the relationship between them remains difficult to trace.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want someone to be able to return to the voice after seeing the movement, and to return to the movement after seeing the generated scene. Recognition may change each time.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The participant sees the work\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The proposed process includes sharing material with the participants and inviting them to respond to the presentation. If attending in person is difficult, recorded material and an online conversation can support that return.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We want to ask what feels familiar, what feels different, and whether anything in the work brings another memory to mind.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We cannot know those answers in advance. We also cannot assume that recognition will take the form of agreement.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A participant may value an unexpected interpretation. They may object to a beautiful image. They may point out a simple factual error that changes the whole scene. The project needs a way to receive those responses and decide what should be revised.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Until that encounter happens, the work still has someone to listen to.\n","b":false,"i":false}]}],"lesson":{"words":761,"vocab":[{"word":"assumption","ko":"가정, 당연하다고 여기는 생각","form":"assumption","example":"It can also make an assumption difficult to notice."},{"word":"duration","ko":"지속 시간","form":"durations","example":"Those durations are a production framework."},{"word":"testimony","ko":"증언","form":"testimony","example":"The testimony introduces another time."},{"word":"trace","ko":"흔적, 추적하다","form":"trace","example":"Without it, three images might share a room while the relationship between them remains difficult to trace."}],"grammar":{"title":"can / could + 동사원형","ko":"조동사 뒤에는 동사원형이 온다. become은 어떤 상태로 바뀌는 것을 나타낸다.","quote":"Later, place recordings and the participant’s own gestures can become part of the development.","answer":"can become","blank":"Later, place recordings and the participant’s own gestures  ____  part of the development.","wrong":["can becomes","could becoming"],"example":"A small gesture can become a clue.","translation":"작은 몸짓이 단서가 될 수 있다."},"question":"How do the three media interpret the same memory?","frame":"They begin with the same memory. Each one __."}},{"title":"6 The Body and Its Copies","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What becomes possible when a dancer performs beside a digital body?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" We can place different times in the same room. A dancer can stop while a recorded movement continues. A single movement can appear in several locations. The living performer can encounter a trace of an earlier action. Those possibilities interest me because memory also changes the timing of experience. Something finished can remain active in the present.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Is the copy meant to compete with the dancer?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Competition is one possible reading, especially when we talk about creations exceeding their creators. But the staging can make other relationships visible: accompaniment, delay, separation, or an attempt to follow. A recorded body can repeat a movement without becoming tired. The living dancer has to keep inhabiting the room. Their breathing, balance, and attention continue to change. Putting them together makes repetition more complicated than simply showing the same action again.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How much of this depends on advanced capture technology?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It depends on what a particular scene requires. The proposal includes color-and-depth capture, digital representations of movement, and trials with 3D Gaussian Splatting and short sequences of 4D reconstruction. Those methods offer different ways of representing a place or a body. We still have to test what can be captured, prepared, and displayed reliably. The proposal allows us to use 3D models and video when another method does not serve the scene well enough. I want to choose the representation through the encounter it makes possible. Technical novelty on its own does not tell me whether a scene works.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Why mixed reality?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It allows the audience to see the living dancer while encountering digital figures and reconstructed spaces in relation to the room. That shared spatial relationship matters to the project. If a figure appears to stand near a dancer, proximity becomes part of how we read them. If a memory seems to occupy the audience’s room, remembering becomes spatial in another way.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Can technology interrupt that experience?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Of course. A headset takes time to fit. An image may be uncomfortable to view. A spatial position can drift. An audience member may need help or may prefer to watch without a headset. These are part of the form we are choosing. The proposal includes seated viewing, separate movement areas, time for fitting and maintenance, and another screen output. Those details determine how the audience can actually meet the work.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" The proposed ending leaves the real dancer after the digital figures disappear. Why?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I want to explore what the audience notices when the images leave. The room is still occupied. Someone is still breathing and carrying the effort of the performance. The disappearance may make the body more noticeable. It may also leave the audience aware of the image they are still holding in their own minds. That ending is a planned gesture. Its meaning will depend on what happens before it and how the dancer develops it. I would want to learn from rehearsal before explaining it too firmly.\n","b":false,"i":false}]}],"lesson":{"words":508,"vocab":[{"word":"exceed","ko":"넘어서다, 초과하다","form":"exceeding","example":"Ahn: Competition is one possible reading, especially when we talk about creations exceeding their creators."},{"word":"reconstruct","ko":"재구성하다","form":"reconstructed","example":"Ahn: It allows the audience to see the living dancer while encountering digital figures and reconstructed spaces in relation to the room."},{"word":"capture","ko":"포착하다, 촬영·기록하다","form":"capture","example":"Interviewer: How much of this depends on advanced capture technology?"},{"word":"sequence","ko":"일련의 순서, 장면의 연속","form":"sequences","example":"The proposal includes color-and-depth capture, digital representations of movement, and trials with 3D Gaussian Splatting and short sequences of 4D reconstruction."}],"grammar":{"title":"would want to + 동사원형","ko":"아직 결정되지 않은 상황에서 어떤 선택을 하고 싶은지 조심스럽게 제안한다.","quote":"I would want to learn from rehearsal before explaining it too firmly.","answer":"I would want to","blank":" ____  learn from rehearsal before explaining it too firmly.","wrong":["I would want that","I would wanted to"],"example":"I would want to compare the two versions.","translation":"두 버전을 비교해보고 싶다."},"question":"What changes when a dancer shares a room with a digital body?","frame":"A recorded body can __ while the live performer __."}},{"title":"7 Who Is Speaking Through the Machine","blocks":[{"kind":"p","r":[{"t":"Suppose a person describes a room from childhood. An artist turns the description into a prompt. A system generates an image. The artist selects one version, adjusts its color, adds sound, and projects it across a wall.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We might say, “This is how AI remembers the room.”\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That sentence can be useful as a poetic title. As an account of the process, it leaves too much out.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The person supplied a memory. The artist decided what to carry into the prompt. The system produced an output under particular conditions. The editor decided which output the audience would see.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We need language that can follow those contributions.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The appeal of an independent witness\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":", there is a temptation to stage nature, the human body, and AI as three independent witnesses.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"It is an attractive structure. It is also unstable. A filmed landscape has been framed by a person. A choreographer has received selected material. An AI sequence has been generated and edited by a team.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The instability can be productive if we acknowledge it. The work can invite a viewer to ask how each apparent witness was brought into the room.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"When I describe AI as interpreting testimony, I am using a term for an operation whose human and technical conditions we should keep available for examination. The resulting image does not establish that the system has felt the speaker’s loss or understood the place as its residents do.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The image can still affect us. We are responsible for how we present that effect.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Selection is authorship\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"An artist may generate many images and exhibit only one. The rejected results disappear. The selected image begins to stand for the whole process.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to think carefully about that moment.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Was the image selected because it followed the testimony closely? Because it was surprising? Because it matched the visual style of the rest of the exhibition? Because it made a useful emotional transition?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Any of those may be a reasonable artistic decision. They lead to different claims about the work.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"If I choose the most moving result, I should not describe its emotional force as an unfiltered discovery made by the machine. My choice helped produce that force.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Keeping inputs, settings, alternative outputs, and edits can help us return to the decision later. The archive does not remove the artist’s judgment. It makes that judgment easier to discuss.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"What the interface lets someone do\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"My interest in human-computer interaction begins here: with what an encounter permits.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Can someone correct the record attached to their name? Can they find the original recording behind an edited scene? Can they understand whether a face is playing a recorded response or generating a new one? Can they leave the experience without losing access to the rest of the work?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Those questions may sound practical beside a discussion of humanity. For me, they are part of the same discussion. A person’s ability to respond is shaped by the interface we give them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A large projection can make an image feel authoritative. A familiar face can make speech feel personal. A seamless transition can make two different kinds of material appear to have the same status.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Artistic form distributes attention and authority. It tells people what to trust, sometimes before they have time to ask.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Coexistence has conditions\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to remain open to what AI can make possible in art. That openness should include asking difficult questions about its use.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Where did this material come from? Who agreed to its use? Whose work made the system and the artwork possible? Who can challenge the result?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"These questions do not disappear because the output is beautiful or because the project is small. A small project gives us a place to practice answering them concretely.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"For ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":", that practice can begin with a traceable relationship between testimony and representation, clear credit, and a meaningful opportunity for participants to respond.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I do not imagine coexistence as a final state of harmony. I imagine a relationship that requires repeated decisions, including the decision to change how a technology is being used.\n","b":false,"i":false}]}],"lesson":{"words":663,"vocab":[{"word":"witness","ko":"목격자, 목격하다","form":"witnesses","example":"In INSUN, there is a temptation to stage nature, the human body, and AI as three independent witnesses."},{"word":"interpret","ko":"해석하다","form":"interpreting","example":"When I describe AI as interpreting testimony, I am using a term for an operation whose human and technical conditions we should keep available for examination."},{"word":"independent","ko":"독립적인","form":"independent","example":"In INSUN, there is a temptation to stage nature, the human body, and AI as three independent witnesses."},{"word":"archive","ko":"기록물 보관소, 기록을 보관하다","form":"archive","example":"The archive does not remove the artist’s judgment."}],"grammar":{"title":"can / could help + 동사원형","ko":"help 뒤에 동사원형 또는 to부정사가 올 수 있다. 조동사 뒤의 help에는 -s를 붙이지 않는다.","quote":"Keeping inputs, settings, alternative outputs, and edits can help us return to the decision later.","answer":"can help","blank":"Keeping inputs, settings, alternative outputs, and edits  ____  us return to the decision later.","wrong":["can helps","could helping"],"example":"The soundtrack can help establish a rhythm.","translation":"사운드트랙이 리듬을 만드는 데 도움이 될 수 있다."},"question":"Where do human decisions enter a generated image?","frame":"Human decisions enter when __."}},{"title":"8 Questions from the Room","blocks":[{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" You speak about keeping human noise. Does that make human error valuable simply because it is human?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" No. An error can cause harm, and some errors need correction. I am interested in keeping enough context to understand what happened. A wrong date and an uncertain feeling require different responses. Calling both noise would make the record less useful.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" If a participant remembers a place inaccurately, which version goes into the work?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Where there is evidence, I want to show what it supports. We can also preserve how the participant remembers the place, while identifying that as their recollection. The difficulty is finding a form that allows the audience to distinguish those things without humiliating the speaker.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Could AI help a person recover a forgotten memory?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A generated image might prompt a response or bring something to mind. It might also introduce details that were never there. I would not treat recognition alone as proof that the image has recovered the past. If a new memory emerges, we can record the circumstances and explore it carefully with the person.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What if the generated image is more moving than the documentary?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Then I want to ask how it creates that feeling. Perhaps its lighting or rhythm is familiar. Perhaps the editor has made an effective choice. Emotional force matters to the artwork, but it does not establish historical accuracy. Keeping the forms connected to their sources gives us a way to examine the feeling.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Why involve dance if the subject is already speaking?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Because listening can lead to another form of response. A body can work with duration, effort, distance, and repetition in ways that interest me. The choreography introduces another person’s experience into the conversation. We should give it that authorship rather than treating it as a transparent illustration of the testimony.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Is a dancer’s response more authentic than an AI image?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I would rather describe the conditions of each. The dancer can speak about their choices, revise a movement through rehearsal, and enter a relationship with the participant. The generated image comes through a different process involving the system and the people operating and editing it. Those differences matter more to this project than a single ranking of authenticity.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" You have participated in work involving memorial gestures. How does that connect with this project?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" In ","b":false,"i":false},{"t":"To Eternity","b":false,"i":true},{"t":", my role as coding director involved a body-recognition system for a digital memorial experience. The work connected a visitor’s flower-offering gesture and image with photographs associated with the May 18 Democratic Uprising. It gives me a concrete example of an interface asking the body to participate in remembering. With ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":", I am returning to the question of how a physical action changes our relationship to recorded material, within a different history and collaborative structure.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Are you afraid that artists will become unnecessary?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I can imagine changes that make parts of artistic work harder to sustain. I also see questions that still require judgment: whom to listen to, what to show, what to verify, and when to stop. Having a system produce material does not settle those decisions. The economic conditions of being an artist are another part of that conversation, and I would not claim an artwork alone can resolve them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" If you welcome AI exceeding us, where do you draw a limit?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Exceeding a person at a task does not grant unrestricted authority over that person. A system may generate images faster than I can. That gives me a capability to use and evaluate. It does not decide who may speak for a participant or what material they should be required to share.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What if a participant dislikes the final work?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" We need to understand what they are objecting to. A factual error, an unwanted disclosure, and an interpretation they find unfamiliar are different issues. I want to hear the concern privately before making it part of any public conversation. Then we can discuss correction, revision, or withdrawal of particular material according to the agreements and circumstances. Asking for feedback would mean very little if every possible answer left the work untouched.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What would failure look like for ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":"?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" One failure would be an impressive installation in which the participants’ lives have become interchangeable material. Another would be a comparison so predetermined that every form simply proves what we already wanted to say about humans and AI. The project should be able to change what we think.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What do you hope someone carries away?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Perhaps a question they want to ask someone they know. The name of a place that no longer exists. A movement they had stopped noticing. I would like the work to make an ordinary conversation feel worth the time it takes.\n","b":false,"i":false}]}],"lesson":{"words":818,"vocab":[{"word":"disclosure","ko":"정보 공개, 알림","form":"disclosure","example":"A factual error, an unwanted disclosure, and an interpretation they find unfamiliar are different issues."},{"word":"context","ko":"맥락","form":"context","example":"I am interested in keeping enough context to understand what happened."},{"word":"authorship","ko":"저작·창작의 주체","form":"authorship","example":"We should give it that authorship rather than treating it as a transparent illustration of the testimony."},{"word":"rhythm","ko":"리듬, 반복되는 흐름","form":"rhythm","example":"Perhaps its lighting or rhythm is familiar."}],"grammar":{"title":"need to + 동사원형","ko":"해야 할 필요가 있는 행동을 말한다. 주어에 따라 need 또는 needs를 쓴다.","quote":"Ahn: We need to understand what they are objecting to.","answer":"need to","blank":"Ahn: We  ____  understand what they are objecting to.","wrong":["needs for","need that to"],"example":"The character needs to respond in real time.","translation":"캐릭터가 실시간으로 반응해야 한다."},"question":"How would you respond if someone disliked their representation?","frame":"I would first ask __. Then we could __."}},{"title":"9 Making Room for an Answer","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Your practice moves between film, digital humans, performance, and code. Is there a medium you think of as home?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I am more interested in the problem that makes a medium necessary. A film gives me particular ways to work with time and testimony. Performance puts a living person in a situation that continues changing. Code lets me establish behavior and conditions for an encounter. Digital humans make the relationship between a person and an image unusually immediate. Sometimes I need more than one because the question changes as it moves between them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Does that make it difficult to explain what you do?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Sometimes. A list of technologies can sound clear while telling someone very little about the work. I can name a capture system and a game engine, and still leave out why there is a person in the room. I want to become more precise about the relationship first. After that, the technical choices become easier to explain.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Where do you begin technically?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" With a small scene that tests the experience we need. For ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":", that might mean a short captured movement beside a living performer, seen from the audience’s intended position. We can learn about timing, visibility, scale, and comfort before building a complicated sequence. A test can tell us that a beautiful representation is difficult to read in the actual room. That is useful information. We should be able to change the representation rather than spending the whole production defending it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What can the technical artist contribute beyond implementation?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The system shapes the possible work. The way a body is captured affects which movements survive. The way a scene is controlled affects what can happen during a performance. Decisions about delay, repetition, and scale become artistic decisions as soon as someone encounters them. I want those decisions discussed with the other collaborators. A choreographer may discover a meaningful use for a limitation I first treated as a problem. I may discover that a technical effect distracts from something the dancer is doing carefully.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How does your work with AI and dance connect to ","b":false,"i":false},{"t":"Dream of Salmon","b":false,"i":true},{"t":"?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" My contribution there was media-art and AI-video production for a performance involving dancers. It belongs to the practical background I bring to ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":": making images that have to meet bodies, sound, and a particular presentation space. Each project asks for its own relationship. Experience helps me plan, but it should not make every new work follow the same structure.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" You keep returning to the right to correct an image. Is that your definition of human agency?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It is one concrete part of it. I do not think a single action can define agency completely. But the possibility of correction tells us a lot about a relationship. If someone’s words can be turned into a large public image, and their response has no route back into the work, the relationship is very uneven. I want to design a route back.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Can that slow the work down?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. It can require another conversation, another edit, or a scene we decide to give up. Production needs a schedule, and people need clarity about what can still change. The answer is to plan for review early enough that it can matter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Are you trying to preserve humanity through art?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That is part of the question driving me, but I want to be careful about making humanity sound like a substance I can extract and store. I can record a voice. I can preserve a gesture. I can organize a situation where someone listens and responds. The person will continue living beyond those records, and their relationship to them may change. For now, preserving humanity means working on those relationships: allowing people to be more complicated than a useful description, keeping room for uncertainty, and making it possible for someone to answer back.\n","b":false,"i":false}]}],"lesson":{"words":653,"vocab":[{"word":"repetition","ko":"반복","form":"repetition","example":"Decisions about delay, repetition, and scale become artistic decisions as soon as someone encounters them."},{"word":"preserve","ko":"보존하다, 지키다","form":"preserve","example":"Interviewer: Are you trying to preserve humanity through art?"},{"word":"precise","ko":"정확한, 정밀한","form":"precise","example":"I want to become more precise about the relationship first."},{"word":"establish","ko":"확립하다, 확인하다","form":"establish","example":"Code lets me establish behavior and conditions for an encounter."}],"grammar":{"title":"can + 동사원형","ko":"가능하거나 할 수 있는 일을 말한다. can 뒤에 to나 -s를 붙이지 않는다.","quote":"I can name a capture system and a game engine, and still leave out why there is a person in the room.","answer":"I can","blank":" ____  name a capture system and a game engine, and still leave out why there is a person in the room.","wrong":["I can to","I can am"],"example":"I can compare the two versions.","translation":"두 버전을 비교할 수 있다."},"question":"How do you decide which medium to use?","frame":"I choose a medium based on __."}},{"title":"10 Returning the Image","blocks":[{"kind":"p","r":[{"t":"There is a moment I am working toward in ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":".\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Someone whose memory helped begin the project encounters the work. They see the present-day place, the movement, and the generated scene. Then there is time for a conversation.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I cannot write their answer here. The encounter has not happened, and the answer belongs to them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I can prepare the conditions around it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I can keep the sources available. I can make clear where we added something. I can leave enough time in the schedule for a response to have consequences. I can avoid building a conclusion that requires the participant to feel a particular way.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Those choices may seem small beside the ambition of making an immersive artwork. They determine whether the work can continue to have a relationship with the person whose life it represents.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The image travels\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"After an exhibition, an image can travel without much of its original context. It can become a short clip, a photograph, a presentation slide, or an example in another conversation.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That is one way a creation exceeds its creator. It goes somewhere we cannot accompany it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We cannot control every future encounter. We can give the image a more responsible beginning. We can attach clear descriptions and credit. We can distinguish testimony from interpretation. We can decide which parts of the archive should remain private. We can preserve a way for corrections to be found.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to treat those actions as part of making the work.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"What I mean by coexistence\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"When I speak about nature, humans, and AI, I am trying to understand relationships that contain dependence, power, uncertainty, and the possibility of care.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I do not expect them to settle into a perfect balance. People do not always understand each other. Technologies change. Places change. A representation that once seemed generous can later feel restrictive.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Coexistence requires returning to the relationship and asking what has changed.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That is also why the proposed expansion of ","b":false,"i":false},{"t":"INSUN","b":false,"i":true},{"t":" matters to me. Jeju and the United States are a beginning. Other places would bring other histories, other ways of staying, and other understandings of the first sun. The method would have to remain capable of learning from them.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Under the first sun\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"At the beginning of the project, a name opens into an image: a person beneath a first light.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That image helps me remember how little of a life a recording can hold. Before the interview, there were years of gestures, relationships, and ordinary days. After the interview, there will be more.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We arrive with equipment and questions. We make something from what we are allowed to hear and see. Then we return it to the world, where it begins to affect other people.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to stay attentive to that return.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The next question may come from the person looking at the image.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want the work to be ready to hear it.\n","b":false,"i":false}]}],"lesson":{"words":471,"vocab":[{"word":"dependence","ko":"의존","form":"dependence","example":"When I speak about nature, humans, and AI, I am trying to understand relationships that contain dependence, power, uncertainty, and the possibility of care."},{"word":"distinguish","ko":"구별하다","form":"distinguish","example":"We can distinguish testimony from interpretation."},{"word":"consequence","ko":"결과, 여파","form":"consequences","example":"I can leave enough time in the schedule for a response to have consequences."},{"word":"remain","ko":"남다, 계속 ~한 상태다","form":"remain","example":"We can decide which parts of the archive should remain private."}],"grammar":{"title":"would have to + 동사원형","ko":"가정한 상황에서 무엇이 필요할지 말한다. would 뒤의 have는 원형이다.","quote":"The method would have to remain capable of learning from them.","answer":"would have to","blank":"The method  ____  remain capable of learning from them.","wrong":["would has to","would having to"],"example":"We would have to ask the people involved.","translation":"관련된 사람들에게 물어봐야 할 것이다."},"question":"What should happen after you return an image to its source?","frame":"After I return the image, I want to __."}}]},{"title":"Where the Landscape Becomes Human","url":"https://docs.google.com/document/d/1ZW9rCBG0ZotwMj2D9LQCdU8ti-IKzrAw2_bobOpi-M0","sections":[{"title":"1 Looking Out of the Window","blocks":[{"kind":"p","r":[{"t":"I sometimes think of cinema as looking through the window of a moving car.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The frame stays close to us. Everything beyond it changes. A building appears and disappears before we know what happens inside. We see someone waiting by a road. We invent a small story and continue moving.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The window gives us an image of the world. Our speed decides how much of it we can know.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That experience has stayed with me as I have moved between film and media art. I am interested in what happens when a passing image becomes somewhere we can remain. Can a viewer approach it, change the angle, or return to a detail that would otherwise be gone?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Two of my projects approach that question through landscape.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In ","b":false,"i":false},{"t":"The Algorithm of Flowers and the Grammar of Waves","b":false,"i":true},{"t":", the starting materials are the surfaces of Jeju basalt and the movement of water. A stone contains positions from which a digital world can begin. Movement recorded at sea becomes a way for imagined flowers to take shape.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In the proposed ","b":false,"i":false},{"t":"Mountains of Gathering and Valleys of Potential","b":false,"i":true},{"t":", the starting materials are recordings of people in Jeju and Seoul. AI interpretations are compared with the recordings and available accounts of what happened. Moments of misunderstanding become material for a landscape.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"One work begins with natural forms and asks what they might generate within technology. The other begins with human relationships and asks what technology can make of them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Their connection is movement.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Moving toward something\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A floating object turns on water. A dancer crosses a space. Someone walks to a salon where other people have already gathered. These movements can all be recorded as changing positions.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Yet position alone does not explain the encounter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The floating object moves through a physical relationship with water and with the conditions of the recording. The dancer moves through a score, a decision, or a response. The person walking to the salon may be going to see someone they have known for decades.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"When we convert these movements into data, we gain something useful. We also choose what becomes available to the next system.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want my work to remain attentive to that choice.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A creation that looks back\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"My art explores the relationships between nature, humans, and AI. I think about creators and their creations, including the possibility that a creation may exceed the intentions of its maker.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That possibility produces mixed feelings. We want something new to appear. We also want to recognize our place within it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A system can produce an image I did not predict. A representation of people can gain an authority they never gave it. An artwork can become known for a meaning I had not considered. These are different ways a creation begins to act beyond the immediate intentions that shaped it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"For me, the artistic task continues after the surprise. I have to ask what the result does, whom it affects, and whether I should change the conditions that produced it.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Looking again\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The landscape gives me a form in which these questions can remain open.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"From a distance, a mountain looks continuous. A flower field becomes a surface of color. Come closer and their apparent unity begins to break apart.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The question is what becomes visible when it does.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In one work, we may find the path of a movement inside a flower. In another, a person’s voice inside a mountain.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to give the viewer time to notice the change.\n","b":false,"i":false}]}],"lesson":{"words":573,"vocab":[{"word":"surface","ko":"표면","form":"surfaces","example":"In The Algorithm of Flowers and the Grammar of Waves, the starting materials are the surfaces of Jeju basalt and the movement of water."},{"word":"landscape","ko":"풍경, 지형","form":"landscape","example":"Two of my projects approach that question through landscape."},{"word":"basalt","ko":"현무암","form":"basalt","example":"In The Algorithm of Flowers and the Grammar of Waves, the starting materials are the surfaces of Jeju basalt and the movement of water."},{"word":"misunderstanding","ko":"오해","form":"misunderstanding","example":"Moments of misunderstanding become material for a landscape."}],"grammar":{"title":"think about + 명사 또는 -ing","ko":"about 뒤에 생각의 대상을 넣는다. 동작을 넣을 때는 -ing를 쓸 수 있다.","quote":"I think about creators and their creations, including the possibility that a creation may exceed the intentions of its maker.","answer":"I think about","blank":" ____  creators and their creations, including the possibility that a creation may exceed the intentions of its maker.","wrong":["I think to","I thinks about"],"example":"I think about preserving the original voice.","translation":"원래 목소리를 보존하는 일을 생각한다."},"question":"What changes when you slow down and look out a window?","frame":"When I slow down, I begin to notice __."}},{"title":"2 Giving a Stone a View","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Why begin with basalt?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Jonghoon Ahn:","b":true,"i":false},{"t":" I was interested in the surface of a particular material. Basalt has cavities and irregularities that can become starting points for another structure. In the early proposal, I describe scanning the stone and working with roughly circular forms visible on its surface. Those forms give me a distribution. Instead of arranging every flower by hand, I can begin with positions that come from the stone.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" So the stone becomes a kind of plan for a garden?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes, although that description already includes my decisions. I choose which features to extract, how to simplify them, and how to translate a surface into another arrangement. I like that the material can resist a familiar composition. The cavities do not arrive evenly spaced for my convenience. Their differences can force me to reconsider what an attractive field should look like.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" You also imagine looking from inside the stone.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The early proposal places a virtual viewpoint within the basalt, looking outward through an opening. It changes the scale at which the object can be encountered. Something we might hold becomes an environment around us. That shift interests me. We usually look at a stone from a human position. I wanted to build a situation in which the image seems to begin from the stone.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Do you mean that the stone has a point of view?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I mean that the work gives it a position from which an image appears. The camera position is something I construct. I am not claiming that the stone experiences vision. The distinction helps the artistic question stay useful. I can ask what changes when I organize an encounter around a material without claiming to know its inner life.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What changes?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" My habits become more noticeable. The usual human height, the horizon, the comfortable viewing distance: these choices can feel natural because we repeat them. Moving the viewpoint into the stone makes them available for reconsideration.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" The proposal includes a physical object that a visitor can rotate.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That was an interaction plan for the prototype. A printed basalt form would connect its rotation to a virtual camera. Turning the object would turn the view. I was interested in the connection between a small movement in the hand and a large movement across the room. The person would have to learn the relationship through the object.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Is control the point of that interaction?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Control is part of the experience. So is adjustment. A person turns something, sees the result, and changes how they handle it. I want the material and the system to influence the pace of that exchange.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Why Jeju specifically?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Because the
