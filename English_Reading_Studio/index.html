t what the next repair might otherwise remove.\n","b":false,"i":false}]}],"lesson":{"words":629,"vocab":[{"word":"rebuild","ko":"다시 만들다","form":"rebuild","example":"After the rebuild, Yaloo, her granddaughter, recognized Shininho much more strongly."},{"word":"feasibility","ko":"실현 가능성","form":"feasibility","example":"For the feasibility version, I rebuilt symmetry, reduced and repaired the mesh, and used a fast auto-rigging path."},{"word":"topology","ko":"3D 메시를 이루는 점·선·면의 연결 구조","form":"topology","example":"That was never something a topology change could establish."},{"word":"asymmetry","ko":"비대칭","form":"asymmetry","example":"I do not mean that every asymmetry is sacred or that every scan artifact should survive."}],"grammar":{"title":"can + 동사원형","ko":"가능하거나 할 수 있는 일을 말한다. can 뒤에 to나 -s를 붙이지 않는다.","quote":"I can ask what changed between versions, whose judgment revealed the difference, and which decisions should now become part of the pipeline.","answer":"I can","blank":" ____  ask what changed between versions, whose judgment revealed the difference, and which decisions should now become part of the pipeline.","wrong":["I can to","I can am"],"example":"I can compare the two versions.","translation":"두 버전을 비교할 수 있다."},"question":"Why did you return to the original scan?","frame":"The first prototype worked technically. I returned to the scan because __."}},{"title":"3 Model A and the Question of Origin","blocks":[{"kind":"p","r":[{"t":"I write the first model this way:\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Model A: Human ≥ Sound ≥ Image ≥ AI","b":true,"i":false},{"t":"\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The order begins with a person making and judging representations. It asks where an image or sound comes from, what experience supports it, and how someone recognizes it as belonging to a world.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I use the greater-than-or-equal signs as a shorthand for an arrangement of authority. They are not measured quantities. A person is not mathematically greater than a sound, and the model cannot rank the value of different beings.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"It is a way to make a particular relationship discussable.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Why begin with sound\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In Model A, I give sound a strong position because it can organize the time and space around an image.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Imagine looking through the window of a moving car. The view continues, but the engine sound gives way to running water. For some viewers, that mismatch would become an immediate cue that the scene has changed its relationship to ordinary reality.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The example is a thought experiment. Its effect would depend on the person, the context, and the task. Someone might understand it as a soundtrack choice and continue without confusion. Someone else might be disturbed more by a visual discontinuity.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I keep the example because it makes a production question tangible: which cue carries the world of this scene for this viewer?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Sound can locate activity outside the frame. A breath can change the apparent condition of a body. Reverberation can make an unseen room feel larger. The image and sound may reinforce each other, or one may make the other difficult to believe.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A working order has limits\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Placing sound above image should not become a claim that everyone verifies reality through hearing first. People have different sensory access and different perceptual habits. A framework about human experience becomes less useful if it quietly defines one sensory profile as the complete human.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"My order expresses an emphasis developed through audiovisual practice. It gives me a hypothesis to examine, rather than a universal rule that every viewer must confirm.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The same care applies to placing AI at the end. The model asks us to look upstream at the sources and decisions behind generated representations. It does not establish that every training source is made by a human hand or that every AI system follows the same learning sequence.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The essential question is how the representation depends on a world and on choices that its finished appearance may conceal.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The expanded model\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The digital human makes the relationship more specific. I write an expanded form:\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Human ≥ Digital Human ≥ X₁ ≥ X₂ ≥ X₃ ≥ … ≥ Sound ≥ Image ≥ AI","b":true,"i":false},{"t":"\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Here, the digital human is an intermediary: something close enough to a person in appearance and behavior that a mismatch can expose a criterion the viewer is using.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The X-layers name those criteria before I have a complete account of them. In the current framework, I emphasize historical context, relational recognition, and biological finitude.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The diagram is a conceptual map. It should not be read as the literal order in which signals pass through a brain, or as proof that the layers are independent of each other.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"What a missing quality can tell us\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A familiar observer says that the face looks right but the smile does not feel familiar. A historical reconstruction appears convincing from its source angle and uncertain from another. An artificial figure performs distress while its state resets without consequence.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Each case invites a different question. The word “real” is too broad to settle all of them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We can ask about likeness, identity, social presence, apparent vulnerability, or belief that an event occurred. Those judgments can come apart. Someone may know an avatar is artificial and still feel addressed by it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want the digital human to help separate the questions.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Difficult to isolate is not impossible to study\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I describe the X-layers as nonlinear and difficult to record. I want to keep the difficulty without turning it into a claim that measurement is impossible.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We can observe responses, compare conditions, record behavior, and ask people to explain their judgments. Those methods will have limits. They can still teach us something.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The framework becomes more useful when it tells me what to test next.\n","b":false,"i":false}]}],"lesson":{"words":672,"vocab":[{"word":"likeness","ko":"닮은 정도, 외형의 유사성","form":"likeness","example":"We can ask about likeness, identity, social presence, apparent vulnerability, or belief that an event occurred."},{"word":"perceptual","ko":"지각에 관한","form":"perceptual","example":"People have different sensory access and different perceptual habits."},{"word":"finitude","ko":"유한성","form":"finitude","example":"In the current framework, I emphasize historical context, relational recognition, and biological finitude."},{"word":"vulnerability","ko":"취약성","form":"vulnerability","example":"We can ask about likeness, identity, social presence, apparent vulnerability, or belief that an event occurred."}],"grammar":{"title":"want to + 동사원형","ko":"하고 싶은 일을 말할 때 want 뒤에 to와 동사원형을 쓴다.","quote":"I want to keep the difficulty without turning it into a claim that measurement is impossible.","answer":"I want to","blank":" ____  keep the difficulty without turning it into a claim that measurement is impossible.","wrong":["I want for","I want that"],"example":"I want to show how memory changes.","translation":"기억이 어떻게 달라지는지 보여주고 싶다."},"question":"What does Model A help you ask about an image?","frame":"Model A makes me ask where __ comes from."}},{"title":"4 A Historical Face Begins with Missing Information","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" You had a scan for Shininho. What did you have for Gang Se-hwang?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A historical portrait as the central visual source. There was no living subject to scan. The project required a reconstruction that could move beyond the view supplied by the painting. I started with the visible evidence: proportions, head orientation, silhouette, and the painted suggestion of depth. The first goal was to make the sculpt read convincingly from that reference angle.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What happened to the parts the portrait did not show?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I constructed plausible production geometry. That is an important boundary. A character needs a head that can rotate, but the fact that I can build the unseen region does not make it a recovered historical fact. The project contains supported reconstruction and informed invention. I want to be able to identify the difference.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How did it become an animated character?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I sculpted in ZBrush, used ZWrap to transfer the likeness into a production structure, refined UVs in Maya, and developed surface information for the custom character. I built a facial system around fifty-two ARKit expression channels and expanded it with additional targets, including corrective and combination shapes. The production rig contained approximately 256 blendshapes overall. Recorded iPhone coefficients then had to map into that custom system through a CSV-to-Maya workflow.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What kind of problem did that create?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" One import failure came from a naming mismatch. The coefficient names in the data did not match the case convention expected by the rig and tool. Normalizing the names allowed the values to reach the intended channels. It is a small example, but it matters. A face that appears unwilling to move can have a very ordinary data-interface problem. I need to diagnose that before building a theory around the expression.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" In your framework, the historical figure becomes X₁, the layer of history and records. How does that follow from the work?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The production asks what a record can support. A portrait can help reconstruct an appearance. It gives much less direct access to everyday timing, a habitual gesture, or how this person moved through a particular social situation. The character can be carefully made and remain an interpretation of the evidence. I call that historical gap X₁.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Can animation research reduce the gap?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Certainly. Costume research, written accounts, and historically informed performance can improve the interpretation. I do not want X₁ to excuse poor research by declaring the task impossible. The limit is the claim we make about the result. More informed performance is still different from recovering an unrecorded performance by the historical person.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What about the voice?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" In this project, one performer supplied the visible physical and facial performance, and a separate professional voice actor supplied the final dialogue. The final voice was dubbed. That detail matters because calling every digital-human voice synthetic would erase the performers’ work and misdescribe the pipeline.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" The clothing also moves. Was that all calculated live?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" No. I used offline garment simulation in Marvelous Designer and brought the results into Unity as per-shot Alembic caches, synchronized through Timeline. The real-time cloth option did not give the required result. A system can render and respond in real time while using prepared animation and simulated geometry. Those are separate production decisions.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" And the museum interface?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I coded the public kiosk in Unity and C#. It combined live camera presentation, UI behavior, animation triggers, timed content, and additional viewing functions. A visitor could appear in the screen composition beside the character. That interface adds another historical layer: a figure reconstructed from a portrait now participates in a contemporary museum interaction. The encounter is designed for the present. It should not be confused with an untouched return of the past.\n","b":false,"i":false}]}],"lesson":{"words":631,"vocab":[{"word":"plausible","ko":"그럴듯한, 가능해 보이는","form":"plausible","example":"Ahn: I constructed plausible production geometry."},{"word":"blendshape","ko":"기본 형태와 목표 형태 사이의 변형을 위한 3D 제어 방식","form":"blendshapes","example":"The production rig contained approximately 256 blendshapes overall."},{"word":"silhouette","ko":"윤곽, 실루엣","form":"silhouette","example":"I started with the visible evidence: proportions, head orientation, silhouette, and the painted suggestion of depth."},{"word":"proportion","ko":"비율","form":"proportions","example":"I started with the visible evidence: proportions, head orientation, silhouette, and the painted suggestion of depth."}],"grammar":{"title":"can / could help + 동사원형","ko":"help 뒤에 동사원형 또는 to부정사가 올 수 있다. 조동사 뒤의 help에는 -s를 붙이지 않는다.","quote":"A portrait can help reconstruct an appearance.","answer":"can help","blank":"A portrait  ____  reconstruct an appearance.","wrong":["can helps","could helping"],"example":"The soundtrack can help establish a rhythm.","translation":"사운드트랙이 리듬을 만드는 데 도움이 될 수 있다."},"question":"What can a portrait tell you, and what must you reconstruct?","frame":"The portrait gives me evidence of __. I have to reconstruct __."}},{"title":"5 Someone Who Knows Her","blocks":[{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" You call the second layer “relational approval.” What is being approved?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A representation’s relationship to someone a viewer knows or remembers. The viewer may recognize a particular timing or expression that means very little to a stranger. The term points toward situated knowledge. Someone with a relationship to the subject can offer evidence I may not possess as a technician.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Is that person the final authority?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Their account deserves serious attention, but I would not turn one response into the final truth for every person who knew the subject. Family members can remember someone differently. Recognition can also change with context and over time. “Approval” should not imply a single gatekeeper who can resolve every question of identity.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Your framework emphasizes what a reconstruction cannot carry. Yet the rebuilt Shininho felt more like her to Yaloo. Is there a contradiction?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" There is a tension I want to preserve and clarify. If I claim that familiar recognition is impossible, the production experience challenges me. The rebuild made a difference, and the response was positive. The more careful question is what changed enough to support recognition, and what that recognition means. A person can recognize the subject strongly without believing the digital figure has become the whole person.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" So an X-layer can become accessible to improvement.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. It can identify where the work needs more precision. Facial proportions, eye placement, age detail, and timing can all affect a relational judgment. The term should help the work become more attentive. It should not create a mysterious essence that no production decision can ever reach.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" What would be wrong with saying, “The data was accurate, but the emotion was missing”?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It may be too easy. We would need to establish what “accurate” refers to. Was the geometry accurate to the scan? Did the texture survive transfer? Was the expression actually the one the person was known for? An emotional mismatch may have a technical contributor. A technical metric may omit a feature the observer values. I want to examine the relationship before deciding that the missing part lies outside computation by definition.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" What should the technical director do with a response like “It does not feel like her”?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Listen without demanding that the person immediately translate it into rig controls. Then ask questions that can help us locate the response. Is it present in the neutral face? Does it appear during a smile? Does the lighting change it? Is the posture affecting the face? We can make comparisons. The observer may recognize the difference more readily when two versions are available than when asked for a technical diagnosis.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Is family recognition also consent?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" They are different questions. Someone may recognize a likeness and object to its use. They may approve one use and reject another. A technically successful representation still needs an appropriate agreement about how it will appear and act. Recognition does not provide unlimited permission.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Does working with the figure change the technician’s own recognition?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I would expect repeated attention to change what I notice, but that is another question worth studying rather than assuming. Familiarity with the digital asset may give me knowledge of its errors. Familiarity with the person gives another kind of knowledge. I want to keep those sources distinct enough that they can inform each other.\n","b":false,"i":false}]}],"lesson":{"words":564,"vocab":[{"word":"texture","ko":"질감, 3D 표면 정보","form":"texture","example":"Did the texture survive transfer?"},{"word":"likeness","ko":"닮은 정도, 외형의 유사성","form":"likeness","example":"Someone may recognize a likeness and object to its use."},{"word":"reconstruction","ko":"재구성, 복원","form":"reconstruction","example":"Moderator: Your framework emphasizes what a reconstruction cannot carry."},{"word":"rebuild","ko":"다시 만들다","form":"rebuild","example":"The rebuild made a difference, and the response was positive."}],"grammar":{"title":"can / could + 동사원형","ko":"조동사 뒤에는 동사원형이 온다. become은 어떤 상태로 바뀌는 것을 나타낸다.","quote":"Moderator: So an X-layer can become accessible to improvement.","answer":"can become","blank":"Moderator: So an X-layer  ____  accessible to improvement.","wrong":["can becomes","could becoming"],"example":"A small gesture can become a clue.","translation":"작은 몸짓이 단서가 될 수 있다."},"question":"Why might a familiar observer notice a different detail?","frame":"Someone who knew the person may notice __."}},{"title":"6 A Performance Has More Than One Clock","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" People often imagine motion capture as recording someone and applying the recording. How close is that to your work?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It describes the beginning of a much longer process. A captured performance has to survive solving, cleanup, retargeting, editing, and the final character’s proportions and controls. In Shininho, I operated the OptiTrack stage, placed markers, calibrated the system, directed performance, reviewed the solve in Motive, and exported body data. I used MOVIN TRACIN as a complementary source where hands, wrists, or fingers needed better information. The face was another stream, recorded with an iPhone on a Rokoko head rig and processed through MetaHuman Animator.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Why keep the streams separate?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It gives us editorial choices. The strongest body take and strongest facial take may be different. A shared clap reference helps establish timing, after which the performance still needs to be judged as a whole. Synchronization lets us begin assembling. It does not automatically make two performances belong together.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Where did the body data fail?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Low movement and lying on the floor created tracking problems. When the live solve visibly broke, I recorded another take rather than assuming cleanup could recover everything later. Some local failures still needed reconstruction. I used reliable movement before and after the damaged region, manual keys, interpolation, and an alternate motion reference when useful.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Why not smooth the whole thing?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A tracking jump and a meaningful pause are different problems. Smoothing can reduce noise. It cannot recover a missing action simply by making a broken curve gentler. I need to know whether I am removing an artifact, reconstructing lost information, or changing the performance. Those operations can all be necessary, but they should remain distinguishable.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What happens across the different applications?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" MotionBuilder let me review and clean the captured take. Maya gave me detailed control for reconstruction, animation layers, and sequence assembly. Unreal handled the production character, retargeting, Sequencer assembly, and rig baking. The software changes because the questions change. A full-take tracking problem needs a different view from a hand gesture in a final shot.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Is the final motion still the performer’s?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It carries the performer’s contribution through an edited construction. I would not erase that contribution, and I would not pretend the final animation is untouched recording. The same is true in other performance media. Selection and editing affect what survives. With a digital human, retargeting and deformation add further decisions.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What happens when the performance moves into VR?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" In the Jooan extension, camera movement that felt acceptable on a screen needed reconsideration in a headset. I compared faster and slower versions with approximately ten informal testers, then reduced camera speed. That was practical feedback, not a controlled study. It helped guide a production decision. I kept the viewer more stable, let the character carry more movement, used dusk lighting to help direct attention, and built hand-driven Niagara ribbon trails with performance constraints in mind.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How does that connect to perception?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The same animation becomes a different encounter when the viewer’s body enters the display arrangement. Comfort, gaze, scale, and motion all become part of whether the presence can be experienced. A character cannot be evaluated only inside the application where it was authored. The person who encounters it completes another part of the system.\n","b":false,"i":false}]}],"lesson":{"words":556,"vocab":[{"word":"deformation","ko":"변형","form":"deformation","example":"With a digital human, retargeting and deformation add further decisions."},{"word":"synchronization","ko":"동기화","form":"Synchronization","example":"Synchronization lets us begin assembling."},{"word":"reference","ko":"참조 자료, 기준","form":"reference","example":"A shared clap reference helps establish timing, after which the performance still needs to be judged as a whole."},{"word":"perception","ko":"지각, 감각으로 이해하는 방식","form":"perception","example":"Interviewer: How does that connect to perception?"}],"grammar":{"title":"what happens when ~","ko":"when절은 상황이나 조건을 붙이고, what은 그 상황에서 일어나는 일을 묻는다.","quote":"Interviewer: What happens when the performance moves into VR?","answer":"What happens when","blank":"Interviewer:  ____  the performance moves into VR?","wrong":["what happen when","what happens which"],"example":"What happens when the audience sees the original footage?","translation":"관객이 원본 영상을 보면 어떤 일이 일어날까?"},"question":"Why capture the face and body separately?","frame":"Separate capture gives me more control over __."}},{"title":"7 Ten People Waiting to Sing","blocks":[{"kind":"p","r":[{"t":"One digital human can hide a bad assumption. Ten make it easier to see.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"For ","b":false,"i":false},{"t":"Row, Row, Row Your Boat","b":false,"i":true},{"t":", I processed ten participants into MetaHumans and prepared their facial performances for a two-channel installation. The work arranged them in two groups of five, with voices entering as a musical round.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The artist hired and recorded the participants. I supplied capture requirements and worked from the resulting materials. That distinction belongs in the account: I did not operate those recording sessions.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Standardize what can be standardized\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The capture package separated identity material from singing performance. It included depth capture, head-turn reference, visible-teeth reference, and a singing take recorded to a shared metronome.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Those requirements made the repeated workflow possible. They did not make the people interchangeable.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A corrupted source required a fallback using supplemental Polycam head data. Other characters needed individual attention to eyes, skin, teeth, and hair. A common light rig did not produce an equally readable result on every face.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The pipeline had to repeat its operations while remaining responsive to different failures.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The real voices remained\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The installation used the performers’ recorded singing voices. The faces were reconstructed, and facial animation came through the captured performances. The soundtrack was not replaced with synthetic singing.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"This matters to the way I discuss Model A. In this case, a computational body and a recorded human voice meet within one figure. It would be misleading to call the whole figure an AI-generated performance.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Its persuasive quality comes from several contributions and from how their timing agrees.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Waiting was missing\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The singing takes did not contain every moment the final edit required. We needed time before an entrance, pauses within the round, transitions between views, and an ending that did not stop on an active singing expression.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I created additional idle sections from usable animation. I removed the mouth keys responsible for singing while retaining blinks and small head movements, then adjusted timing for the required interval.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The figure could wait without continuing to sing or becoming a still photograph.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"It is a small production problem with a larger perceptual question inside it. What makes waiting look like someone remaining present?\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Two sources disagreed about the head\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"There was another problem. Facial capture included head movement, while the body-side control setup also represented movement of the head. When the two disagreed, the result could vibrate.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The failure looked like noise, but its cause was a conflict between representations. I used the facial performance as the authoritative source for that movement and transferred the relevant motion so the body-side setup agreed.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Filtering alone would have approached the visible symptom while leaving the disagreement in place.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The distinction is useful beyond this project. Before reducing a signal, ask why it is unstable.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"An entrance is both sound and image\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Each character lived under a parent actor whose scale could be animated for the reveal. When a new voice entered, the figure expanded into the ensemble.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The mechanism was simple. Its timing gave it meaning. The visual accumulation followed the actual recorded musical entrances.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The performance had several clocks: audio, facial movement, head motion, and the appearance of the character. They needed to agree well enough that the audience could attend to the round.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Delivery changes the question again\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The work was intended for two square panels, with front and side views and different lighting treatments. Morning, sunset, and night required actual relighting choices, not just one image with a different color adjustment.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Five overlapping high-detail characters also created practical constraints around hair and rendering. I simplified behavior that the composition did not need and tuned individuals where a shared setting failed them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The project taught me to think about scale as the multiplication of judgment. Automation can repeat a step. Someone still needs to decide whether the repeated result has served each person.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The ten characters begin to sing together only after all those separate decisions become one encounter.\n","b":false,"i":false}]}],"lesson":{"words":626,"vocab":[{"word":"persuasive","ko":"설득력 있는","form":"persuasive","example":"Its persuasive quality comes from several contributions and from how their timing agrees."},{"word":"perceptual","ko":"지각에 관한","form":"perceptual","example":"It is a small production problem with a larger perceptual question inside it."},{"word":"assumption","ko":"가정, 당연하다고 여기는 생각","form":"assumption","example":"One digital human can hide a bad assumption."},{"word":"reconstruct","ko":"재구성하다","form":"reconstructed","example":"The faces were reconstructed, and facial animation came through the captured performances."}],"grammar":{"title":"need to + 동사원형","ko":"해야 할 필요가 있는 행동을 말한다. 주어에 따라 need 또는 needs를 쓴다.","quote":"Someone still needs to decide whether the repeated result has served each person.","answer":"needs to","blank":"Someone still  ____  decide whether the repeated result has served each person.","wrong":["needs for","need that to"],"example":"The character needs to respond in real time.","translation":"캐릭터가 실시간으로 반응해야 한다."},"question":"How did you make ten digital humans appear to sing together?","frame":"I used a shared reference for __ and adjusted __."}},{"title":"8 The Figure Inside the Sphere","blocks":[{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" AI ZOO brings a different kind of figure into the discussion. How would you describe the work?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" In AI ZOO, a digital human appears confined within a transparent sphere containing small white balls. Speech, animation, and physical motion make the figure appear to respond to its situation. The audience encounters a performed condition of confinement and distress. The figure is staged as if it has an inner life. That staging is the artistic device. It does not establish that the software is sentient or experiencing suffering.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" What interests you about the viewer’s response?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The possibility that someone can recognize a system as artificial and still feel a social demand from it. A request for help can affect a person before they have resolved what kind of being is addressing them. I want to ask how that demand develops through voice, timing, physical movement, and the exhibition context.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Your framework connects this to biological finitude.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. X₃ names the role of fatigue, aging, risk, mortality, and irreversible change in how we understand a living body. If a figure performs exhaustion but repeats the same behavior indefinitely, a viewer may notice a mismatch. A claim of vulnerability can become difficult to reconcile with what the system visibly undergoes. That gives us a question about perceived aliveness and consequence.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Does the viewer have to notice the mismatch?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" No. I would not claim that every audience member responded in the same way. I do not have a controlled audience study establishing a universal reaction. Someone might be moved by the repeated distress. Someone might find it theatrical. Someone might be more aware of the physical installation than of the digital figure. Those differences are worth investigating.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Would you define life through the capacity to die?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I would keep it as a provocative question about the work, rather than a complete test of life or moral concern. Viewers can care about fictional figures they know are not biological. Digital systems can also be lost, damaged, or deleted. The distinction I want is between a body undergoing biological life and a representation of those conditions. That distinction matters without resolving every possible question about artificial minds.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Could you simulate fatigue and aging?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I could give the figure persistent state changes, a slower response, a weakened voice, or a recovery interval. That might alter how a viewer understands it. It would be a manipulation of represented vulnerability. We could study its effect without claiming that the system has acquired a biological body.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" What would count as an irreversible consequence for an installation?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" We would need to define it within the system and explain its limits. Perhaps a state cannot be restored during a session or exhibition. That is different from a claim that no backup exists anywhere. A theatrical rule can be meaningful. It still needs an honest description if we are using it to discuss how people judge consequence.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Is empathy for the figure a mistake?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I do not think it has to be. The response can tell us something about the viewer and the encounter. The important questions include what produces that response, what the viewer believes, and what they are being asked to do because of it. A system should not receive unlimited authority simply because it can make someone feel responsible for it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" How does this return to technical direction?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Every change of state has a technical implementation. The duration of a pause, the persistence of an apparent injury, the timing between speech and physical motion: those choices organize the relationship. The technical director helps decide what kind of consequence the audience can perceive. That is already an artistic and ethical contribution.\n","b":false,"i":false}]}],"lesson":{"words":627,"vocab":[{"word":"mortality","ko":"죽음을 피할 수 없는 성질","form":"mortality","example":"X₃ names the role of fatigue, aging, risk, mortality, and irreversible change in how we understand a living body."},{"word":"irreversible","ko":"되돌릴 수 없는","form":"irreversible","example":"X₃ names the role of fatigue, aging, risk, mortality, and irreversible change in how we understand a living body."},{"word":"persistent","ko":"지속되는","form":"persistent","example":"Ahn: I could give the figure persistent state changes, a slower response, a weakened voice, or a recovery interval."},{"word":"fatigue","ko":"피로","form":"fatigue","example":"X₃ names the role of fatigue, aging, risk, mortality, and irreversible change in how we understand a living body."}],"grammar":{"title":"may / might + be","ko":"가능성을 표현한다. may와 might 뒤에 be 원형을 쓴다.","quote":"Someone might be moved by the repeated distress.","answer":"might be","blank":"Someone  ____  moved by the repeated distress.","wrong":["may is","might being"],"example":"The difference might be hard to notice.","translation":"그 차이는 알아차리기 어려울 수도 있다."},"question":"How can a digital figure appear vulnerable?","frame":"The viewer may perceive vulnerability when __."}},{"title":"9 Model B and the Image That Arrives First","blocks":[{"kind":"p","r":[{"t":"The second model reverses the arrangement:\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Model B: AI ≥ Image ≥ Sound ≥ Human","b":true,"i":false},{"t":"\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Here, the generated or selected representation arrives before the person has examined its conditions. An image offers a scene. Sound supports its coherence. A human observer receives an account that already seems to have a shape and a meaning.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The sequence describes an arrangement of authority. It does not mean that an AI system literally learns images before sound, or that every viewer encounters the image first.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"It asks what happens when the machine-mediated account becomes the default from which the viewer begins.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A familiar face enters an unfamiliar event\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I generated family figures from my own face and presented a fictional funeral within a digital family work. Some viewers understood the event as real and continued to believe that my mother had died even after I clarified the fiction.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I also describe viewers assuming that I had physically acted in an AI-generated film using a synthesized version of my face.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"These are personal observations. They do not tell us how all viewers respond, how often the confusion occurs, or exactly which feature produced it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"They do identify a conflict I want to examine: an image of me can support a belief about my life that my own explanation struggles to correct.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The face becomes evidence\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A viewer recognizes a face and begins to connect it with an action. The familiarity can make the action feel grounded even when the action was generated.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The face has traveled farther than the event it can verify.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That distinction interests me as a maker of digital humans. A character can be derived from a real person while performing something that person never did. A convincing performance can be assembled from contributions that never occupied the same room or moment.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The image can remain emotionally coherent while its apparent account of authorship is wrong.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"What I mean by post realism\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I use ","b":false,"i":false},{"t":"post realism","b":false,"i":true},{"t":" to describe a condition in which perceptual coherence and emotional fit can become more persuasive than verification.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The term does not mean that an external world has disappeared or that facts are optional. It names a problem in how people accept accounts of that world.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A scene feels consistent. It fits something the viewer expects. It arrives through a format that looks authoritative. The viewer may accept it before asking which part was recorded, reconstructed, generated, or invented.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In that encounter, reality is partly selected through the available representations. The selection has consequences even when the representation is false.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The person becomes the correction\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"There is a reversal here that I find difficult.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We often imagine the person as the source and the image as something that refers back to them. In the situation I am describing, the image establishes a story, and the person arrives afterward to dispute it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The human being becomes a correction to a representation already accepted.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That is the authority relationship Model B makes visible. It does not require a conscious machine or an omnipotent algorithm. A persuasive image, an incomplete introduction, and an ordinary habit of interpretation may be enough.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Several realities should remain distinguishable\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"An emotional response to a fictional funeral can be real. The funeral it depicts can remain fictional. Recognizing that distinction does not require dismissing the response.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Similarly, an artificial character can create a meaningful encounter without being the person it resembles. The audience’s experience and the event represented are different questions.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want my language to keep both available. Otherwise, “real” becomes a word that moves between feeling, identity, and factual occurrence without warning.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That movement can be artistically powerful. It can also make misunderstanding easy.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The technical artist participates in the authority\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I help create the features that make the scene coherent: a gaze, a plausible skin response, a voice aligned with a mouth, a body that appears to carry weight.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Those features do more than improve the render. They can affect how readily someone accepts the represented event.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I cannot solve that whole problem with a small disclosure at the edge of the screen. Presentation, framing, description, and the path to source information all matter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The work should offer a way to understand its construction without requiring viewers to diagnose an artifact with their eyes.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Between the models\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Model A asks me to trace the representation back toward a person, a record, or an embodied encounter. Model B asks me to notice when a representation has begun to organize the person’s account from the other direction.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I move between them in production. I look for what has been lost from a source. Then I consider what the convincing result may lead someone to believe.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The models are useful when they keep those questions in motion. They become less useful if they make me certain in advance about everything humans or machines can do.\n","b":false,"i":false}]}],"lesson":{"words":771,"vocab":[{"word":"embodied","ko":"몸에 밴, 몸을 통해 경험하는","form":"embodied","example":"Model A asks me to trace the representation back toward a person, a record, or an embodied encounter."},{"word":"verification","ko":"검증","form":"verification","example":"I use post realism to describe a condition in which perceptual coherence and emotional fit can become more persuasive than verification."},{"word":"dispute","ko":"이의를 제기하다, 논쟁","form":"dispute","example":"In the situation I am describing, the image establishes a story, and the person arrives afterward to dispute it."},{"word":"plausible","ko":"그럴듯한, 가능해 보이는","form":"plausible","example":"I help create the features that make the scene coherent: a gaze, a plausible skin response, a voice aligned with a mouth, a body that appears to carry weight."}],"grammar":{"title":"does not mean (that) + 절","ko":"앞의 사실에서 어떤 결론이 바로 따라오지 않음을 말한다. does 뒤에는 mean 원형을 쓴다.","quote":"It does not mean that an AI system literally learns images before sound, or that every viewer encounters the image first.","answer":"does not mean","blank":"It  ____  that an AI system literally learns images before sound, or that every viewer encounters the image first.","wrong":["does not means","does not meaning"],"example":"This does not mean the audience agrees.","translation":"그렇다고 관객이 동의한다는 뜻은 아니다."},"question":"What do you mean by post realism?","frame":"I use the term to describe a situation where __."}},{"title":"10 The Next Department Has a Different Question","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Why include game systems and production handoffs in a book about perception?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Because they explain how I think. A representation needs to do something for someone. The appropriate form depends on the task and on who receives it next. In ","b":false,"i":false},{"t":"When It Seen","b":false,"i":true},{"t":", I worked on three dancers’ body and facial performances. Those streams were captured separately, synchronized per performer in Unreal, and prepared for downstream cloth-contact work. The next department needed moving surfaces. A skeletal-animation file alone would not provide the geometry they needed to simulate contact.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What did you deliver?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Full-character Alembic geometry with the assembled body and facial deformation. The handoff character did not include clothing. The downstream Houdini team performed the cloth simulation. That boundary matters. My contribution was the capture integration and simulation-ready animated surface, not the cloth result itself.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What did this teach you about a successful pipeline?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The deliverable has to answer the next person’s question. My viewport looking correct is insufficient if the next department cannot use what leaves it. That is also a useful way to think about an audience. What information does the encounter need, beyond what the authoring tool happens to show?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" You also worked on a confidential real-time game with Erick Oh.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. I can discuss the technical systems without disclosing the project’s title or additional production material. One system used shader-driven displacement for a cloud surface. The cloud was an opaque mesh, not a volumetric cloud simulation. C# interpreted player input, and HLSL turned parameters into internal surface movement. Another system kept liquid droplets separate for gameplay while a raymarched metaball field made them appear continuous.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What connects that to digital humans?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The visible unity and the computational structure can be different. Several separate droplets can appear to be one liquid body. Several different performances can appear to belong to one person. That does not make the representation dishonest by itself. It means we should describe what has been joined, and for what purpose, when the distinction matters.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Did you use the most physically complete solution available?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The goal was controllable behavior that served the project. For a growing cloud, I used four fixed-topology states authored in Maya and animated their blendshape weights in Unity. That gave us reliable correspondence and art direction. A more elaborate simulation would have created other problems without necessarily improving the intended encounter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Does the same principle apply to aging a digital person?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" In the Yaloo age-variation case, I used different interventions for different changes. The child version combined the identity-bearing MetaHuman head with a CC4 child body. The middle-aged and elderly states used material and texture variations of the adult geometry, with blended transitions. That was a controllable visual age study. It should not be presented as a biological simulation or an accurate prediction of an individual’s future appearance.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What does technical honesty mean in those cases?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Being precise about the operation and the outcome. A material transition can make an age change legible. It does not establish that every anatomical change has been modeled. A cached garment can look convincing in a real-time application. It does not become live cloth simulation because the application updates interactively. The precision protects the work. It lets someone understand what succeeded and where the system can be reused.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" And it protects the collaborators’ contributions.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. A source may come from an external scan studio. A performer may be recorded by the project artist. A simulation may belong to the next department. My pipeline connects contributions; it should not absorb their authorship.\n","b":false,"i":false}]}],"lesson":{"words":605,"vocab":[{"word":"intervention","ko":"개입","form":"interventions","example":"Ahn: In the Yaloo age-variation case, I used different interventions for different changes."},{"word":"displacement","ko":"이동, 변위","form":"displacement","example":"One system used shader-driven displacement for a cloud surface."},{"word":"deformation","ko":"변형","form":"deformation","example":"Ahn: Full-character Alembic geometry with the assembled body and facial deformation."},{"word":"technical","ko":"기술적인","form":"technical","example":"I can discuss the technical systems without disclosing the project’s title or additional production material."}],"grammar":{"title":"can + 동사원형","ko":"가능하거나 할 수 있는 일을 말한다. can 뒤에 to나 -s를 붙이지 않는다.","quote":"I can discuss the technical systems without disclosing the project’s title or additional production material.","answer":"I can","blank":" ____  discuss the technical systems without disclosing the project’s title or additional production material.","wrong":["I can to","I can am"],"example":"I can compare the two versions.","translation":"두 버전을 비교할 수 있다."},"question":"What makes a handoff successful?","frame":"The handoff succeeds when the next team can __."}},{"title":"11 Moving One Wrist","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How do you move from an artistic question like recognition to an experiment?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" First I need to separate the things I am asking. Likeness, naturalness, identity, social presence, and belief that a depicted event occurred are different judgments. Then I need a representation I can control well enough to vary a relevant cue. If I want to examine timing while keeping appearance stable, the system has to let me do that reliably. That is where the technical research becomes connected to the perceptual research.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What does 4D mean in this context?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" In this discussion, it means representations of a three-dimensional person changing over time. I am interested in how captured appearance and movement become controllable rather than only replayable. My research examines Gaussian human representations, body-model semantics, and learned deformation. The practical question is whether the control I think I am applying remains local and interpretable.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Give me an example.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I began a diagnostic experiment from a pretrained HUGS baseline on the NeuMan Seattle case. A controlled change at the left wrist was associated with movement on the other side of the body that was larger than in the body-model-only comparison. I then examined learned deformation and cross-joint contributions in the checkpoint. This provided evidence for a possible mechanism behind the response. The scope matters: one examined baseline and case, not a finding about every learned human representation.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Why does the other arm moving matter?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Because I may want to use the representation as an experimental instrument. If I say that only one body region changed, I need to know whether that statement is true of the rendered result. An unintended change elsewhere can alter what the viewer judges. The experiment may then be testing a combination of cues I have not acknowledged. Before asking how people respond, I have to understand what my tool actually changed.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Is the mechanism proven?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I have strong mechanism-level evidence, but I would stop short of causal proof. My next proposed step is a counterfactual ablation that removes the suspected learned cross-joint component while keeping other parts fixed. That is the next question. Correlation and reconstruction of a forward path can guide an intervention; they do not replace it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How might this help study X₂?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A controllable representation could let us compare observers with different familiarity while varying a specific movement or timing feature. We could ask whether that feature affects likeness or recognition differently across groups. We would need an appropriate design, permission to use the identity, and care about what the response measure actually means. The proposal is a direction, not a result.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" And X₃?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" We could compare represented states with different persistence and recovery behavior. Does a figure seem more vulnerable when its earlier actions have visible consequences later? Again, we would be studying perceived vulnerability. We would not be testing whether a digital system has become biologically alive.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What about Model B?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" We could create a controlled conflict between a generated representation and contextual information, then examine belief, confidence, memory, or source attribution. The design would have to distinguish those outcomes. A person can remember an image vividly while correctly identifying it as fictional. Emotional force and factual belief should not be collapsed into one score.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What changes when you adopt a research stance?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I have to become more precise about what would make me revise the framework. If no possible outcome can challenge it, the study is only illustrating my existing view. In production, a failed prototype made me change the pipeline. I want research to retain that ability to change what I think.\n","b":false,"i":false}]}],"lesson":{"words":613,"vocab":[{"word":"baseline","ko":"비교 기준","form":"baseline","example":"Ahn: I began a diagnostic experiment from a pretrained HUGS baseline on the NeuMan Seattle case."},{"word":"checkpoint","ko":"학습 중 저장한 모델 상태","form":"checkpoint","example":"I then examined learned deformation and cross-joint contributions in the checkpoint."},{"word":"causal","ko":"인과관계에 관한","form":"causal","example":"Ahn: I have strong mechanism-level evidence, but I would stop short of causal proof."},{"word":"ablation","ko":"구성 요소를 제거해 효과를 비교하는 실험","form":"ablation","example":"My next proposed step is a counterfactual ablation that removes the suspected learned cross-joint component while keeping other parts fixed."}],"grammar":{"title":"would have to + 동사원형","ko":"가정한 상황에서 무엇이 필요할지 말한다. would 뒤의 have는 원형이다.","quote":"The design would have to distinguish those outcomes.","answer":"would have to","blank":"The design  ____  distinguish those outcomes.","wrong":["would has to","would having to"],"example":"We would have to ask the people involved.","translation":"관련된 사람들에게 물어봐야 할 것이다."},"question":"Why is moving one wrist useful as a research test?","frame":"By changing one joint, I can see whether __."}},{"title":"12 Questions About the Human","blocks":[{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Are you trying to prove that machines can never become human?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I am trying to understand particular encounters with computational representations. A claim about what every future machine can never do would go far beyond those encounters. I can examine a missing cue, a mistaken attribution, or a production limit without deciding the entire future of artificial intelligence.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Do you still believe there is something human that cannot be reduced to data?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I am drawn to the difference between living a relationship and having a representation of it. A recording can carry valuable evidence of an encounter. It does not give its owner the whole life from which that evidence came. I want to protect that distinction while remaining open to learning which aspects we can model more precisely.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Why call the layers nonlinear?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I use the word to suggest that adding detail does not necessarily produce a proportional increase in recognition or presence. A small timing change may matter more than a large texture improvement in a particular condition. The term would need a more exact operational definition in a formal study. It should not become a decorative synonym for mysterious.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Could the X-layers overlap?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. Historical knowledge can shape relational recognition. A remembered illness might affect how a familiar person judges a digital body’s apparent energy. The current labels organize questions. They do not establish independent modules inside a person.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Is sound really more important than image?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" In some audiovisual encounters, sound may carry information the image leaves uncertain. In others, the task or the viewer’s sensory access will make a different arrangement appropriate. Model A records an emphasis in my practice. It needs qualification before becoming a testable claim about perception.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What if a person cannot hear?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Then a universal hearing-first definition would have excluded their experience from the start. That is a reason to keep the model contextual. The larger question concerns how available cues support a judgment, including visual, tactile, spatial, and relational information.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Is every digital human AI?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" No. A figure can combine manually authored geometry, recorded acting, procedural controls, prepared animation, and AI-assisted components. The Gang Se-hwang project used a custom rig and professional dubbing. The singing ensemble used real recorded voices. I want the description to identify the particular operation rather than letting “AI” replace the production account.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" If Yaloo recognized Shininho, did the reconstruction succeed completely?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It succeeded more convincingly at a central production goal. That response does not settle every question about identity, every observer’s judgment, or every possible use. A meaningful success can remain specific.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Can a stranger feel more empathy than someone who knew the person?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It is possible, and it would be interesting to investigate. Familiarity may add recognition, but it may also make a mismatch more noticeable or painful. I would not assume that all judgments move in the same direction when someone has more relational knowledge.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Does an artificial figure need realistic skin to feel present?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The projects do not establish a universal requirement. Stylized figures can create strong social encounters. I work with realistic digital humans partly because they let me examine particular expectations that realistic appearance invites. Realism is a condition to study, not a guarantee of presence.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Is a digital character’s apparent vulnerability just manipulation?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" An artwork organizes responses, and a vulnerability cue can be used manipulatively. It can also be part of an encounter a viewer understands and chooses. I would ask what the presentation discloses, what it asks from the viewer, and whether they can leave or question it without penalty.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Why not make every digital person obviously artificial?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That is one valid artistic choice. Realistic representation also has uses that deserve exploration. The responsibility is to give people an adequate account of what they are encountering, especially when identity, testimony, or a claim about a real event is involved. A visible artifact should not be the only available disclosure.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Could adding more imperfections make a character more human?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It might change a judgment, but arbitrary imperfection is a poor substitute for a specific person. A wrinkle, asymmetry, or pause matters through its relationship to the identity and performance. I want to understand what the detail carries before adding it as a general sign of humanity.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" When you clean motion, how do you keep from cleaning away life?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I compare the data with the performance and with the intended result. I distinguish a tracking spike from an intentional acceleration, or contact drift from a real shift of weight. Then I apply a correction to the relevant failure. A global smoothing pass is easy to repeat and easy to misuse.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Who owns a final performance made from several people?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The answer depends on the project’s agreements and the contributions involved. Artistically, the account should identify the sources rather than pretending the coherence came from one person or one system. Permission for capture, animation, generated speech, and later reuse should not be assumed to be the same permission.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Is post realism only another name for being fooled?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Being fooled is one possible event within the condition. I am also interested in knowingly accepting an artificial encounter because it feels coherent, useful, or emotionally meaningful. The factual belief and the chosen experience can differ. That is why I want to ask what someone accepts, rather than calling every response deception.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Does the responsibility fall on the viewer to verify everything?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" No. Perceptual autonomy needs support from the maker and the presentation. Clear framing, source information, appropriate permissions, and a route for correction can reduce the burden. A person should not need professional graphics knowledge to discover what kind of representation they are seeing.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What does AGI add to the book if the examples use existing production systems?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It extends the speculative question: how might these relationships change if systems become more broadly capable and integrated into everyday life? The concrete cases remain useful without waiting for agreement about that future. They already show problems of source, recognition, authorship, and authority.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Do the models place humans above nature?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" They begin from human judgments of representation. That focus should not become a hierarchy of the value of life. My wider artistic interest in nature, humans, and AI includes dependence and coexistence. The models examine one part of that relationship, with the limits of a human-centered starting point.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What would make you change Model A or Model B?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A better explanation of the same encounters, or a comparison showing that a proposed layer does not affect the judgment I expected. I could also discover that two layers need to become one, or that a different distinction matters more. I want the framework to help me ask questions accurately enough that the answers can change it.\n","b":false,"i":false}]}],"lesson":{"words":1179,"vocab":[{"word":"attribution","ko":"출처나 원인을 특정 대상에 돌림","form":"attribution","example":"I can examine a missing cue, a mistaken attribution, or a production limit without deciding the entire future of artificial intelligence."},{"word":"autonomy","ko":"자율성","form":"autonomy","example":"Perceptual autonomy needs support from the maker and the presentation."},{"word":"independent","ko":"독립적인","form":"independent","example":"They do not establish independent modules inside a person."},{"word":"performance","ko":"공연·연기 또는 시스템 성능","form":"performance","example":"A wrinkle, asymmetry, or pause matters through its relationship to the identity and performance."}],"grammar":{"title":"would + 동사원형","ko":"가정 속 선택이나 조심스러운 의견을 말한다. would 뒤에는 동사원형이 온다.","quote":"I would not assume that all judgments move in the same direction when someone has more relational knowledge.","answer":"I would","blank":" ____  not assume that all judgments move in the same direction when someone has more relational knowledge.","wrong":["I would to","I would am"],"example":"I would keep the original recording.","translation":"나라면 원본 녹음을 보존하겠다."},"question":"Which question about digital humans would you like to study?","frame":"I would like to study whether __ changes __."}},{"title":"13 Returning the Face","blocks":[{"kind":"p","r":[{"t":"A digital face can become familiar to the person making it. We learn the controls. We recognize a problem before the whole expression arrives. We know which lighting setup makes a material look wrong and which camera angle conceals it. That knowledge is useful. It can also make the face feel like a system we fully understand. Then another person looks at it. They may recognize someone. They may find a gesture painful. They may believe an event occurred because the figure appears to remember it. They may ask a question that our production checklist never contained. The face enters another relationship.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"What I want to carry forward\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"From Shininho, I carry the need to protect identity through technical translation. A successful prototype can reveal that the wrong problem has been treated as the final goal. From Gang Se-hwang, I carry the boundary between evidence and reconstruction. A plausible unseen surface remains something I made, even when it belongs convincingly to the visible portrait. From the singing ensemble, I carry the precision of waiting. A blink, a quiet interval, and a shared musical entrance can hold a presence together. From AI ZOO, I carry a question about consequence. What happens when a figure asks for care, and what does the viewer believe the figure can undergo? From the generated versions of my own face, I carry the experience of arriving after an image to explain my own life. These cases do not produce a complete theory of the human. They give me specific questions I can continue to work on.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Building a way to answer\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The next step may look very technical. A better control, a more careful capture reference, an ablation, a source label, a comparison between observers. I value those steps because they make a broad claim answerable to something concrete. We can see what changed. We can ask whether the result supports the account. Someone else can examine the decision. I want that kind of openness in the work.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The person beyond the asset\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"When a face comes from a real person, the source continues beyond the representation. Their relationships, memories, and choices cannot be reduced to the files I receive. When a figure is fictional, the viewer still deserves a clear relationship to its fiction. The emotional encounter can be meaningful without acquiring a false biography. The technical work helps create a presence. The account around it helps people decide what to do with that presence. I want to take responsibility for both. At the end of a session, I can close the project and reopen the character tomorrow. The people connected to it continue living in the meantime. That difference is something I want the work to remember.\n","b":false,"i":false}]}],"lesson":{"words":437,"vocab":[{"word":"prototype","ko":"시제품, 기능을 시험하는 초기 버전","form":"prototype","example":"A successful prototype can reveal that the wrong problem has been treated as the final goal."},{"word":"capture","ko":"포착하다, 촬영·기록하다","form":"capture","example":"A better control, a more careful capture reference, an ablation, a source label, a comparison between observers."},{"word":"surface","ko":"표면","form":"surface","example":"A plausible unseen surface remains something I made, even when it belongs convincingly to the visible portrait."},{"word":"ablation","ko":"구성 요소를 제거해 효과를 비교하는 실험","form":"ablation","example":"A better control, a more careful capture reference, an ablation, a source label, a comparison between observers."}],"grammar":{"title":"has been + 과거분사 또는 보어","ko":"과거부터 현재까지 이어지는 상태나 결과를 말한다. 과거분사가 뒤따르면 현재완료 수동태가 될 수 있다.","quote":"A successful prototype can reveal that the wrong problem has been treated as the final goal.","answer":"has been","blank":"A successful prototype can reveal that the wrong problem  ____  treated as the final goal.","wrong":["has being","have been to"],"example":"The image has been edited.","translation":"이미지가 편집되었다."},"question":"What responsibilities come with representing a person?","frame":"When I represent a person, I need to consider __."}},{"title":"A Compact Guide to the Framework","blocks":[{"kind":"h2","r":[{"t":"The two models\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"Model A\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Working notation: ","b":true,"i":false},{"t":"Human ≥ Sound ≥ Image ≥ AI\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Main question: ","b":true,"i":false},{"t":"What sources, experiences, and judgments support a representation?\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"Expanded Model A\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Working notation: ","b":true,"i":false},{"t":"Human ≥ Digital Human ≥ X₁ ≥ X₂ ≥ X₃ ≥ … ≥ Sound ≥ Image ≥ AI\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Main q
