ut silence being the best answer. In another situation, that sentence could offer relief. Here it meets someone who is already struggling to respond. The teacher accepts the surface behavior as if the sentence has explained it. That is the failure in the scene. A general piece of wisdom replaces attention to a particular person.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Celine also praises silence, especially near the police interview.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" There the purpose is much more direct. Silence helps her manage what can enter the public account. She presents it as protection of Hye-mi’s future while also protecting herself. That overlap is central to the relationship. The language of care gives control a reason that is difficult for Hye-mi to challenge.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" And the silence between the children?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" They can make something together within it. A gesture receives another gesture. They adjust to each other. The quiet does not prevent a response. That is a useful distinction for me. In one relationship, silence closes the exchange. In another, it becomes the condition through which an exchange develops.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Jun’s parents become quiet when confronted.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Their silence should not receive the same emotional meaning as Hye-mi’s. The question is who has the power to withhold and who has been made unable to speak safely. The sound may be the same. The position is different.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" At the end of the therapy material, Karen says silence may mean there is too much to carry. Does she finally understand Hye-mi?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" She makes room for an explanation that does not punish Hye-mi for failing to perform a response. I would not say she suddenly knows everything. The value of that moment is her willingness to leave room. She does not need immediate access to the whole story before she can change how she addresses the person in front of her.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Is Hye-mi’s silence at the police station a refusal?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It can contain refusal, fear, shock, and more than one feeling she cannot separate. I would be reluctant to choose a single word that makes the whole moment manageable. She is being asked to turn an unbearable relationship into answers that can fit the investigation. Those answers may be necessary for the investigation. Their necessity does not make her able to give them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Why delay the title until after that sustained questioning?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" By then, “share” has become a difficult word. We have watched intimacy, coercion, and evasion develop through the same absence of speech. I want the title to arrive after those differences have accumulated. It should open the question again.\n","b":false,"i":false}]}],"lesson":{"words":524,"vocab":[{"word":"repression","ko":"억압","form":"repression","example":"If silence always means repression, then the children’s time together becomes difficult to understand."},{"word":"coercion","ko":"강요","form":"coercion","example":"We have watched intimacy, coercion, and evasion develop through the same absence of speech."},{"word":"overlap","ko":"겹치다, 중복되다","form":"overlap","example":"That overlap is central to the relationship."},{"word":"evasion","ko":"회피","form":"evasion","example":"We have watched intimacy, coercion, and evasion develop through the same absence of speech."}],"grammar":{"title":"may / might + be","ko":"가능성을 표현한다. may와 might 뒤에 be 원형을 쓴다.","quote":"The sound may be the same.","answer":"may be","blank":"The sound  ____  the same.","wrong":["may is","might being"],"example":"The difference might be hard to notice.","translation":"그 차이는 알아차리기 어려울 수도 있다."},"question":"How does silence change meaning across the story?","frame":"The meaning changes depending on who __."}},{"title":"4 The Car Is the Theater","blocks":[{"kind":"p","r":[{"t":"I have described my approach to cinema this way:\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"“If you want to watch a film, sit in a moving car and look out the window. You are the witness, the outside world is the event, and the car is the theater. When the film ends, become a detective and speak with other witnesses.”\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The sentence begins with an ordinary experience. A frame moves through the world. We see a series of things whose lives are larger than the time they spend inside that frame.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The frame does not tell us everything. Movement makes that limit visible.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"An event without its whole story\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Imagine seeing two people on opposite sides of a street. One turns away. The other remains still.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We can invent several explanations before the car reaches the next block. A disagreement, a goodbye, a missed introduction. The image gives us an event, and our minds begin building a story around it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Cinema works with that impulse. It also has the power to interrupt it. Another scene can make the earlier image mean something different.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In ","b":false,"i":false},{"t":"The Silence We Share","b":false,"i":true},{"t":", the neighborhood keeps changing according to what we know. A house appears orderly in daylight after we have heard shouting at night. A meal takes on a different feeling after we have watched Celine control access to ordinary things. An empty yard becomes difficult to trust.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The material appearance remains familiar. Our account of it changes.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Inside the car\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Hye-mi spends part of her day being driven between home, school, therapy, and the station. The journey joins the institutions without giving her much freedom between them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Celine speaks from the front seat. Hye-mi sits behind her. Outside, the world continues moving. Inside, the conversation gives Hye-mi very little space to determine its direction.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The car offers a useful form for that relationship. The person directing the speech also directs the journey. The passenger can watch the window while having almost no say in where she goes.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"When I call the car a theater, I also want to remember the body sitting in it. The conditions of watching affect what watching feels like.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A witness knows something\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A witness has a position. They see from somewhere. Their attention has limits. They may understand a gesture differently from someone on the other side of the street.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That does not make their account worthless. It gives the account conditions.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The audience has a position too. The film offers access to some moments and withholds others. It may invite us close to Hye-mi while leaving another character’s interior life unavailable.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want viewers to remain aware that closeness and knowledge are different things. Spending time with a face can make us care without giving us every answer about it.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The detective after the film\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The detective in my sentence is a way of describing continued attention. It does not require reducing every film to a solution.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"After watching, someone else may mention a detail you missed. You may disagree about the ending and discover that you gave different weight to the same scene. A conversation can expose the shortcuts in your first interpretation.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That is why the final part of the sentence matters to me: speak with other witnesses.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The conversation does not have to produce agreement. It can make the disagreement more precise. One person notices the locked door. Another remembers the mother’s call. A third keeps returning to the moment the children laugh.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Those observations can share a room without becoming identical.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Leaving the theater\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I do not think cinema gives us a complete practice for responding to real people. Life asks things a film cannot ask on its own. But the habits of attention we practice while watching can become available afterward.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We may become more cautious about assuming a quiet person has nothing to say. We may notice how easily an official-looking account gains authority. We may ask what happened outside the frame.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"For me, the film continues there: in the questions that become possible after the image has stopped moving.\n","b":false,"i":false}]}],"lesson":{"words":652,"vocab":[{"word":"authority","ko":"권위, 판단을 좌우하는 힘","form":"authority","example":"We may notice how easily an official-looking account gains authority."},{"word":"interpretation","ko":"해석","form":"interpretation","example":"A conversation can expose the shortcuts in your first interpretation."},{"word":"ordinary","ko":"일상적인, 평범한","form":"ordinary","example":"When the film ends, become a detective and speak with other witnesses.” The sentence begins with an ordinary experience."},{"word":"disagreement","ko":"의견 차이, 불일치","form":"disagreement","example":"A disagreement, a goodbye, a missed introduction."}],"grammar":{"title":"can / could + 동사원형","ko":"조동사 뒤에는 동사원형이 온다. become은 어떤 상태로 바뀌는 것을 나타낸다.","quote":"But the habits of attention we practice while watching can become available afterward.","answer":"can become","blank":"But the habits of attention we practice while watching  ____  available afterward.","wrong":["can becomes","could becoming"],"example":"A small gesture can become a clue.","translation":"작은 몸짓이 단서가 될 수 있다."},"question":"How would you explain the car as a metaphor for cinema?","frame":"The window frames the world, and the passenger __."}},{"title":"5 The Language in an Object","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" The film gives a great deal of attention to pencils, workbooks, food, fabric, and small tools. Why do ordinary objects carry so much of the story?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The characters cannot speak freely, but they still need to act. An object can move between them when an explanation cannot. It also changes meaning according to who handles it. Celine sees a sharp pencil through the demands of surveillance. Jun gives a pencil a relationship to contact. Hye-mi finds a discarded object carrying more feeling than the adults recognize.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" The moment at the trash can is especially quiet.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The pencil has already passed through an exchange between the children. When Hye-mi sees it in the trash, she sees what Celine has removed without understanding its significance. The emotion does not require Hye-mi to tell us why it matters. The earlier action gives the object a history.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Mathematics also changes meaning.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Schoolwork is part of the pressure both children live under. Between them, solving a problem can become an act of attention. Someone has sent a page. Someone has taken time to answer. The film keeps both meanings active. Better grades can bring temporary relief while allowing the adults to believe their methods are working. The children gain something from the exchange, and the surrounding system misreads the result.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Jun later carries a heavy bag of completed work. Is he bringing proof that he deserves care?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That is one painful reading of the gesture. He wants to show Hye-mi something he has done. There is joy in it. There is also a world around him that has taught him how much completed work should matter. I want the scene to contain the pride of a child showing someone a page. Its tenderness becomes more difficult because we know what has attached itself to achievement.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What does clothing give Hye-mi that schoolwork does not?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A way to imagine form through her own attention. Her sketchbook contains decisions that belong to her, even when the drawings carry the pressure around her body. As the relationship with Jun develops, she begins imagining clothing in relation to another person’s protection and comfort. The change appears in what she chooses to design.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Do the drawings explain her psychology?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" They offer access to an imaginative life. I do not want them to function as a diagram that solves her. A drawing can contain several impulses at once. Something beautiful can also feel constricting. An idea can change as the person making it changes.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" There are objects connected to self-harm. How do you approach them within this conversation?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Through the character’s relationship to them and the consequences around her. Their dramatic function should not depend on providing detailed instructions or turning injury into an attractive image. One important moment is Jun imitating something he has seen. Hye-mi suddenly recognizes that being close to someone also means influencing them. She has to respond to what her actions are teaching.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" That complicates the idea that she simply saves him.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It does. Their care is real, and both are vulnerable. A relationship between two hurting people cannot be expected to provide everything the adults and institutions have failed to give them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" And the tteokbokki?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It is a preference. Hye-mi is asked what she would like, and she names something. In a life organized by other people’s instructions, that can carry weight. Food also gives the children a shared activity that does not need to prove anything. They can eat together. I want those ordinary moments to have room in the story.\n","b":false,"i":false}]}],"lesson":{"words":605,"vocab":[{"word":"vulnerable","ko":"취약한, 상처 입기 쉬운","form":"vulnerable","example":"Their care is real, and both are vulnerable."},{"word":"surveillance","ko":"감시","form":"surveillance","example":"Celine sees a sharp pencil through the demands of surveillance."},{"word":"misread","ko":"잘못 해석하다","form":"misreads","example":"The children gain something from the exchange, and the surrounding system misreads the result."},{"word":"relief","ko":"안도, 완화","form":"relief","example":"Better grades can bring temporary relief while allowing the adults to believe their methods are working."}],"grammar":{"title":"need to + 동사원형","ko":"해야 할 필요가 있는 행동을 말한다. 주어에 따라 need 또는 needs를 쓴다.","quote":"Ahn: The characters cannot speak freely, but they still need to act.","answer":"need to","blank":"Ahn: The characters cannot speak freely, but they still  ____  act.","wrong":["needs for","need that to"],"example":"The character needs to respond in real time.","translation":"캐릭터가 실시간으로 반응해야 한다."},"question":"Choose an object from the film. How does its meaning change?","frame":"At first, the object represents __. Later, it becomes __."}},{"title":"6 Care Control and the Adults","blocks":[{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Celine begins by checking whether Hye-mi is breathing. It is an action that can look caring and frightening at once.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" She is attending to a real vulnerability. At the same time, she controls the room, the door, the objects, the schedule, and the account of how Hye-mi is doing. That combination is important. If we remove the possibility that Celine understands herself as protective, we lose part of how her authority works. She has a reason for the inspection. That reason can become permission to occupy almost every part of Hye-mi’s life.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" How do you distinguish protection from control?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I look at whether the person receiving care has any meaningful space to respond. Can Hye-mi express a preference? Can she explain what an object means? Can she disagree without having the disagreement used as evidence that she needs more supervision? The film gives those questions practical forms. A drawer locks. A bag is searched. Someone decides when she will speak to the police.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Celine also monitors grades.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The grade offers her a convenient indicator. When it improves, she can treat it as proof that the arrangement is helping. The child’s private source of relief remains invisible to her. The danger is a system that recognizes performance more readily than suffering. Its measurements can improve while the conditions remain harmful.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Hye-mi’s mother is physically distant but still exerts pressure.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Her voice enters through the phone. Money, sacrifice, and the future become part of the conversation. Hye-mi is asked to account for what has been invested in her. I want the distance to remain palpable. The mother can reach her through expectations without necessarily seeing the room in which those expectations are being enforced.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Is the film making a claim about Korean parents?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It is telling a story through particular Korean characters and particular pressures. I want the cultural setting to remain specific. I would resist turning that into an explanation of every family or every parent. The broader question is how love, responsibility, achievement, and reputation can become difficult to separate. Other viewers may recognize that structure through different lives.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" What about Karen? Her work initially seems humiliating, but later she becomes more responsive.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That movement matters. In the early session, Hye-mi has to produce an expression that can be recognized as progress. The exercise may have an intention, but the demand meets her in a painful way. Later, Karen’s attention changes. There is a moment of waiting and contact that allows something else to happen. I want that possibility to remain in the story. The film can examine a failed encounter without claiming that every form of therapy is the same encounter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Does Karen’s response arrive too late?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It cannot undo everything. That does not make the change meaningless. One person beginning to listen differently can matter while still being insufficient to protect someone from the larger situation.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" And the police?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" They need an account of what happened. The categories of the investigation have a purpose. The difficulty is what happens when a person’s ability to answer has been damaged by the same conditions the investigation needs to understand. Celine arrives with language that can make Hye-mi’s account less credible before she has given it. The investigator is hearing about her through someone whose authority is already established.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" So the danger is also in who gets to describe whom.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. Someone who speaks fluently about another person can begin to occupy the place where that person’s own account should be. The film asks how we notice that occupation.\n","b":false,"i":false}]}],"lesson":{"words":606,"vocab":[{"word":"vulnerability","ko":"취약성","form":"vulnerability","example":"Ahn: She is attending to a real vulnerability."},{"word":"occupy","ko":"차지하다, 머물다","form":"occupy","example":"That reason can become permission to occupy almost every part of Hye-mi’s life."},{"word":"suffering","ko":"고통","form":"suffering","example":"The danger is a system that recognizes performance more readily than suffering."},{"word":"intention","ko":"의도","form":"intention","example":"The exercise may have an intention, but the demand meets her in a painful way."}],"grammar":{"title":"there is / there are","ko":"무엇이 존재한다고 말할 때 사용한다. 뒤에 오는 명사의 수에 맞춰 is 또는 are를 선택한다.","quote":"There is a moment of waiting and contact that allows something else to happen.","answer":"There is","blank":" ____  a moment of waiting and contact that allows something else to happen.","wrong":["there being","there be"],"example":"There are several ways to read the scene.","translation":"이 장면을 읽는 방식은 여러 가지다."},"question":"When can care become control in the film?","frame":"Care becomes control when __."}},{"title":"7 Two People in a Room","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" So much of the film’s warmth happens in a locked room. How do you think about that contradiction?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The room is part of Hye-mi’s confinement. It also becomes the place where the children can briefly decide how to be near each other. They do not gain a new room. They change what can happen inside the one they have. That makes the refuge fragile from the beginning.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" They communicate through imitation and play.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I like the way imitation can begin awkwardly and become a shared rhythm. One person moves, the other responds. A practical exchange becomes something they enjoy. The attention goes both ways. Hye-mi helps Jun, but he also notices her. He picks something up, stays beside her, or answers with a gesture. She is no longer only the person being inspected.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What is the difference between being noticed by Jun and being watched by Celine?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Jun’s attention can be answered. Hye-mi can make a face, pause, or change the game. Their exchange develops from what each person does next. Celine’s attention often begins with an interpretation already in place. The object is dangerous. The grade is insufficient. The expression must improve. Hye-mi has to live within the result.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Jun embraces her after her private work is confiscated. Does the child become the caregiver?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" For that moment, he responds to her pain. I would avoid turning him into someone whose purpose is to heal her. He is still a child who needs care himself. The embrace matters because the relationship can hold an exchange that the adult world has failed to provide. It should not mean that he now carries responsibility for her well-being.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" The children’s secrecy also creates danger.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. The film cannot treat the secret arrangement as a safe model simply because it contains tenderness. The conditions force them toward an improvised refuge with real limits. That is part of the tragedy. The relationship gives them something valuable while the way they have to sustain it exposes them to danger.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Would it be fair to call them a family?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A viewer may use that word to describe what they recognize. I would want the relationship to remain specific before assigning it a complete role. They study, eat, play, and remain near each other. Those actions let us experience what they give each other. The name can come afterward.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Is it important that Hye-mi has interests beyond Jun?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Very important. Her drawing life exists before the relationship. Jun changes its direction, but he does not create her entire interior world. I want the viewer to feel that there is a person whose imagination has been kept out of sight. The relationship makes another use of that imagination possible.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Are the joyful scenes there mainly to make the ending hurt more?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I would not want to give them only that function. They need their own time. Eating together or enjoying a solved problem is already a part of life worth showing. The ending changes how we remember those scenes, but it does not cancel what happened within them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What can the room hold that the institutions cannot?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" At certain moments, it can hold a person without immediately requiring an account of improvement. They can remain together without proving that the encounter has produced a result. That is a very ordinary kind of freedom. The film makes its absence elsewhere difficult to ignore.\n","b":false,"i":false}]}],"lesson":{"words":581,"vocab":[{"word":"confinement","ko":"감금, 제한된 공간에 갇힘","form":"confinement","example":"Ahn: The room is part of Hye-mi’s confinement."},{"word":"fragile","ko":"깨지기 쉬운, 불안정한","form":"fragile","example":"That makes the refuge fragile from the beginning."},{"word":"specific","ko":"구체적인, 특정한","form":"specific","example":"I would want the relationship to remain specific before assigning it a complete role."},{"word":"gesture","ko":"몸짓","form":"gesture","example":"He picks something up, stays beside her, or answers with a gesture."}],"grammar":{"title":"how to + 동사원형","ko":"어떻게 ~하는지를 짧게 표현한다. know, learn, decide 같은 동사 뒤에 자주 온다.","quote":"It also becomes the place where the children can briefly decide how to be near each other.","answer":"how to","blank":"It also becomes the place where the children can briefly decide  ____  be near each other.","wrong":["how for","how that"],"example":"We are learning how to document the process.","translation":"우리는 과정을 어떻게 기록할지 배우고 있다."},"question":"How do the two children change the meaning of the room?","frame":"Inside the room, they begin to __."}},{"title":"8 Time to Notice","blocks":[{"kind":"p","r":[{"t":"When a character does not explain what she feels, the filmmaker still has to decide how the audience will spend time with her.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A quiet character can disappear if the image gives the viewer nothing to attend to. Quietness alone does not create an interior life on screen.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I have to think about the action, the duration, and the world that continues around the face.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A face under a question\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Near the end of ","b":false,"i":false},{"t":"The Silence We Share","b":false,"i":true},{"t":", the detective asks Hye-mi for answers. The narrative stays with changes in her face: tension in the mouth, a movement of the eyelids, tears that do not settle into a simple release.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The scene needs time because the pressure does not arrive as a single expression. We may first expect an answer. Then we begin to watch the effort around its absence.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"If I explain that effort too quickly, the viewer can stop looking. If I withhold every point of contact, the scene can become opaque in a way that leaves the character alone again.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I am interested in working between those risks.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Long takes have consequences\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A long take can make waiting tangible. It can also become a habit a director uses to announce seriousness.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The question is what develops during the time. Does an action change? Does the viewer notice a relationship they had overlooked? Does a sound alter how we understand the room?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I do not want the length of a shot to stand in for its attention.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The recurring routines in this story offer one way for duration to work. A check, a meal, a car journey, a page of schoolwork. When the action returns, the viewer brings the earlier encounter into it. A small difference can carry more weight because something has become familiar.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Silence has a sound around it\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The film’s quiet moments remain full of sound: keys moving away, a drawer closing, small metallic clicks, a voice crossing the street, food being prepared, the ordinary movement of a house.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Those sounds establish where authority is and what might happen next.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A key can tell Hye-mi that she is alone before the image confirms it. A voice from another house can cross a boundary the children are not allowed to cross openly. A small domestic action can continue while something unbearable has happened nearby.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want sound to carry the life around the character without always translating it into an emotional instruction.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The audience learns a routine\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Repetition gives the viewer knowledge of the household. We begin to anticipate the inspection, the comment about grades, the closing door.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That anticipation can become uncomfortable. We know enough to predict what Hye-mi may face, yet we remain unable to interrupt it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The private exchanges with Jun develop another routine. A page receives an answer. A visit becomes familiar. The story lets us feel the relief of that repetition while showing how precarious it remains.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want both routines to have a rhythm the audience can learn. Then the interruption of a routine becomes an event in itself.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The smallest voluntary sound\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Hye-mi’s small laugh in therapy matters because the story has changed our attention to her voice.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"It does not prove that she has recovered. It is one sound that emerges through her own response. The distinction is important in a film where other people keep interpreting visible performance as progress.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The laugh can be modest and still change the room.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Giving the viewer room\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Restraint does not mean that I have no view of the events. The sequence, framing, and duration already give the film a position.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"What I hope to leave open is the viewer’s work within that position. They can notice a detail, revise an interpretation, or disagree with how the film has arranged their attention.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want the image to offer enough time for that activity.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The scene should continue to live after its first explanation.\n","b":false,"i":false}]}],"lesson":{"words":624,"vocab":[{"word":"restraint","ko":"절제, 억제","form":"Restraint","example":"Restraint does not mean that I have no view of the events."},{"word":"precarious","ko":"위태로운, 안정적이지 않은","form":"precarious","example":"The story lets us feel the relief of that repetition while showing how precarious it remains."},{"word":"anticipate","ko":"예상하다","form":"anticipate","example":"We begin to anticipate the inspection, the comment about grades, the closing door."},{"word":"anticipation","ko":"기대, 예측","form":"anticipation","example":"That anticipation can become uncomfortable."}],"grammar":{"title":"does not mean (that) + 절","ko":"앞의 사실에서 어떤 결론이 바로 따라오지 않음을 말한다. does 뒤에는 mean 원형을 쓴다.","quote":"Restraint does not mean that I have no view of the events.","answer":"does not mean","blank":"Restraint  ____  that I have no view of the events.","wrong":["does not means","does not meaning"],"example":"This does not mean the audience agrees.","translation":"그렇다고 관객이 동의한다는 뜻은 아니다."},"question":"What can a long take give a viewer time to notice?","frame":"A long take gives the viewer time to notice __."}},{"title":"9 The Ending and the Scene After the Credits","blocks":[{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" I want to separate two questions that can easily become tangled. One is what physically happens to Jun. The other is how Hye-mi experiences the event.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That separation is useful. Jun falls during their secret attempt to move him between the yard and the room. Hye-mi cannot reach him through the locked door. The sequence then moves through her desperate action and into an unstable encounter on the grass. There, the children speak and laugh together. It gives them a moment that the rest of the story has made almost impossible. But the scene does not establish a secure reality in which everything has become safe.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Is that moment a dream?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Dream is one way a viewer might approach it. Shock, wish, and dissociation are also ways of describing the experience the passage invites. I would want to preserve its uncertainty rather than turn a clinical term into a final diagnosis. What matters is how urgently Hye-mi needs Jun to be there and responsive. The image lets that need occupy time. The morning does not confirm that the imagined safety has lasted.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Could the scene be read as presenting death as a place where the children can finally be free?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That is a serious risk to consider. I do not want their tenderness to make death appear to be the solution to the world around them. The scenes afterward return us to consequence, concealment, and the impossibility of restoring what has happened. The warmth of the encounter on the grass should remain tied to loss and instability. It is painful because ordinary life failed to make room for what they needed.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Then Hye-mi wakes in an orderly room. The traces are gone.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The absence becomes another event. Someone has made the room appear as if a particular history did not take place there. Hye-mi has to look for evidence of something she has lived through. That makes her dependence on the adults’ account even more frightening.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" The audience does not learn the full staging until after the credits.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The post-credits sequence shows Celine discovering Jun, moving his body to the front of his own house, and removing traces from Hye-mi’s room. Later, his parents arrange his appearance before contacting the police. Those actions clarify part of the physical account. They also show adults changing what the next witness will encounter.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Does the sequence reveal that Celine killed him?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It shows concealment and alteration of the scene after the fall. That is the action the film shows. I would not turn it into an additional event that the story has not shown. Her responsibility does not need that extra claim to become grave. She responds to a child’s body by managing where it will be found and what will remain visible.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" Why show that material after the credits rather than before the interrogation?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It changes when the audience can assemble the account. We sit with Hye-mi’s inability to answer before receiving another piece of what happened. There is a risk in that structure too. A viewer may treat the later scene as a solution that closes the film. I want it to make the earlier questions more troubling. We now know more about what has been hidden, while Hye-mi remains inside a situation where others have already described her.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" What remains unresolved after that clarification?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The full status of the encounter on the grass, and what Hye-mi can do with the experience afterward. The later scene can clarify the staging without giving us complete access to her consciousness.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Moderator:","b":true,"i":false},{"t":" The final image leaves a faint smile on her face. Why end with something so difficult to read?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Because a visible expression is not a reliable summary of what someone has lived through. The film begins with adults inspecting signs and deciding what they mean. I do not want the last expression to suddenly become an uncomplicated answer. A smile can hold a memory, a wish, or something the viewer cannot settle. Its presence should ask us to look carefully at the impulse to explain it.\n","b":false,"i":false}]}],"lesson":{"words":691,"vocab":[{"word":"concealment","ko":"은폐","form":"concealment","example":"The scenes afterward return us to consequence, concealment, and the impossibility of restoring what has happened."},{"word":"presence","ko":"존재감, 현존감","form":"presence","example":"Its presence should ask us to look carefully at the impulse to explain it."},{"word":"dependence","ko":"의존","form":"dependence","example":"That makes her dependence on the adults’ account even more frightening."},{"word":"uncertainty","ko":"불확실성","form":"uncertainty","example":"I would want to preserve its uncertainty rather than turn a clinical term into a final diagnosis."}],"grammar":{"title":"would want to + 동사원형","ko":"아직 결정되지 않은 상황에서 어떤 선택을 하고 싶은지 조심스럽게 제안한다.","quote":"I would want to preserve its uncertainty rather than turn a clinical term into a final diagnosis.","answer":"I would want to","blank":" ____  preserve its uncertainty rather than turn a clinical term into a final diagnosis.","wrong":["I would want that","I would wanted to"],"example":"I would want to compare the two versions.","translation":"두 버전을 비교해보고 싶다."},"question":"What does the post-credits sequence clarify? What remains open?","frame":"The final sequence clarifies __. We are still left wondering __."}},{"title":"10 Questions from the Audience","blocks":[{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Why do the children remain silent even when they are alone together?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Being away from an adult voice does not immediately undo what speaking has come to mean. They begin with the forms available to them: looking, responding, passing something between them. Their quiet develops its own rhythm. I want the relationship to grow without requiring a speech that proves they have become close.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Is Hye-mi responsible for Jun’s death?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Her actions are part of the chain of events, and she may carry an unbearable feeling of responsibility. I would separate that from a quick judgment that places the whole event on her. We also have to examine why a young person under supervision has become the one trying to provide refuge for another child, and why the adults respond by protecting appearances.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Why doesn’t she tell a teacher or therapist about Jun?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The question matters. The film shows encounters that have taught her how easily adults translate behavior into their own expectations. That does not prove every possible adult would fail her. It shows why the possibility of telling someone may not feel simple from where she stands. The difficulty of speaking is part of the situation, not an empty space the plot can fill whenever it needs information.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Are you making her too passive?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" She initiates exchanges, solves problems, makes things, develops a private routine, and responds to Jun. Those actions matter even when she cannot control the larger situation. I would also want a viewer to ask whether the film has given her enough life beyond endurance. Her imagination and her small preferences are important to that question.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Does Celine care about her at all?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" The film gives her actions that can contain concern. It also shows that concern operating through control and, eventually, concealment. I do not need to deny every feeling of care in order to judge what she does. A feeling does not automatically make its consequences protective.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Why does she keep eating during moments that feel disturbing?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Appetite gives her a bodily ease that Hye-mi rarely seems to have. The ordinary activity continues while another person’s position becomes more restricted. I want the discomfort to come through that relationship. Eating itself should not become a moral defect or a substitute for character.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What does the “God is watching” sign mean?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" In that room, it adds another form of observation to an already supervised act. The setting gives the words their pressure. The scene asks how a language of moral care can be used to reinforce control. I would not use the sign to explain every religious person or every form of faith.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Why is Korean first heard through the argument across the street?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A familiar language reaches Hye-mi in a place where it might have offered recognition or comfort, but the encounter is painful. That gives belonging a difficult sound. The language itself carries many possibilities. The scene makes one of them arrive before she has chosen it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Is Danny only there to make the therapy scenes strange?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" His laughter disrupts the expected emotional order of the room. It can be cruel to Hye-mi, and later it becomes part of a more complicated shared atmosphere. I would want his presence to remain connected to the uncertainty of how people express distress, rather than making him an easy explanation or a joke at the expense of those in therapy.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" When Hye-mi cries, is that a breakthrough?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Something becomes possible in that encounter. I would resist turning it into a certificate of recovery. The film has already shown how quickly a visible response can be measured and misread. Crying can matter without settling the conditions of her life.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Does the film distrust every institution?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It examines a chain of encounters in which the people responsible for protection often fail to listen adequately. There are differences within that chain. Karen changes how she attends to Hye-mi. The investigator tries to establish events. Those possibilities matter alongside their limits. The question is what each encounter requires before a vulnerable person can be heard.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Would more dialogue make the social criticism clearer?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It might make certain arguments easier to state. I am interested in what happens when the audience has to spend time with the conditions before receiving an explanation. The form should still be clear enough for viewers to follow the relationships. Sparse dialogue does not excuse a vague dramatic structure.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What would a hopeful ending look like to you?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I would first ask what kind of hope the story has earned. An added speech or an adult suddenly behaving perfectly could make the situation feel simpler without changing its foundations. The existing story keeps the loss present. Any hope has to begin with taking that loss seriously and reconsidering how the people around the children have acted.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Why include the post-credits scene if some people may leave before it?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That is a practical question the final form would need to resolve. The placement changes how information arrives, but essential material should not depend on a viewer guessing an exhibition convention. I would want to consider how the screening signals that the work continues. An artistic intention still has to meet the way people actually watch.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" Is the audience supposed to solve the case?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" They can reconstruct parts of it, especially after the final sequence. But a solved sequence of events does not exhaust the film. The children’s relationship, the meanings of silence, and the adults’ control over the account remain questions even when we understand more of the physical action.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What if I remain angry with Hye-mi?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I would want to hear what produced that anger. Perhaps the film has made you feel the consequences of an action. Perhaps an expectation about how a vulnerable person should behave has become visible. We can examine the response without requiring you to replace it immediately with the feeling I prefer.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Audience member:","b":true,"i":false},{"t":" What if I identify with one of the adults?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" That can become a difficult and useful place to think from. Recognition does not require excusing the action. It may let someone ask when concern became the wish to control another person’s account, or when an expectation stopped leaving room for a person’s distress.\n","b":false,"i":false}]}],"lesson":{"words":1086,"vocab":[{"word":"distress","ko":"고통, 괴로움","form":"distress","example":"I would want his presence to remain connected to the uncertainty of how people express distress, rather than making him an easy explanation or a joke at the expense of those in therapy."},{"word":"judgment","ko":"판단","form":"judgment","example":"I would separate that from a quick judgment that places the whole event on her."},{"word":"concealment","ko":"은폐","form":"concealment","example":"It also shows that concern operating through control and, eventually, concealment."},{"word":"vulnerable","ko":"취약한, 상처 입기 쉬운","form":"vulnerable","example":"The question is what each encounter requires before a vulnerable person can be heard."}],"grammar":{"title":"do not + 동사원형","ko":"현재의 의견이나 습관을 부정할 때 do not 뒤에 동사원형을 쓴다.","quote":"I do not need to deny every feeling of care in order to judge what she does.","answer":"I do not","blank":" ____  need to deny every feeling of care in order to judge what she does.","wrong":["I does not","I am not to"],"example":"I do not assume that every viewer agrees.","translation":"관객 모두가 동의한다고 가정하지 않는다."},"question":"Choose a question from the audience and give your own answer.","frame":"My reading of the scene is __ because __."}},{"title":"11 After the Witness Leaves","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Your earlier short ","b":false,"i":false},{"t":"Non-done Record","b":false,"i":true},{"t":" also concerns a person under pressure from a competition-driven society. What connects it to this story?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I am interested in what happens when a person becomes legible mainly through performance. A grade, a completed task, or a sign of improvement can make someone easier for a system to manage. The dramatic question is what remains outside those indicators. How does that pressure enter the body, a room, or an ordinary relationship? ","b":false,"i":false},{"t":"The Silence We Share","b":false,"i":true},{"t":" develops the question through two young people and the adults who interpret them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" You work across film and media art. Does that change how you think about a film audience?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It makes me attentive to the conditions of looking. In a film, I largely determine the sequence and duration. In an interactive work, someone may change the pace or position through which an image becomes available. The forms ask different things of me. Here, I want the sequence itself to change what the audience thinks it knows. A later moment can return them to an earlier image without physically moving them through a space.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Does ambiguity give the audience more freedom?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It can, if there is enough structure to make interpretation meaningful. Ambiguity can also become a way for a filmmaker to avoid making a decision. I want the story to be precise about the actions it gives us. Celine moves the body and removes evidence. The parents manage appearances. Hye-mi faces questions she cannot readily answer. The uncertainty belongs to particular parts of the experience, rather than making every event equally unknowable.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" How do you think about directing restrained performances?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" As a principle, I would begin with the action and the relationship rather than asking someone to demonstrate a large abstract feeling. What is the character trying to get through? What are they watching for? What are they unable to let another person notice? The process needs to develop with the performers, including how to work responsibly with the material and with young actors.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What would you want to avoid?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Treating a performer’s distress as proof of an authentic scene. The work is to create a convincing relationship through craft and a responsible working environment. A painful story does not require the production to reproduce its conditions.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Is there a danger of making suffering beautiful?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. Composition and duration can give pain a form that becomes pleasurable to contemplate. I have to ask what the form allows us to notice and whether the character remains a person within it. Hye-mi needs preferences, attention, awkwardness, and the ability to enjoy something. Jun needs the time of being a child, rather than appearing only as a sign of harm. Those aspects do not remove the danger, but they keep the film answerable to more than its tragic structure.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Can a film change the systems it examines?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" A film alone cannot promise that result. It can make an experience available to attention and conversation. Someone may recognize a pattern they had treated as normal. Someone may question an interpretation they were ready to accept. I value that possibility without turning it into a claim that watching is the same as changing a person’s circumstances.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What does success mean for this film?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I would hope the viewer remembers the children as people who shared a life, however briefly, rather than only as the subjects of a tragedy. I would also hope the ending changes how they understand the quiet moments that came before it. Those are artistic hopes. The audience will decide what remains with them.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What would you ask someone who had just watched it?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Where did your understanding change? And which moment are you still unable to place? The answers might teach me something about what the film has made visible, and what it has left too far away.\n","b":false,"i":false}]}],"lesson":{"words":656,"vocab":[{"word":"ambiguity","ko":"모호함, 여러 해석이 가능함","form":"ambiguity","example":"Interviewer: Does ambiguity give the audience more freedom?"},{"word":"interpret","ko":"해석하다","form":"interpret","example":"The Silence We Share develops the question through two young people and the adults who interpret them."},{"word":"duration","ko":"지속 시간","form":"duration","example":"In a film, I largely determine the sequence and duration."},{"word":"legible","ko":"읽을 수 있는, 쉽게 파악할 수 있는","form":"legible","example":"Ahn: I am interested in what happens when a person becomes legible mainly through performance."}],"grammar":{"title":"have to + 동사원형","ko":"상황이나 책임 때문에 해야 할 일을 말한다. to 뒤에는 동사원형이 온다.","quote":"I have to ask what the form allows us to notice and whether the character remains a person within it.","answer":"I have to","blank":" ____  ask what the form allows us to notice and whether the character remains a person within it.","wrong":["I have for","I have to be to"],"example":"I have to check the timing again.","translation":"타이밍을 다시 확인해야 한다."},"question":"What draws you to minimal dialogue as a filmmaker?","frame":"I use minimal dialogue to give the audience time to __."}},{"title":"12 Another Witness","blocks":[{"kind":"p","r":[{"t":"At the end of a film, the characters can become very easy to describe.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"We have seen their actions. We have arranged their motives. We know which scene we would use to explain them to someone who was not there.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want to remain cautious at that moment.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Hye-mi has been described throughout the story. She is quiet. She studies. She needs supervision. She is improving. She is unstable. She may know nothing.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Some descriptions begin with something visible. Each can become a way to stop looking.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The film has to be careful about what it adds to that list.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"What they gave each other\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"There are scenes in which Hye-mi and Jun do ordinary things. A problem is solved. Food is shared. One person watches another draw. A gesture becomes funny because someone repeats it.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want those moments to remain specific after the ending. The later loss does not mean the earlier joy was false.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Their time together is part of what happened. It belongs in the account beside the harm, even though it cannot repair it.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The account that survives\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"After Jun’s death, adults begin arranging what can be seen and said. The lawn, the room, the child’s appearance, the description of Hye-mi: each becomes part of a struggle over the event.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The audience eventually receives information that changes the account. We can look back and see an action we did not understand at first.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"But knowledge does not give us the children back. That limit should remain painful. An explanation has value, and it has a boundary.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Listening after the question\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"A question can open a space. It can also fill the space so completely that only one kind of answer seems acceptable.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I think about the detective asking Hye-mi to speak. I think about the teacher accepting her silence. I think about Karen beginning to understand that a response may take another form or another amount of time.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The responsibility is different in each room. So is the possibility of listening.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"When I make a film about silence, I have to consider the room I am making for the viewer. Am I asking them to witness, or am I requiring them to perform the correct emotion? Have I given them enough to think with? Can their disagreement enter the conversation?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Those questions continue after the credits.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Another witness\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"You may leave this screening with a scene that someone else barely remembers. You may distrust an image that another viewer finds comforting. You may return to the story and find that your first explanation no longer holds.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I want the film to have enough life for that return.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The conversation after it can remain unfinished. We can say what we saw, ask what someone else noticed, and become more precise about what we do not know.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"At the beginning of my description of cinema, you are looking through a window.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"At the end, there is another witness beside you.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I would like to hear what they saw.\n","b":false,"i":false}]}],"lesson":{"words":486,"vocab":[{"word":"precise","ko":"정확한, 정밀한","form":"precise","example":"We can say what we saw, ask what someone else noticed, and become more precise about what we do not know."},{"word":"consider","ko":"고려하다","form":"consider","example":"When I make a film about silence, I have to consider the room I am making for the viewer."},{"word":"remain","ko":"남다, 계속 ~한 상태다","form":"remain","example":"I want to remain cautious at that moment."},{"word":"describe","ko":"묘사하다, 설명하다","form":"describe","example":"At the end of a film, the characters can become very easy to describe."}],"grammar":{"title":"think about + 명사 또는 -ing","ko":"about 뒤에 생각의 대상을 넣는다. 동작을 넣을 때는 -ing를 쓸 수 있다.","quote":"I think about the detective asking Hye-mi to speak.","answer":"I think about","blank":" ____  the detective asking Hye-mi to speak.","wrong":["I think to","I thinks about"],"example":"I think about preserving the original voice.","translation":"원래 목소리를 보존하는 일을 생각한다."},"question":"What would you ask another person who saw the film?","frame":"I would ask what they noticed about __."}},{"title":"About the Filmmaker","blocks":[{"kind":"p","r":[{"t":"Jonghoon Ahn is a filmmaker and screenwriter based in Los Angeles and Seoul. His work explores silence, emotional repression, and social and educational systems that fail to protect individuals.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"As a child, Ahn studied abroad in the United States with his family. Facing linguistic barriers, he chose silence as a means of survival. After returning to Korea, silence remained a form of self-protection and a way of observing the world. Growing up in environments that emphasized achievement and conformity, he learned to watch closely before speaking. These experiences helped shape his cinematic perspective.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"During high school, Ahn encountered Andrei Tarkovsky’s ","b":false,"i":false},{"t":"Stalker","b":false,"i":true},{"t":". It opened an understanding of cinema in which emotion could develop through duration. He went on to study visual storytelling, developing a practice that uses minimal dialogue, long takes, and restrained visual language to observe people living under unspoken pressure.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"His short film ","b":false,"i":false},{"t":"Non-done Record","b":false,"i":true},{"t":" (2024) portrays a young man collapsing under the demands of a competition-driven society. The project was selected as a finalist for the Sundance Ignite × Adobe Fellowship. Ahn’s work also received recognition through the CJ & TIFF K-Story Fund and the Academy Nicholl Fellowships.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"He holds an MFA in Art and Technology from the California Institute of the Arts and a BFA in Entertainment Design from Kookmin University. Alongside filmmaking and screenwriting, he works with digital humans, XR, and media art.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"His filmmaking philosophy begins with the image of a moving car: the viewer is a witness, the world outside is the event, and the car is the theater. When the film ends, interpretation continues through conversation with other witnesses.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Selection  Awards\n","b":false,"i":false}]},{"kind":"table","rows":[["Year","Program","Recognition"],["2025","CJ & TIFF K-Story Fund","Shortlist"],["2025","Academy Nicholl Fellowships","Official Entrant"],["2024","Sundance Ignite × Adobe Fellowship","Finalist"]]}]}]},{"title":"When a Face Becomes Someone","url":"https://docs.google.com/document/d/1tgxbi2A33UwDeeGhC1ERp5eQbf1F2InTRNXCRMQU5yA","sections":[{"title":"1 What Do You Actually Do","blocks":[{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" You describe yourself as a digital human technical director and a real-time technical artist. Why both?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Jonghoon Ahn:","b":true,"i":false},{"t":" They describe different responsibilities I take across projects. As a technical director, I may be responsible for how the character moves through the whole production: source data, geometry, rigging, capture, animation, rendering, and delivery. I have to understand how a decision at one stage affects the next. As a technical artist, I also work directly on the systems that make an artistic intention possible. That might be a shader, a facial-animation edit, an interaction, or a way to control something reliably in an engine. The title depends on the project. I want the description underneath it to say what I actually owned.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What connects those responsibilities for you?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Translating an intention into something people can encounter. That requires solving technical problems, but it also requires deciding which problem matters. A character may render beautifully and fail to resemble the person it represents. A capture may contain a great performance and arrive in a form the next department cannot use. A camera move may look convincing on a monitor and feel uncomfortable in a headset. In each case, the system works in one sense. I have to understand the sense in which it fails.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Is that where your interest in perception begins?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Yes. People judge the result through things that are difficult to summarize with a render setting. A familiar gesture, the timing of a response, the way a voice sits within a body. Sometimes a small mismatch becomes more important than a large increase in visual detail. I started thinking about the digital human as a way to investigate those judgments. The character becomes a place where a technical decision meets someone’s recognition.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Are you trying to make perfect replicas?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" I want the representation to serve the project accurately and convincingly. A replica can be one goal, but different projects need different relationships to the source. A historical reconstruction begins with limited evidence. A scanned person offers a different set of materials. A generated family member may be fictional from the beginning. These figures should not receive the same description simply because they share a realistic face.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" What does a digital human contain?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" Many contributions that can look like one presence. A reconstructed face, an actor’s movement, another person’s voice, a rig, a lighting environment, and editorial decisions about timing. The final figure can feel coherent enough that viewers stop noticing those separate origins. That coherence is an achievement. It can also hide information the viewer needs.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" So the technical work can create a philosophical problem.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" It can make an existing problem very concrete. What lets us recognize someone? What do we believe when a face speaks? How much authority do we give an image before asking where it came from? I meet those questions while correcting an eye position or choosing a capture take. The practical work gives the question resistance. I have to make a decision that changes the image.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Interviewer:","b":true,"i":false},{"t":" Where would you begin if someone wanted to understand your practice?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Ahn:","b":true,"i":false},{"t":" With a version that failed. It is often easier to see what matters when something has been lost.\n","b":false,"i":false}]}],"lesson":{"words":542,"vocab":[{"word":"perception","ko":"지각, 감각으로 이해하는 방식","form":"perception","example":"Interviewer: Is that where your interest in perception begins?"},{"word":"rig","ko":"캐릭터를 움직이는 제어 구조","form":"rig","example":"A reconstructed face, an actor’s movement, another person’s voice, a rig, a lighting environment, and editorial decisions about timing."},{"word":"coherence","ko":"일관성, 자연스럽게 맞물리는 성질","form":"coherence","example":"That coherence is an achievement."},{"word":"representation","ko":"재현, 표상","form":"representation","example":"Ahn: I want the representation to serve the project accurately and convincingly."}],"grammar":{"title":"has been + 과거분사 또는 보어","ko":"과거부터 현재까지 이어지는 상태나 결과를 말한다. 과거분사가 뒤따르면 현재완료 수동태가 될 수 있다.","quote":"It is often easier to see what matters when something has been lost.","answer":"has been","blank":"It is often easier to see what matters when something  ____  lost.","wrong":["has being","have been to"],"example":"The image has been edited.","translation":"이미지가 편집되었다."},"question":"How would you explain your work as a technical director to a friend?","frame":"I help turn __ into __."}},{"title":"2 The Character Worked","blocks":[{"kind":"p","r":[{"t":"The first version worked.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"It could be rigged. The textures appeared. The hair moved. Animation played in real time. I had taken a difficult source and made a functional character.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Then I looked at the person it was supposed to represent.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The character had become too generic. It carried a relationship to the scan, but it had lost too much of the specific presence that made the scan worth working with.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That was the central production problem in my work on Yaloo’s Shininho project.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The source had a history\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"An external studio supplied the volumetric scan. My responsibility began with the downstream requirements and the transformation of that source into an animated real-time character.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The face and body arrived as one continuous mesh. It was valuable source material, but it was not already organized as a production character. I separated the facial region in Maya and prepared the geometry for rigging.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"For the feasibility version, I rebuilt symmetry, reduced and repaired the mesh, and used a fast auto-rigging path. I tested textures, hair, animation, and playback in Unity.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Those steps answered an important question: could the source become a working real-time character through the available workflow?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The answer was yes.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"They also exposed a harder question: what had that workflow removed?\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A cleaner mesh can carry less of a person\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Symmetry and simplification can be useful. They make certain operations easier and more predictable. They can also remove differences that matter to recognition.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I do not mean that every asymmetry is sacred or that every scan artifact should survive. The problem is deciding which differences belong to the person and which belong to the recording or reconstruction process.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"In the prototype, technical convenience had become too influential over the character’s identity. Further polish could improve the version I had. It could not automatically recover information I had discarded.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The appropriate correction was to return to the source.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Rebuilding around identity\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"For the production character, I went back to the high-resolution scan. Through Wrap, I aligned it with a MetaHuman-compatible structure, corrected local fitting problems, and transferred the scan-derived surface information.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The goal was to preserve the specific person while gaining a controllable facial and performance system. The production structure had to carry identity into animation, rather than replace it with a convenient template.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That intention reached into small decisions. Eye placement needed adjustment within the custom head. Age detail had to remain visible after texture transfer and shading. Missing upper-head surface information required reconstruction rather than being mistaken for captured evidence.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Hair integration remained difficult. A hat became a deliberate presentation choice so that an unstable groom would not dominate the face and performance.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I value that decision because production has priorities. A workaround can preserve the central experience better than continuing to spend time on a feature whose importance has become exaggerated by the difficulty of solving it.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Recognition changed the benchmark\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"After the rebuild, Yaloo, her granddaughter, recognized Shininho much more strongly.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"That response matters. It prevents me from turning the case into a simple claim that a digital reconstruction must always fail to feel like someone familiar.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The first version lost too much. The second recovered more of what mattered to a person with a relationship to the subject.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Neither version became the person herself. That was never something a topology change could establish. But the difference between them was significant and available to technical work.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"A useful failure\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"This is one reason I am interested in representational failure. It can identify a priority that a successful import or a clean render does not reveal.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The failure does not need to be permanent to teach us something.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"I can ask what changed between versions, whose judgment revealed the difference, and which decisions should now become part of the pipeline.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The technical artist learns to repair the image. The technical director learns to protec
