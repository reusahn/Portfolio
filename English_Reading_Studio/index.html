uestion: ","b":true,"i":false},{"t":"What criteria become visible when a computational person feels convincing in one respect and incomplete in another?\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"Model B\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Working notation: ","b":true,"i":false},{"t":"AI ≥ Image ≥ Sound ≥ Human\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Main question: ","b":true,"i":false},{"t":"What changes when a generated or selected account gains authority before its conditions are examined?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The notation expresses a conceptual ordering of authority. It does not define a universal sensory ranking, a biological processing sequence, an AI training order, or a hierarchy of moral worth.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"The current Xlayers\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"X₁\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Working name: ","b":true,"i":false},{"t":"History and Records\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Production question: ","b":true,"i":false},{"t":"Which features are supported by records, and which are reconstructed?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Boundary of the claim: ","b":true,"i":false},{"t":"Archival reconstruction does not establish unrecorded historical behavior.\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"X₂\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Working name: ","b":true,"i":false},{"t":"Relational Approval\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Production question: ","b":true,"i":false},{"t":"How do familiar observers judge likeness, gesture, and identity?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Boundary of the claim: ","b":true,"i":false},{"t":"Recognition can improve and can differ between observers. It is distinct from consent.\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"X₃\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Working name: ","b":true,"i":false},{"t":"Biological Finitude\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Production question: ","b":true,"i":false},{"t":"How do fatigue, persistence, risk, and consequence affect perceived vulnerability or aliveness?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Boundary of the claim: ","b":true,"i":false},{"t":"Representing vulnerability does not establish biological life, consciousness, or experienced suffering.\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"The layers are working labels that may overlap. Their relevance and separability remain questions for further study.\n","b":false,"i":false}]},{"kind":"h2","r":[{"t":"Different judgments behind the word real\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"Likeness\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Example question: ","b":true,"i":false},{"t":"Does the figure resemble the source person?\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"Identity recognition\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Example question: ","b":true,"i":false},{"t":"Does a familiar observer recognize the represented person?\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"Naturalness\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Example question: ","b":true,"i":false},{"t":"Does the movement seem plausible in this context?\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"Social presence\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Example question: ","b":true,"i":false},{"t":"Does the encounter feel socially responsive?\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"Perceived vulnerability\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Example question: ","b":true,"i":false},{"t":"Does the figure seem capable of undergoing consequential harm or change?\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"Factual belief\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Example question: ","b":true,"i":false},{"t":"Does the viewer think the depicted event physically occurred?\n","b":false,"i":false}]},{"kind":"h3","r":[{"t":"Source attribution\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"Example question: ","b":true,"i":false},{"t":"Does the viewer understand which elements were recorded, reconstructed, or generated?\n","b":false,"i":false}]},{"kind":"p","r":[{"t":"These judgments should not be assumed to move together. A fictional figure can create social presence, and an emotionally powerful image can be correctly recognized as generated.\n","b":false,"i":false}]}]}]}]</script>
<script>
'use strict';
const books=JSON.parse(document.getElementById('books').textContent);
const lessons=books.flatMap((b,bi)=>b.sections.flatMap((s,ci)=>s.lesson?[{...s.lesson,bi,ci,title:s.title}]:[]));
const storageKey='jha-reading-studio-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
let store={start:dateKey(),done:{},saved:{},known:{},notes:{},rate:0.85,size:19};
let storageAvailable=true;
try{Object.assign(store,JSON.parse(localStorage.getItem(storageKey)||'{}'));}catch{storageAvailable=false;}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(store));}catch{storageAvailable=false;}}
function dateAt(i){const d=new Date(store.start+'T12:00:00');d.setDate(d.getDate()+i);return d;}
function suggested(){const first=lessons.findIndex((_,i)=>!store.done[i]);if(first>=0)return first;return lessons.length-1;}
let day=suggested(),view='lesson',step=0,readerBook=0,readerChapter=0,filter='all',audioUrl='',recorder=null,mediaStream=null,clock=null,seconds=60,noticeTimer=null;
let quizState={};
const steps=['읽기','단어','문법','말하기'];
const title=s=>s.replace(/^\d+[. ]+\s*/,'');
const section=(bi,ci)=>books[bi].sections[ci];
const paraText=block=>block.r?.map(r=>r.t).join('').trim()||'';
const rangeText=s=>s.blocks.filter(b=>b.kind==='p').map(paraText);
const displayDate=d=>new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'short'}).format(d);
function announce(msg){const n=$('#notice');n.textContent=msg;n.hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.hidden=true,4200);}
function progress(){const n=lessons.filter((_,i)=>store.done[i]).length;$('#progress-label').textContent=n+' / '+lessons.length;$('#progress-bar').value=n;}
function stopVoice(){if('speechSynthesis' in window)window.speechSynthesis.cancel();}
function speak(str){if(!('speechSynthesis' in window)){announce('이 브라우저는 음성 읽기를 지원하지 않아요.');return;}stopVoice();const u=new SpeechSynthesisUtterance(str);u.lang='en-US';u.rate=Number(store.rate);const voices=speechSynthesis.getVoices();const v=voices.find(x=>x.lang==='en-US'&&x.localService)||voices.find(x=>x.lang==='en-US');if(v)u.voice=v;u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))announce('음성을 재생할 수 없어요. 브라우저의 영어 음성 설정을 확인해 주세요.');};speechSynthesis.speak(u);}
function stopTimer(){clearInterval(clock);clock=null;}
function stopRecording(){if(recorder?.state==='recording')recorder.stop();mediaStream?.getTracks().forEach(t=>t.stop());mediaStream=null;}
function resetActivity(){stopVoice();stopTimer();stopRecording();if(audioUrl){URL.revokeObjectURL(audioUrl);audioUrl='';}seconds=60;}
function changeView(v){resetActivity();view=v;render();}
function chooseDay(i){if(i<0||i>=lessons.length)return;resetActivity();day=i;step=0;view='lesson';render();$('#main-panel').scrollIntoView({block:'start'});}
function chooseStep(i){resetActivity();step=i;render();}
function sidebar(){
 const l=lessons[day];
 if(view==='lesson')return `
 <div class="group"><p class="kicker">Study plan</p><label for="day-select">읽을 구간</label><select id="day-select">${lessons.map((d,i)=>`<option value="${i}" ${i===day?'selected':''}>${store.done[i]?'✓ ':''}Day ${i+1} · ${esc(title(d.title))}</option>`).join('')}</select><button data-action="resume">다음 미완료 수업</button></div>
 <div class="group"><label for="start-date">시작일</label><input id="start-date" type="date" value="${esc(store.start)}"><p class="small quiet">하루 한 장 · 놓친 날은 이어서 학습</p><p class="small quiet">Day ${day+1} 예정일 · ${displayDate(dateAt(day))}</p></div>
 <div class="group"><span class="label">읽는 순서</span>${books.map((b,i)=>`<p class="small ${i===l.bi?'':'quiet'}">${i+1}. ${esc(b.title)}</p>`).join('')}</div>
 <p class="small quiet">${storageAvailable?'진도와 메모는 이 브라우저에 저장돼요.':'이 브라우저에서 저장을 사용할 수 없어요.'}</p>`;
 if(view==='reader')return `<p class="kicker">Library</p><label>목차</label><div class="contents-list">${books[readerBook].sections.map((s,i)=>`<button data-chapter="${i}" aria-current="${i===readerChapter}">${esc(s.title)}</button>`).join('')}</div><p class="small"><a href="${esc(books[readerBook].url)}" target="_blank" rel="noopener">Google Docs 원문 열기 ↗</a></p>`;
 return `<p class="kicker">Review</p><label for="filter">보기</label><select id="filter"><option value="all" ${filter==='all'?'selected':''}>저장한 단어</option><option value="study" ${filter==='study'?'selected':''}>복습할 단어</option><option value="known" ${filter==='known'?'selected':''}>익힌 단어</option></select><p class="small quiet">수업의 단어 탭에서 필요한 단어를 저장할 수 있어요.</p>`;
}
function textRuns(r){return r.map(x=>{let t=esc(x.t);if(x.b)t='<strong>'+t+'</strong>';if(x.i)t='<em>'+t+'</em>';return t;}).join('');}
function passage(s){return `<article class="passage" id="passage" lang="en" style="--reading-size:${Number(store.size)}px">${s.blocks.map((b,i)=>{
 if(b.kind==='table')return '<table>'+b.rows.map((r,j)=>'<tr>'+r.map(c=>j===0?'<th>'+esc(c)+'</th>':'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>';
 const tag=b.kind==='h2'?'h3':b.kind==='h3'?'h4':'p';
 return '<'+tag+'>'+textRuns(b.r)+(tag==='p'?'<button class="paragraph-read no-print" data-say-paragraph="'+i+'" aria-label="이 문단 듣기" title="이 문단 듣기">▶</button>':'')+'</'+tag+'>';
 }).join('')}</article>`;}
function readerControls(){return `<div class="row reader-bar no-print"><button data-action="read-selection">선택 문장 듣기</button><button data-action="stop-voice">정지</button><label class="small">속도 <select id="rate">${[0.7,0.85,1,1.15].map(n=>`<option value="${n}" ${n===Number(store.rate)?'selected':''}>${n}×</option>`).join('')}</select></label><label class="small">글자 <select id="size">${[16,19,22,25].map(n=>`<option value="${n}" ${n===Number(store.size)?'selected':''}>${n}px</option>`).join('')}</select></label><button data-action="print">이 장 인쇄</button></div>`;}
function wordCard(w,key,showKnown=false){return `<div class="wordcard"><div class="row"><h3 lang="en">${esc(w.word)}</h3><div class="row"><button data-speak="${esc(w.word)}" aria-label="${esc(w.word)} 듣기">▶ 듣기</button><button data-save="${esc(key)}" aria-pressed="${!!store.saved[key]}">${store.saved[key]?'저장됨':'저장'}</button>${showKnown?`<button data-known="${esc(key)}" aria-pressed="${!!store.known[key]}">${store.known[key]?'익힘 ✓':'익힘 표시'}</button>`:''}</div></div><p>${esc(w.ko)}${w.form.toLowerCase()!==w.word?` <span class="quiet small">원문 형태 · ${esc(w.form)}</span>`:''}</p>${w.example?`<p class="en quiet" lang="en">${esc(w.example)}</p>`:''}</div>`;}
function lessonContent(l){
 const s=section(l.bi,l.ci),pars=rangeText(s);
 if(step===0)return `<div class="scope small"><p><strong>오늘 읽을 구간</strong> · 이 장 전체</p><p lang="en">시작 · “${esc(pars[0]?.slice(0,95))}${pars[0]?.length>95?'…':''}”</p><p lang="en">끝 · “${esc(pars.at(-1)?.slice(-110))}”</p></div>${readerControls()}${passage(s)}`;
 if(step===1)return `<h3>오늘의 핵심 단어 ${l.vocab.length}개</h3><p class="quiet small">원문 예문을 읽고 뜻을 떠올린 뒤, 다시 보고 싶은 단어를 저장해 봐.</p>${l.vocab.map((w,i)=>wordCard(w,day+':'+i)).join('')}`;
 if(step===2){
  const g=l.grammar,picked=quizState[day],choices=[...g.wrong];choices.splice(day%3,0,g.answer);
  return `<h3>${esc(g.title)}</h3><p class="en scope" lang="en">${esc(g.quote)}</p><p>${esc(g.ko)}</p><div class="callout"><p class="en" lang="en">${esc(g.example)}</p><p class="small quiet">${esc(g.translation)}</p></div><h3>원문 문장 완성하기</h3><p class="en" lang="en">${esc(g.blank)}</p><div class="quiz">${choices.map(c=>`<button lang="en" data-quiz="${esc(c)}" class="${picked===c?(c===g.answer?'right':'wrong'):''}">${esc(c)}</button>`).join('')}</div><p role="status" class="small">${picked?(picked===g.answer?'정답이야. 문장을 소리 내어 한 번 읽어 봐.':'다시 골라 봐. 위의 문법 설명에서 단서를 찾아봐.'):'보기에서 알맞은 표현을 골라 봐.'}</p><details><summary>나만의 문장 만들기</summary><p>같은 문법으로 네 작업이나 일상에 관한 문장을 한 줄 적어 봐.</p><textarea id="grammar-note" class="note" aria-label="나만의 문장" placeholder="Write one sentence in English.">${esc(store.notes['g'+day]||'')}</textarea></details>`;
 }
 const g=l.grammar;
 return `<h3>1. 듣고 따라 말하기</h3><p class="en scope" lang="en">${esc(g.quote)}</p><div class="row"><button data-speak="${esc(g.quote)}">▶ 원문 듣기</button><button data-action="stop-voice">정지</button></div><p class="small quiet">한 번 듣고, 문장을 두 덩어리로 나눠 따라 말한 뒤 전체를 읽어 봐.</p><h3>2. 내 말로 60초 답하기</h3><p class="en" lang="en">${esc(l.question)}</p><p class="callout en" lang="en">${esc(l.frame)}</p><p class="small quiet">빈칸을 네 말로 채운 뒤, 구체적인 예 하나와 그 이유를 덧붙여 봐.</p><textarea id="speaking-note" class="note" aria-label="말하기 메모" placeholder="Keywords or a short outline…">${esc(store.notes['s'+day]||'')}</textarea><div class="row"><button data-action="timer">60초 시작</button><span id="timer-display" class="timer" aria-live="off">1:00</span><button data-action="record">녹음 시작</button><button data-action="stop-record" disabled>녹음 끝내기</button></div><div id="record-result"></div><p class="small quiet">녹음은 마이크 권한이 필요해. 이 페이지 안에서만 재생되며, 다른 활동으로 이동하면 사라져.</p><div class="callout small"><strong>다시 듣고 확인</strong><p>질문에 첫 문장으로 답했나? 오늘의 단어 하나와 문법 패턴 하나를 써 봤나? 예시를 한 가지 들었나?</p></div>`;
}
function render(){
 progress();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
 $('#sidebar').innerHTML=sidebar();
 const panel=$('#main-panel');
 if(view==='lesson'){
 const l=lessons[day];
 panel.innerHTML=`<div class="lesson-head"><p class="kicker">Day ${String(day+1).padStart(2,'0')} / ${lessons.length} · ${esc(books[l.bi].title)}</p><h2>${esc(title(l.title))}</h2><p class="small quiet">${l.words.toLocaleString()}단어 · 읽기 약 ${Math.ceil(l.words/100)}분 · 단어·문법·말하기 약 10분 ${store.done[day]?' · 완료 ✓':''}</p></div>
 <div class="steps" aria-label="학습 단계">${steps.map((s,i)=>`<button data-step="${i}" aria-pressed="${i===step}">${i+1}. ${s}</button>`).join('')}</div><div class="content">${lessonContent(l)}</div><div class="pager"><button data-action="prev" ${day===0?'disabled':''}>← 이전 날</button>${step<3?`<button class="primary" data-step="${step+1}">다음 · ${steps[step+1]} →</button>`:`<button class="primary" data-action="done">${store.done[day]?'완료 표시 해제':'오늘 학습 완료'}</button>`}<button data-action="next" ${day===lessons.length-1?'disabled':''}>다음 날 →</button></div>`;
 }else if(view==='reader'){
 const b=books[readerBook],s=b.sections[readerChapter],idx=lessons.findIndex(l=>l.bi===readerBook&&l.ci===readerChapter);
 panel.innerHTML=`<div class="lesson-head"><p class="kicker">Reading library</p><h2>나의 영어 리딩북</h2></div><div class="content"><div class="catalog no-print">${books.map((book,i)=>`<button data-book="${i}" aria-pressed="${i===readerBook}"><span class="small quiet">BOOK 0${i+1}</span><strong>${esc(book.title)}</strong></button>`).join('')}</div><h2>${esc(s.title)}</h2>${idx>=0?`<button class="no-print" data-day="${idx}">Day ${idx+1} 수업 열기 →</button>`:''}${readerControls()}${passage(s)}</div><div class="pager"><button data-action="reader-prev" ${readerChapter===0?'disabled':''}>← 이전 장</button><button data-action="reader-next" ${readerChapter===b.sections.length-1?'disabled':''}>다음 장 →</button></div>`;
 }else{
 const entries=Object.keys(store.saved).filter(k=>store.saved[k]&&(filter==='all'||((filter==='known')===!!store.known[k]))).map(k=>{const [d,i]=k.split(':').map(Number);return {k,d,w:lessons[d]?.vocab[i]};}).filter(e=>e.w);
 panel.innerHTML=`<div class="lesson-head"><p class="kicker">Vocabulary notebook</p><h2>나의 단어장</h2></div><div class="content"><p class="quiet">${entries.length}개 단어</p>${entries.length?entries.map(e=>`<div><button data-day="${e.d}" class="small">Day ${e.d+1} 원문 수업</button>${wordCard(e.w,e.k,true)}</div>`).join(''):'<p>표시할 단어가 없어요. 수업에서 단어를 저장해 보세요.</p>'}</div>`;
 }
}
function activeSection(){const l=lessons[day];return view==='reader'?section(readerBook,readerChapter):section(l.bi,l.ci);}
function toggleTimer(){
 if(clock){stopTimer();$('[data-action=timer]').textContent='계속';return;}
 if(seconds<=0)seconds=60;
 $('[data-action=timer]').textContent='잠깐 멈춤';
 clock=setInterval(()=>{seconds--;const el=$('#timer-display');if(!el){stopTimer();return;}el.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(seconds<=0){stopTimer();$('[data-action=timer]').textContent='다시 시작';announce('60초가 끝났어. 녹음했다면 끝내고 들어 봐.');}},1000);
}
let recordRequest=0;
async function startRecording(){
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){announce('마이크 녹음을 사용할 수 없는 환경이에요. 타이머로 말하기를 연습할 수 있어요.');return;}
 const request=++recordRequest,currentDay=day;
 const button=$('[data-action=record]');button.disabled=true;
 try{
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 if(request!==recordRequest||view!=='lesson'||step!==3||day!==currentDay){stream.getTracks().forEach(t=>t.stop());return;}
 mediaStream=stream;const capture=new MediaRecorder(stream);recorder=capture;const chunks=[];
 capture.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 capture.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(request!==recordRequest||view!=='lesson'||step!==3||day!==currentDay)return;
 if(audioUrl)URL.revokeObjectURL(audioUrl);audioUrl=URL.createObjectURL(new Blob(chunks,{type:capture.mimeType||'audio/webm'}));
 $('#record-result').innerHTML='<audio controls aria-label="내 녹음 다시 듣기"></audio>';$('#record-result audio').src=audioUrl;
 $('[data-action=record]').disabled=false;$('[data-action=stop-record]').disabled=true;};
 capture.start();$('[data-action=stop-record]').disabled=false;announce('녹음 중이에요.');
 }catch{if(request===recordRequest){stopRecording();button.disabled=false;announce('마이크를 열 수 없어요. 브라우저에서 마이크 권한을 확인해 주세요.');}}
}
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-action=read-selection]'))e.preventDefault();});
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.view){recordRequest++;changeView(d.view);return;}
 if(d.day!==undefined){recordRequest++;chooseDay(Number(d.day));return;}
 if(d.step!==undefined){recordRequest++;chooseStep(Number(d.step));return;}
 if(d.book!==undefined){readerBook=Number(d.book);readerChapter=0;stopVoice();render();return;}
 if(d.chapter!==undefined){readerChapter=Number(d.chapter);stopVoice();render();return;}
 if(d.speak!==undefined){speak(d.speak);return;}
 if(d.sayParagraph!==undefined){speak(paraText(activeSection().blocks[Number(d.sayParagraph)]));return;}
 if(d.save!==undefined){if(store.saved[d.save]){delete store.saved[d.save];delete store.known[d.save];}else store.saved[d.save]=true;persist();render();return;}
 if(d.known!==undefined){store.known[d.known]=!store.known[d.known];persist();render();return;}
 if(d.quiz!==undefined){quizState[day]=d.quiz;render();return;}
 switch(d.action){
 case 'resume':recordRequest++;chooseDay(suggested());break;
 case 'prev':recordRequest++;chooseDay(day-1);break;
 case 'next':recordRequest++;chooseDay(day+1);break;
 case 'done':recordRequest++;resetActivity();if(store.done[day])delete store.done[day];else store.done[day]=dateKey();persist();render();if(store.done[day])announce('오늘 학습 완료 ✓');break;
 case 'reader-prev':readerChapter--;stopVoice();render();$('#main-panel').scrollIntoView();break;
 case 'reader-next':readerChapter++;stopVoice();render();$('#main-panel').scrollIntoView();break;
 case 'read-selection':{const sel=window.getSelection();const p=$('#passage');const t=sel&&p?.contains(sel.anchorNode)&&p?.contains(sel.focusNode)?sel.toString().trim():'';if(t)speak(t);else announce('영어 문장을 드래그하거나 문단 옆 ▶를 눌러 들어 봐.');break;}
 case 'stop-voice':stopVoice();break;
 case 'print':window.print();break;
 case 'timer':toggleTimer();break;
 case 'record':startRecording();break;
 case 'stop-record':stopRecording();break;
 }
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='day-select'){recordRequest++;chooseDay(Number(el.value));}
 if(el.id==='start-date'&&/^\d{4}-\d{2}-\d{2}$/.test(el.value)){store.start=el.value;persist();$('#sidebar').innerHTML=sidebar();}
 if(el.id==='rate'){store.rate=Number(el.value);persist();}
 if(el.id==='size'){store.size=Number(el.value);persist();$('#passage')?.style.setProperty('--reading-size',store.size+'px');}
 if(el.id==='filter'){filter=el.value;render();}
});
document.addEventListener('input',e=>{
 if(e.target.id==='speaking-note'||e.target.id==='grammar-note'){store.notes[(e.target.id==='speaking-note'?'s':'g')+day]=e.target.value;persist();}
});
render();persist();
</script>
</body>
</html>
