<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUCK — 3D Work / Nanobanana Prompt Reference</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --white: #ffffff;
  --black: #000000;
  --off: #f5f5f5;
  --gray: #999;
  --light: #e0e0e0;
  --mid: #666;
  --text: #111;
  --nb: #111111;
  --nb-light: #f5f5f5;
}

body {
  background: var(--white);
  color: var(--text);
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ─── PAGE HEADER ─────────────────────── */
.page-header {
  border-bottom: 1px solid var(--light);
  padding: 0 28px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.page-logo {
  font-weight: 700;
  font-size: 17px;
  letter-spacing: .05em;
  color: var(--black);
}
.page-right {
  display: flex;
  align-items: center;
  gap: 16px;
}
.page-subtitle {
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gray);
}
.nb-badge {
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  background: var(--nb);
  color: #fff;
  padding: 3px 9px;
  font-weight: 500;
}

/* ─── GRID ────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--light);
}
@media (max-width: 900px) { .grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width: 560px) { .grid { grid-template-columns: 1fr; } }

/* ─── CARD ────────────────────────────── */
.card {
  position: relative;
  aspect-ratio: 16/9;
  overflow: hidden;
  background: var(--off);
  cursor: pointer;
}
.card-img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  transition: transform .55s cubic-bezier(.25,.46,.45,.94), filter .4s ease;
}
.card:hover .card-img { transform: scale(1.04); filter: brightness(.28); }

.card-ov {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 16px 18px;
  opacity: 0; transition: opacity .28s;
  pointer-events: none;
}
.card:hover .card-ov { opacity: 1; }
.ov-client {
  font-size: 9px; letter-spacing: .15em; text-transform: uppercase;
  color: rgba(255,255,255,.45); margin-bottom: 2px;
}
.ov-title {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 16px; font-style: italic;
  color: #fff; line-height: 1.2; margin-bottom: 10px;
}

/* JSON preview block on card hover */
.ov-json {
  background: rgba(0,0,0,.75);
  border: 1px solid rgba(255,255,255,.08);
  border-left: 2px solid rgba(255,255,255,.5);
  padding: 10px 12px;
  font-family: 'SF Mono','Fira Code','Courier New',monospace;
  font-size: 10.5px; line-height: 1.6;
  color: rgba(255,255,255,.55);
  max-height: 100px;
  overflow: hidden;
  margin-bottom: 10px;
  position: relative;
}
/* fade bottom of json preview */
.ov-json::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 28px;
  background: linear-gradient(transparent, rgba(0,0,0,.75));
  pointer-events: none;
}
.ov-json .k { color: #88d4ff; }
.ov-json .s { color: #a8f0a0; }
.ov-json .n { color: #ffc888; }
.ov-json .p { color: rgba(255,255,255,.25); }

.ov-cta {
  font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase;
  color: rgba(255,255,255,.55);
  display: flex; align-items: center; gap: 7px;
}
.ov-cta-dot {
  width: 5px; height: 5px;
  background: #1a73e8; border-radius: 50%;
  animation: pulse-dot 1.8s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes pulse-dot { 0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.3)} }

/* ─── MODAL BACKDROP ──────────────────── */
.modal-bg {
  position: fixed; inset: 0; z-index: 999;
  background: rgba(0,0,0,.6);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  opacity: 0; pointer-events: none;
  transition: opacity .22s;
  overflow: hidden;
}
.modal-bg.open { opacity: 1; pointer-events: all; }

/* ─── MODAL ───────────────────────────── */
.modal {
  width: min(1200px, 100%);
  height: calc(100vh - 48px);
  max-height: 92vh;
  background: var(--white);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateY(16px);
  transition: transform .28s cubic-bezier(.34,1.2,.64,1);
}
.modal-bg.open .modal { transform: translateY(0); }

/* modal top bar */
.m-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 28px;
  border-bottom: 1px solid var(--light);
  flex-shrink: 0;
  background: var(--white); z-index: 10;
}
.m-client {
  font-size: 9.5px; letter-spacing: .15em; text-transform: uppercase;
  color: var(--gray); margin-bottom: 3px;
}
.m-title {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 22px; font-style: italic; font-weight: 400; color: var(--black);
}
.m-bar-right {
  display: flex; align-items: center; gap: 12px;
}
.m-nb-tag {
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  background: var(--black); color: #fff;
  padding: 4px 10px;
}
.m-close {
  background: none; border: 1px solid var(--light); color: var(--gray);
  font-family: inherit; font-size: 11px; letter-spacing: .1em;
  text-transform: uppercase; padding: 7px 16px; cursor: pointer;
  transition: border-color .15s, color .15s;
}
.m-close:hover { border-color: var(--black); color: var(--black); }

/* ─── SPLIT LAYOUT ────────────────────── */
.m-split {
  display: flex;
  flex: 1;
  min-height: 0;
  border-top: 1px solid var(--light);
  overflow: hidden;
}
@media (max-width: 800px) { .m-split { flex-direction: column; } }

/* ─── LEFT: ORIGINAL — fixed, no scroll ─ */
.m-left {
  width: 50%;
  flex-shrink: 0;
  border-right: 1px solid var(--light);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
@media (max-width: 800px) { .m-left { width: 100%; border-right: none; border-bottom: 1px solid var(--light); flex-shrink: 0; } }

/* ─── RIGHT: VARIANTS — scrollable ───── */
.m-right {
  flex: 1;
  overflow-y: auto;
  min-width: 0;
}
.panel-label {
  font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--gray);
  padding: 10px 16px;
  border-bottom: 1px solid var(--light);
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.panel-label-dot {
  width: 6px; height: 6px;
  background: var(--black); border-radius: 50%;
  flex-shrink: 0;
}
.panel-label-dot.blue { background: var(--black); }

.m-left img {
  width: 100%; display: block;
  aspect-ratio: 16/9; object-fit: cover;
  flex-shrink: 0;
}
.orig-meta {
  padding: 16px;
  border-top: 1px solid var(--light);
  overflow-y: auto;
  flex: 1;
}
.orig-meta-title {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 15px; font-style: italic; color: var(--black);
  margin-bottom: 6px;
}
.orig-meta-desc {
  font-size: 11px; color: var(--mid); line-height: 1.65; margin-bottom: 10px;
}
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--gray); border: 1px solid var(--light); padding: 3px 9px;
}

/* ─── RIGHT: Nanobanana VARIANTS ────────────── */
.m-right { }

/* ─── VARIANT BLOCK ───────────────────── */
.variant {
  border-bottom: 1px solid var(--light);
}
.variant:last-child { border-bottom: none; }

/* video placeholder */
.v-video-placeholder {
  aspect-ratio: 16/9;
  background: #0d0d0d;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  position: relative;
  overflow: hidden;
}

/* scanlines */
.v-video-placeholder::before {
  content: '';
  position: absolute; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,.03) 3px, rgba(255,255,255,.03) 4px);
  pointer-events: none; z-index: 1;
}

/* subtle vignette */
.v-video-placeholder::after {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.5) 100%);
  pointer-events: none; z-index: 1;
}

.vph-inner {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  z-index: 2; position: relative;
}

.vph-play {
  width: 40px; height: 40px;
  border: 1px solid rgba(26,115,232,.5);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  animation: breathe 2.8s ease-in-out infinite;
}
@keyframes breathe { 0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.06)} }

.vph-txt {
  font-size: 9px; letter-spacing: .16em; text-transform: uppercase;
  color: rgba(255,255,255,.4); text-align: center; line-height: 2;
}
.vph-txt span { color: #1a73e8; display: block; }

/* variant meta */
.v-meta {
  padding: 16px 16px 18px;
}
.v-type {
  font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--gray); margin-bottom: 4px;
}
.v-name {
  font-family: 'EB Garamond', Georgia, serif;
  font-size: 16px; font-style: italic; color: var(--black);
  margin-bottom: 8px; line-height: 1.2;
}
.v-desc {
  font-size: 11px; color: var(--mid); line-height: 1.65; margin-bottom: 12px;
}

/* what changed */
.v-changes {
  display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px;
}
.v-change {
  font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
  padding: 3px 8px;
  background: var(--black); color: var(--white);
}

/* Nanobanana specific fields */
.nb-fields {
  margin-bottom: 12px;
}
.nb-row {
  display: flex; gap: 0;
  border: 1px solid var(--light);
  margin-bottom: 6px;
}
.nb-row-label {
  font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--gray);
  background: var(--off);
  padding: 7px 12px;
  border-right: 1px solid var(--light);
  white-space: nowrap;
  min-width: 90px;
  display: flex; align-items: center;
}
.nb-row-val {
  font-size: 10px; color: var(--text);
  padding: 7px 12px;
  line-height: 1.5;
  flex: 1;
}
.nb-row-val.mono {
  font-family: 'SF Mono','Fira Code','Courier New', monospace;
  font-size: 9.5px;
}

/* json block */
.v-json-label {
  font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--gray); margin-bottom: 7px;
}
.v-json {
  background: var(--black);
  padding: 14px 16px;
  font-family: 'SF Mono','Fira Code','Courier New',monospace;
  font-size: 10px; line-height: 1.7;
  color: rgba(255,255,255,.38);
  overflow-x: auto; white-space: pre;
  margin-bottom: 10px;
}
.v-json .k { color: #88d4ff; }
.v-json .s { color: #a8f0a0; }
.v-json .n { color: #ffc888; }
.v-json .p { color: #444; }
.v-json .vk { color: #4db6ff; }

/* copy btn */
.copy-btn {
  font-family: inherit;
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  background: var(--black); color: var(--white);
  border: none; padding: 7px 16px; cursor: pointer;
  transition: opacity .15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.copy-btn:hover { opacity: .65; }
.copy-btn.ok { background: #2a7a4a; }

/* footer */
footer {
  border-top: 1px solid var(--light);
  padding: 18px 28px;
  display: flex; align-items: center; justify-content: space-between;
}
footer p { font-size: 11px; color: var(--gray); }
footer a { color: var(--gray); text-decoration: none; }
footer a:hover { color: var(--black); }

::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--light); }
</style>
</head>
<body>

<header class="page-header">
  <span class="page-logo">BUCK</span>
  <div class="page-right">
    <span class="page-subtitle">3D Work — AI Prompt Reference</span>
    <span class="nb-badge">Nanobanana</span>
  </div>
</header>

<div class="grid" id="grid"></div>

<footer>
  <p>© 2026 BUCK. All Rights Reserved.</p>
  <p><a href="https://buck.co/work/tag/3d" target="_blank">buck.co/work/tag/3d</a> — Nanobanana Prompt Reference</p>
</footer>

<!-- MODAL -->
<div class="modal-bg" id="mbg">
  <div class="modal">
    <div class="m-bar">
      <div>
        <div class="m-client" id="mc"></div>
        <div class="m-title" id="mt"></div>
      </div>
      <div class="m-bar-right">
        <span class="m-nb-tag">Nanobanana</span>
        <button class="m-close" onclick="closeModal()">Close ✕</button>
      </div>
    </div>

    <div class="m-split">
      <!-- LEFT: original sticky -->
      <div class="m-left">
        <div class="panel-label"><span class="panel-label-dot"></span>Original — BUCK</div>
        <img id="mi" src="" alt="">
        <div class="orig-meta">
          <div class="orig-meta-title" id="m-orig-title"></div>
          <div class="orig-meta-desc" id="m-orig-desc"></div>
          <div class="tags" id="m-tags"></div>
        </div>
      </div>
      <!-- RIGHT: Nanobanana variants -->
      <div class="m-right">
        <div class="panel-label"><span class="panel-label-dot blue"></span>Nanobanana Generated Variants</div>
        <div id="variants"></div>
      </div>
    </div>
  </div>
</div>

<script>
// Nanobanana prompt structure:
// - prompt: natural language video description (what Nanobanana actually reads)
// - camera: camera motion / angle instruction
// - style: visual style / mood
// - duration: suggested clip length in seconds
// - fps: frame rate
// - aspect_ratio: video format
// - audio: ambient sound description (Nanobanana supports audio generation)
// - negative: what to avoid

const W = [
  {
    client: "Dunkin'", title: "MUNCHKINS® Holiday Campaign",
    desc: "All wrapped up and tied with a bow, just in time to let it snow.",
    img: "https://cdn.sanity.io/images/uk7b627p/production/2a7564067551d4434dfffd8d43b5dc478d115cee-1920x1080.jpg?w=800&q=85&auto=format",
    tags: ["Product Viz","Holiday","Food CG","Soft 3D"],
    variants: [
      {
        type: "Faithful Reproduction",
        name: "Hero donut hole floating in snowfall",
        desc: "Nanobanana recreation of BUCK's original: a single glazed MUNCHKIN gently rotating and floating against a soft bokeh winter backdrop, snowflakes drifting past, warm studio light catching the glaze.",
        changes: ["Same mood: warm/cozy","Camera: slow orbit","Duration: 6s loop","Audio: soft ambient holiday"],
        veo: {
          prompt: "A single perfectly glazed donut hole floats and slowly rotates in a soft warm studio environment. Delicate snowflakes drift gently past in the bokeh background. Warm amber light catches the sugar glaze creating beautiful subsurface scattering and crystalline highlights. A small red ribbon curls softly below the donut as it drifts upward. The overall feel is warm, cozy, and festive — like a high-end food commercial.",
          camera: "Slow 360-degree orbit around the floating donut at eye level. Camera moves at a meditative pace, no jerky cuts.",
          style: "High-end food commercial CG. Octane render quality. Soft warm ambient light, photorealistic glaze materials, shallow depth of field.",
          aspect_ratio: "16:9",
          duration_sec: 6,
          fps: 24,
          audio: "Soft ambient holiday music, gentle tinkling bells, quiet snowfall ambience",
          negative: "cartoon, flat 2D, harsh shadows, people, hands"
        }
      },
      {
        type: "Camera — Wide Establishing",
        name: "Full holiday tablescape reveal",
        desc: "Pulls back from the hero product to a full lifestyle scene: camera slowly cranes up to reveal an entire festive table — scattered MUNCHKINS, unwrapped ribbons, gift boxes, falling snow.",
        changes: ["Camera: crane up reveal","Scale: product → full scene","Added: environment props","Mood: lifestyle storytelling"],
        veo: {
          prompt: "A slow crane-up camera move begins tight on a single glazed donut hole on a festive table, then gradually reveals the full holiday scene: scattered Dunkin MUNCHKINS, ribbons, small gift boxes wrapped in red and gold, sugar dusting catching warm light. Real snowflakes drift inside a beautifully decorated holiday space. The scene feels aspirational and warm, like a premium holiday advertisement.",
          camera: "Slow crane up from macro on single donut to wide establishing shot of full table. Smooth, uncut, 8 seconds.",
          style: "Premium holiday commercial, photorealistic food styling, warm amber and cream tones, soft key light from upper left.",
          aspect_ratio: "16:9",
          duration_sec: 8,
          fps: 24,
          audio: "Warm holiday music swells as the scene is revealed, paper rustle, soft ambience",
          negative: "dark, flat, harsh shadows, studio equipment visible"
        }
      },
      {
        type: "Style — Dark Luxury",
        name: "Moody dark confectionery editorial",
        desc: "A complete tonal inversion. Black velvet background, dramatic single rim light. The same MUNCHKIN subject becomes a luxury confectionery product — closer to a high-end chocolate brand than fast food.",
        changes: ["Background: black velvet","Lighting: hard rim only","Mood: luxury dark editorial","Palette: deep/rich tones"],
        veo: {
          prompt: "A glazed donut hole sits on black velvet in total darkness. A single dramatic rim light from the right catches the sugar glaze, sending a narrow streak of warm gold across the subject. The camera slowly pushes in — an intimate, reverential approach. Sugar crystals catch the light like diamonds. The mood is luxurious, almost precious. This could be a Godiva commercial.",
          camera: "Ultra-slow push-in toward the donut on a perfectly stable camera. 0.2x speed creep only. No shaking.",
          style: "Luxury confectionery dark editorial. Chiaroscuro lighting. Single hard rim light. Deep black background.",
          aspect_ratio: "16:9",
          duration_sec: 7,
          fps: 24,
          audio: "Complete silence except for subtle ambient room tone",
          negative: "bright, colorful, cheerful, busy background, multiple donuts"
        }
      },
      {
        type: "Camera — Phantom Speed",
        name: "Slow-motion glaze pour sequence",
        desc: "Nanobanana physics simulation: warm glaze pours over a donut hole in extreme slow motion, individual sugar crystals catching studio light, a final pull-back reveals the fully glazed product.",
        changes: ["Speed: extreme slow-mo","Subject: glaze in motion","Physics: fluid simulation","Duration: 8s sequence"],
        veo: {
          prompt: "Extreme slow motion sequence: warm golden glaze pours in a thick arc from above, landing on a single donut hole. The glaze spreads in perfect fluid dynamics, each drip stretching in phantom-camera slow motion. Individual sugar crystals become visible as the coating sets. The camera slowly pulls back at the end to reveal the fully glazed, pristine donut in a warm studio. The whole sequence feels like a luxury food film.",
          camera: "Fixed macro close-up during pour, then slow pull-back reveal at the end. Phantom camera simulation — 0.05x real speed.",
          style: "Phantom high-speed food commercial. Extreme macro detail. Warm amber studio lighting. Photorealistic fluid glaze simulation.",
          aspect_ratio: "16:9",
          duration_sec: 8,
          fps: 120,
          audio: "Hyper-enhanced slow-motion audio: stretched gentle pour sound, crystalline tinkling",
          negative: "fast movement, multiple items, dark, harsh"
        }
      }
    ]
  },
  {
    client: "Oura", title: "Ring True to You",
    desc: "Celebrating what color makes possible with the Oura Ring 4 Ceramic.",
    img: "https://cdn.sanity.io/images/uk7b627p/production/e26a85bc832b9d89dbe8bfa9aa0c60d110655a8d-1440x900.png?w=800&q=85&auto=format",
    tags: ["Product","Ceramic","Luxury","Jewelry CG"],
    variants: [
      {
        type: "Faithful Reproduction",
        name: "Ceramic ring on dark marble — orbit",
        desc: "Nanobanana recreation of BUCK's original: multiple ceramic Oura Ring variants arranged on dark marble, soft studio rim lighting, camera orbiting slowly to reveal each color's material quality.",
        changes: ["Same: dark marble surface","Same: multi-ring arrangement","Camera: slow orbit","Audio: ambient silence"],
        veo: {
          prompt: "Multiple Oura Ring ceramic variants are arranged in a precise geometric formation on a polished dark marble surface. Soft studio rim lighting catches each ring differently, revealing the matte ceramic finish and subtle color variations. The camera slowly orbits the arrangement at a low angle, as if studying sculpture in a gallery. The surface reflects faint caustic patterns. No music — the silence emphasizes the premium material quality.",
          camera: "Low-angle slow orbit, 180 degrees over 8 seconds. Camera stays at ring level, slightly below.",
          style: "Luxury jewelry editorial. Three-point studio lighting with rim. Dark marble. Silence.",
          aspect_ratio: "16:9",
          duration_sec: 8,
          fps: 60,
          audio: "Minimal — only subtle ambient room tone. No music.",
          negative: "hands, people, bright background, busy"
        }
      },
      {
        type: "Camera — Macro Surface Study",
        name: "Ceramic matte surface — light sweep",
        desc: "Extreme macro on a single ring. A single light source slowly sweeps across the matte ceramic surface, revealing microscopic texture — a pure material study that communicates quality through touch sensation.",
        changes: ["Camera: extreme macro","Subject: surface texture only","Lighting: single sweep","Duration: 6s surface study"],
        veo: {
          prompt: "An extreme macro close-up of the Oura Ring ceramic surface. A single soft light source slowly sweeps from left to right across the matte ceramic finish, revealing fine surface texture and the precise geometry of the ring's edge. The camera is perfectly still. No logo, no context — only the material. The ring slowly rotates one degree per second as the light moves. This is a pure study of ceramic quality.",
          camera: "Absolutely static camera. Ultra macro. Only the ring rotates at 1°/second.",
          style: "Industrial material study. Single moving raking light. Extreme macro. No depth of field — entire surface in focus.",
          aspect_ratio: "16:9",
          duration_sec: 6,
          fps: 60,
          audio: "Complete silence",
          negative: "full product in frame, lifestyle, people, multiple rings"
        }
      },
      {
        type: "Style — Wrist Lifestyle",
        name: "Ring worn — natural window light",
        desc: "Shifts from pure product to lifestyle wear. A wrist wearing the ring in soft natural window light — camera slowly pushes in toward the ring as morning light shifts across the ceramic surface.",
        changes: ["Context: product → worn","Added: human wrist","Lighting: natural window","Mood: intimate/personal"],
        veo: {

function hl(obj) {
  return JSON.stringify(obj, null, 2)
    .replace(/("[\w_]+")\s*:/g, '<span class="k">$1</span>:')
    .replace(/:\s*(".*?")/g, ': <span class="s">$1</span>')
    .replace(/:\s*(\d+\.?\d*)/g, ': <span class="n">$1</span>')
    .replace(/[{}\[\],]/g, m => `<span class="p">${m}</span>`);
}

W.forEach((w, i) => {
  // Build a short JSON preview from the first variant's Nanobanana prompt fields
  const v0 = w.variants[0].veo;
  const preview = {
    model: "Nanobanana",
    prompt: v0.prompt.slice(0, 90) + '…',
    camera: v0.camera.split('.')[0],
    duration: `${v0.duration_sec}s · ${v0.fps}fps · ${v0.aspect_ratio}`
  };

  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `
    <img class="card-img" src="${w.img}" alt="${w.title}" loading="lazy">
    <div class="card-ov">
      <div class="ov-client">${w.client}</div>
      <div class="ov-title">${w.title}</div>
      <div class="ov-json">${hl(preview)}</div>
      <div class="ov-cta">
        <span class="ov-cta-dot"></span>
        ${w.variants.length} Nanobanana variants — click to expand
      </div>
    </div>`;
  c.addEventListener('click', () => openModal(i));
  grid.appendChild(c);
});

let _wi = null;

      <div class="v-video-placeholder">

function closeModal() {
  document.getElementById('mbg').classList.remove('open');
  document.body.style.overflow = '';
}

function copyV(wi, vi) {
  const json = W[wi].variants[vi].veo;
  navigator.clipboard.writeText(JSON.stringify(json, null, 2)).then(() => {
    const btn = document.getElementById(`cbtn-${wi}-${vi}`);
    btn.textContent = '✓ Copied';
    btn.className = 'copy-btn ok';
    setTimeout(() => {
      btn.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy JSON`;
      btn.className = 'copy-btn';
    }, 2000);
  });
}

document.getElementById('mbg').addEventListener('click', e => {
  if (e.target === document.getElementById('mbg')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
