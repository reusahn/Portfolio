<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 535" role="img" aria-labelledby="title description"><title id="title">Escape Metro: implementation map</title><desc id="description">Player dialogue: A question or persuasive attempt → GPT NPC: A response within the character’s constraints → Puzzle state: Clue or password linked to progression → World feedback: The next step in the escape game. Editorial reconstruction, not an Editor capture.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a554a"/></marker></defs><rect width="1200" height="535" fill="#e9ede6"/><g font-family="Arial,Helvetica,sans-serif"><text x="55" y="47" fill="#1a554a" font-size="16" letter-spacing="2">INPUT → PROCESS → RESPONSE → ENCOUNTER</text><g><rect x="55" y="90" width="470" height="145" rx="4" fill="#fdfcf8" stroke="#b9c7bf"/><text x="80" y="117" fill="#1a554a" font-size="14" font-family="monospace">01</text><text x="80" y="155" fill="#182c2b" font-size="25" font-weight="600">Player dialogue</text><text x="80" y="188" fill="#596661" font-size="20"><tspan x="80" dy="0">A question or persuasive attempt</tspan></text></g><g><rect x="675" y="90" width="470" height="145" rx="4" fill="#fdfcf8" stroke="#b9c7bf"/><text x="700" y="117" fill="#1a554a" font-size="14" font-family="monospace">02</text><text x="700" y="155" fill="#182c2b" font-size="25" font-weight="600">GPT NPC</text><text x="700" y="188" fill="#596661" font-size="20"><tspan x="700" dy="0">A response within the character’s</tspan><tspan x="700" dy="27">constraints</tspan></text></g><g><rect x="675" y="315" width="470" height="145" rx="4" fill="#fdfcf8" stroke="#b9c7bf"/><text x="700" y="342" fill="#1a554a" font-size="14" font-family="monospace">03</text><text x="700" y="380" fill="#182c2b" font-size="25" font-weight="600">Puzzle state</text><text x="700" y="413" fill="#596661" font-size="20"><tspan x="700" dy=