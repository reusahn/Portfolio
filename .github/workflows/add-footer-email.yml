name: Add footer email

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Add visible email before Email link
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')

          if '.footer-email{' not in s:
              css_anchor = '.footer-links{display:flex;gap:18px;font-size:12px}'
              css_new = '.footer-links{display:flex;gap:18px;font-size:12px;align-items:center;flex-wrap:wrap}.footer-email{font-size:12px;color:var(--muted);letter-spacing:.005em}'
              if css_anchor not in s:
                  raise SystemExit('Footer CSS anchor not found')
              s = s.replace(css_anchor, css_new, 1)

          if 'class="footer-email"' not in s:
              pattern = r'(<div class="footer-links">)(.*?)(<a href="mailto:[^"]+"[^>]*>Email</a>)'
              m = re.search(pattern, s, flags=re.S)
              if not m:
                  raise SystemExit('Footer mailto link not found')
              prefix, before, link = m.groups()
              link = re.sub(r'mailto:[^"]+', 'mailto:hoonahncloud@gmail.com', link, count=1)
              replacement = prefix + before + '<span class="footer-email">hoonahncloud@gmail.com</span>' + link
              s = s[:m.start()] + replacement + s[m.end():]
          else:
              s = re.sub(r'<span class="footer-email">.*?</span>', '<span class="footer-email">hoonahncloud@gmail.com</span>', s, count=1, flags=re.S)
              s = re.sub(r'mailto:[^"]+', 'mailto:hoonahncloud@gmail.com', s, count=1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show email address in footer"
          git push origin gh-pages
