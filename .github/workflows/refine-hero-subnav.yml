name: Refine hero and subnav

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Move recognition row and simplify subnav
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')

          # Remove the rule under the media-category subnav.
          s = s.replace('.subnav{border-bottom:1px solid var(--line);background:#fff}', '.subnav{border-bottom:0;background:#fff}', 1)

          # Remove only the 3D / VFX item from the top category navigation.
          s = s.replace('<a href="#vfx">3D / VFX</a>', '', 1)

          # Recognition row should sit above the intro copy, right-aligned to the intro column.
          m = re.search(r'<div class="recognition-strip" aria-label="Selected recognition">.*?</div></div>', s)
          if not m:
              raise SystemExit('recognition strip not found')
          block = m.group(0)

          # The regex above closes the last recognition-item plus recognition-strip.
          # Remove it from the hero-actions row first.
          s = s[:m.start()] + s[m.end():]

          # Insert the recognition row immediately before the lead biography in the right column.
          anchor = '<div><p class="bio-lead"'
          if anchor not in s:
              raise SystemExit('bio-lead anchor not found')
          intro_block = '<div class="intro-recognition">' + block + '</div><p class="bio-lead"'
          s = s.replace(anchor, intro_block, 1)

          # Simplify hero-actions now that the recognition row moved away.
          s = s.replace('.hero-actions{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:30px;flex-wrap:nowrap}', '.hero-actions{display:flex;align-items:center;gap:24px;margin-top:30px}', 1)
          s = s.replace('.hero-actions .recognition-strip{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:11px;margin:0 0 0 auto;max-width:none;flex:0 1 auto}', '.hero-actions .recognition-strip{display:none}', 1)

          # Style the relocated recognition row as a compact line aligned to the right edge of the intro copy.
          css = '''\n/* Recognition above introduction */\n.intro-recognition{display:flex;justify-content:flex-end;margin:0 0 26px}.intro-recognition .recognition-strip{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:18px;margin:0;max-width:none}.intro-recognition .recognition-item{gap:7px;min-height:24px;font-size:10.8px;line-height:1.25;white-space:nowrap}.intro-recognition .recognition-copy strong{font-size:10.8px}.intro-recognition .recognition-mark{flex:0 0 22px;width:22px;height:22px}@media(max-width:1050px){.intro-recognition{justify-content:flex-start}.intro-recognition .recognition-strip{justify-content:flex-start;flex-wrap:wrap}}@media(max-width:680px){.intro-recognition{margin-bottom:22px}.intro-recognition .recognition-strip{gap:10px 14px}.intro-recognition .recognition-item{font-size:9.8px}.intro-recognition .recognition-copy strong{font-size:9.8px}}\n'''
          if '/* Recognition above introduction */' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move recognition above intro and simplify media navigation"
          git push origin gh-pages
