name: Apply K-Art recognition highlight

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/kart-highlight.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Highlight K-Art recognition
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_css = '''/* K-Art recognition */
          .kart-mark{border:0;background:#1f5f91;color:#fff;font-family:Arial,sans-serif;font-size:9px;font-weight:800;letter-spacing:-.02em}
          .intro-recognition .kart-item{flex-basis:100%;justify-content:flex-start}
          @media(max-width:680px){.intro-recognition .kart-item{flex-basis:100%}}'''

          new_css = '''/* K-Art recognition */
          .intro-recognition .kart-item{flex-basis:100%;justify-content:flex-end;gap:10px;margin-top:3px;padding-top:11px;border-top:1px solid var(--line);font-size:12.8px;line-height:1.3;color:#333}
          .intro-recognition .kart-item .kart-mark{flex:0 0 auto;width:auto;min-width:48px;height:28px;padding:0 8px;border:0;border-radius:2px;background:#1f5f91;color:#fff;font-family:Arial,sans-serif;font-size:10px;font-weight:800;letter-spacing:.02em}
          .intro-recognition .kart-item .recognition-copy{color:#333;font-weight:520}
          .intro-recognition .kart-item .recognition-copy strong{font-size:12.8px;font-weight:720;color:#111}
          @media(max-width:1050px){.intro-recognition .kart-item{justify-content:flex-start}}
          @media(max-width:680px){.intro-recognition .kart-item{flex-basis:100%;justify-content:flex-start;margin-top:2px;padding-top:10px;font-size:11.2px}.intro-recognition .kart-item .kart-mark{min-width:44px;height:26px;font-size:9px}.intro-recognition .kart-item .recognition-copy strong{font-size:11.2px}}'''

          old_html = '''<div class="recognition-item kart-item"><span class="recognition-mark kart-mark" aria-hidden="true">K</span><span class="recognition-copy" title="K-Art Young Artist Creation Support · Selected Artist ’26" data-en="K-Art Young Artist Creation Support ’26 · Selected Artist" data-ko="K-ART 청년 창작자 지원사업 선정자 ’26"><strong>K-Art ’26</strong> · Selected Artist</span></div>'''

          new_html = '''<div class="recognition-item kart-item"><span class="recognition-mark kart-mark" aria-hidden="true">K·ART</span><span class="recognition-copy" title="K-ART Young Creators Support Program · Selected Artist ’26" data-en="K-ART Young Creators Support Program ’26 · Selected Artist" data-ko="K-ART 청년 창작자 지원사업 선정자 ’26"><strong>K-ART ’26</strong> · Selected Artist</span></div>'''

          if old_css not in text:
              raise SystemExit('Expected K-Art CSS block not found')
          if old_html not in text:
              raise SystemExit('Expected K-Art recognition item not found')

          text = text.replace(old_css, new_css, 1).replace(old_html, new_html, 1)
          path.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/kart-highlight.yml')
          if workflow.exists():
              workflow.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/kart-highlight.yml
          git commit -m "Highlight K-Art selected artist recognition"
          git push origin gh-pages
