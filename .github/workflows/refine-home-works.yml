name: Refine homepage works

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Refine recognition type and media grouping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8-sig')
          old='.hero-actions .recognition-item{gap:6px;min-height:22px;font-size:8.8px;line-height:1.2;white-space:nowrap}.hero-actions .recognition-copy{color:#666}.hero-actions .recognition-copy strong{font-size:8.8px}'
          new='.hero-actions .recognition-item{gap:7px;min-height:22px;font-size:10.2px;line-height:1.25;white-space:nowrap}.hero-actions .recognition-copy{color:#5f5f5f}.hero-actions .recognition-copy strong{font-size:10.2px}'
          if old in s:
              s=s.replace(old,new,1)
          old2='.collection{margin-top:58px}.collection:first-of-type{margin-top:0}.collection-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-top:1px solid var(--ink);padding:13px 0 18px}.collection-head h3{font-size:24px;line-height:1.2;letter-spacing:-.025em;font-weight:620;margin:0}.collection-head span{font-size:12px;color:var(--muted)}'
          new2='.collection{margin-top:76px;padding-bottom:10px}.collection:first-of-type{margin-top:0}.collection-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);background:#f7f8f9;padding:15px 18px 16px}.collection-head h3{display:flex;align-items:baseline;gap:12px;font-size:25px;line-height:1.2;letter-spacing:-.025em;font-weight:620;margin:0}.collection-head h3::before{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--blue)}.collection#interactive .collection-head h3::before{content:"01"}.collection#film .collection-head h3::before{content:"02"}.collection#media-art .collection-head h3::before{content:"03"}.collection#xr .collection-head h3::before{content:"04"}.collection#vfx .collection-head h3::before{content:"05"}.collection-head span{font-size:12px;color:var(--muted)}'
          if old2 in s:
              s=s.replace(old2,new2,1)
          s=s.replace('@media(max-width:680px){.hero-actions{margin-top:26px;gap:16px}.hero-actions .recognition-strip{gap:9px;flex-wrap:wrap}.hero-actions .recognition-item{font-size:8.5px}}','@media(max-width:680px){.hero-actions{margin-top:26px;gap:16px}.hero-actions .recognition-strip{gap:9px;flex-wrap:wrap}.hero-actions .recognition-item{font-size:9.4px}.collection{margin-top:58px}.collection-head{padding:13px 14px 14px}.collection-head h3{font-size:22px}}',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine recognition labels and media grouping"
          git push origin gh-pages
