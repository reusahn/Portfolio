name: Apply portfolio polish

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Complete bilingual detail pages
        run: |
          python - <<'PY'
          from pathlib import Path

          js=Path('assets/js/detail-i18n.js')
          s=js.read_text(encoding='utf-8-sig')
          old="const page = PAGE[file] || {};"
          new="const page = {...(PAGE[file] || {}), ...((window.DETAIL_I18N_EXTRA && window.DETAIL_I18N_EXTRA[file]) || {})};"
          if old in s:
              s=s.replace(old,new,1)
          js.write_text(s,encoding='utf-8')

          base='<script src="../assets/js/detail-i18n.js"></script>'
          pair='<script src="../assets/js/detail-i18n-extra.js"></script>\n  <script src="../assets/js/detail-i18n.js"></script>'
          changed=[]
          for path in sorted(Path('detail_pages').glob('*.html')):
              if path.name == 'flower-of-waves.html':
                  continue
              text=path.read_text(encoding='utf-8-sig',errors='replace')
              oldtext=text
              if 'detail-i18n-extra.js' not in text and base in text:
                  text=text.replace(base,pair,1)
              if text!=oldtext:
                  path.write_text(text,encoding='utf-8')
                  changed.append(str(path))
          print('Added supplemental translations to',len(changed),'detail pages')
          PY
      - name: Validate JavaScript
        run: |
          node --check assets/js/detail-i18n.js
          node --check assets/js/detail-i18n-extra.js
          python - <<'PY'
          from pathlib import Path
          pages=[p for p in Path('detail_pages').glob('*.html') if p.name!='flower-of-waves.html']
          missing=[str(p) for p in pages if 'detail-i18n.js' not in p.read_text(encoding='utf-8-sig',errors='replace')]
          if missing:
              raise SystemExit('Missing bilingual script: '+', '.join(missing))
          print('Validated bilingual script on',len(pages),'legacy detail pages')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/detail-i18n.js detail_pages
          git commit -m "Complete bilingual detail page system"
          git push origin gh-pages
