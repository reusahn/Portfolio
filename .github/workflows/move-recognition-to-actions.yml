name: Move recognition to hero actions

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Move recognition marks beside Works Research CV
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')

          # Find and remove recognition strip from under the name.
          pat = re.compile(r'(<section class="artist"><div class="shell artist-grid"><div><h1>Jonghoon Ahn<small>안종훈</small></h1>)(<div class="recognition-strip".*?</div></div>)(<div><p class="bio-lead")', re.S)
          m = pat.search(s)
          if not m:
              raise SystemExit('Recognition block under name not found')

          recog_plus_outer_close = m.group(2)
          # Strip only the outer left-column closing div from the captured tail.
          recog = recog_plus_outer_close[:-6] if recog_plus_outer_close.endswith('</div>') else recog_plus_outer_close
          # The previous slice removes one closing </div>; ensure recognition itself still closes.
          if not recog.endswith('</div>'):
              recog += '</div>'

          # Compact labels for a single horizontal action row while keeping full names in title attributes.
          recog = recog.replace('data-en="Academy Nicholl Fellowships · Entrant ’25" data-ko="아카데미 니콜 펠로우십 · Entrant ’25"', 'title="Academy Nicholl Fellowships · Entrant ’25" data-en="Nicholl ’25 · Entrant" data-ko="니콜 ’25 · Entrant"')
          recog = recog.replace('<strong>Academy Nicholl Fellowships</strong> · Entrant ’25', '<strong>Nicholl ’25</strong> · Entrant')
          recog = recog.replace('data-en="Sundance Ignite × Adobe Fellowship · Finalist ’24" data-ko="선댄스 이그나이트 × Adobe 펠로우십 · 파이널리스트 ’24"', 'title="Sundance Ignite × Adobe Fellowship · Finalist ’24" data-en="Sundance Ignite ’24 · Finalist" data-ko="선댄스 이그나이트 ’24 · 파이널리스트"')
          recog = recog.replace('<strong>Sundance Ignite × Adobe Fellowship</strong> · Finalist ’24', '<strong>Sundance Ignite ’24</strong> · Finalist')
          recog = recog.replace('data-en="CJ & TIFF K-Story Fund · Shortlist ’25" data-ko="CJ & TIFF K-Story Fund · 쇼트리스트 ’25"', 'title="CJ & TIFF K-Story Fund · Shortlist ’25" data-en="TIFF K-Story ’25 · Shortlist" data-ko="TIFF K-Story ’25 · 쇼트리스트"')
          recog = recog.replace('<strong>CJ & TIFF K-Story Fund</strong> · Shortlist ’25', '<strong>TIFF K-Story ’25</strong> · Shortlist')

          s = pat.sub(lambda mm: mm.group(1) + '</div>' + mm.group(3), s, count=1)

          quick = '<div class="quick"><a href="#works" data-en="Works" data-ko="작품">Works</a><a href="#research" data-en="Research" data-ko="연구">Research</a><a href="#cv" data-en="CV" data-ko="이력">CV</a></div>'
          if quick not in s:
              raise SystemExit('Hero quick links not found')
          s = s.replace(quick, '<div class="hero-actions">' + quick + recog + '</div>', 1)

          css = '''\n/* Hero action row: navigation left, recognition right */\n.hero-actions{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:30px;flex-wrap:nowrap}.hero-actions .quick{margin-top:0;flex:0 0 auto}.hero-actions .recognition-strip{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:11px;margin:0 0 0 auto;max-width:none;flex:0 1 auto}.hero-actions .recognition-item{gap:6px;min-height:22px;font-size:8.8px;line-height:1.2;white-space:nowrap}.hero-actions .recognition-copy{color:#666}.hero-actions .recognition-copy strong{font-size:8.8px}.hero-actions .recognition-mark{flex:0 0 22px;width:22px;height:22px}@media(max-width:1180px){.hero-actions{align-items:flex-start;flex-wrap:wrap}.hero-actions .recognition-strip{width:100%;justify-content:flex-start;margin-left:0}}@media(max-width:680px){.hero-actions{margin-top:26px;gap:16px}.hero-actions .recognition-strip{gap:9px;flex-wrap:wrap}.hero-actions .recognition-item{font-size:8.5px}}\n'''
          if '/* Hero action row: navigation left, recognition right */' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Move recognition beside hero navigation"
          git push origin gh-pages
