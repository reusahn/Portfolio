name: Remove VFX section

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Remove 3D VFX section and legacy VFX detail pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')

          # Remove the complete 3D / VFX collection from the live homepage.
          pattern = re.compile(r'\n?<div class="collection" id="vfx">.*?</a></div></div>\s*(?=</div></section>)', re.S)
          s2, n = pattern.subn('\n', s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one live VFX collection, removed {n}')
          p.write_text(s2, encoding='utf-8')

          # Remove the VFX related-work card from the standalone Shininho page if present.
          sp = Path('Sininho.html')
          if sp.exists():
              t = sp.read_text(encoding='utf-8-sig')
              t2 = re.sub(r'\s*<a href="vfx_1\.html" class="related-card">.*?</a>', '', t, count=1, flags=re.S)
              if t2 != t:
                  sp.write_text(t2, encoding='utf-8')
          PY

          rm -f detail_pages/vfx_1.html detail_pages/vfx_2.html detail_pages/vfx_3.html detail_pages/vfx_4.html detail_pages/vfx_5.html detail_pages/vfx_6.html detail_pages/vfx_7.html detail_pages/vfx_8.html detail_pages/vfx_9.html detail_pages/vfx_10.html

          if grep -q 'id="vfx"' index.html; then
            echo "VFX collection still present in index.html" >&2
            exit 1
          fi
          if grep -q 'detail_pages/vfx_1.html' index.html; then
            echo "VFX work link still present in index.html" >&2
            exit 1
          fi

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Sininho.html detail_pages
          git commit -m "Remove 3D VFX category and detail works"
          git push origin gh-pages
