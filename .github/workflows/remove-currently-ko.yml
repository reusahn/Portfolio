name: Remove Korean currently wording
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/remove-currently-ko.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update Korean bio wording through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'portfolio-ko-wording-update'}
          url=f'https://api.github.com/repos/{repo}/contents/index.html?ref=gh-pages'
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r:
              meta=json.load(r)
          s=base64.b64decode(meta['content']).decode('utf-8-sig')
          old='테크니컬 디렉터로 현재도 협업하고 있다.'
          new='테크니컬 디렉터로 협업하고 있다.'
          count=s.count(old)
          if count < 1:
              raise SystemExit('Target Korean wording not found')
          s=s.replace(old,new)
          payload=json.dumps({'message':'Remove redundant current wording in Korean bio','content':base64.b64encode(s.encode()).decode(),'sha':meta['sha'],'branch':'gh-pages'}).encode()
          put=urllib.request.Request(f'https://api.github.com/repos/{repo}/contents/index.html',data=payload,headers=headers,method='PUT')
          with urllib.request.urlopen(put) as r:
              json.load(r)
          PY
