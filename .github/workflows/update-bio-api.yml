name: Apply portfolio bio wording
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/update-bio-api.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update index through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request

          token=os.environ['GH_TOKEN']
          repo=os.environ['REPO']
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'portfolio-bio-update'
          }
          url=f'https://api.github.com/repos/{repo}/contents/index.html?ref=gh-pages'
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req) as r:
              meta=json.load(r)
          s=base64.b64decode(meta['content']).decode('utf-8-sig')

          old_en='He has worked as a technical artist on a game project with Academy Award-nominated animator Erick Oh, and as technical director on digital-human projects by media artist Yaloo, whose work has been featured in Hyperallergic.'
          new_en='He worked as a technical artist on a game project with Academy Award-nominated animator Erick Oh and currently works as a technical director on digital-human projects with media artist Yaloo, whose work has been featured in Hyperallergic.'
          old_ko='아카데미상 후보에 오른 애니메이터 에릭 오와의 게임 프로젝트에서 테크니컬 아티스트로 참여했고, Hyperallergic에 소개된 미디어 아티스트 Yaloo의 디지털 휴먼 프로젝트에서는 테크니컬 디렉터로 활동했다.'
          new_ko='아카데미상 후보에 오른 애니메이터 에릭 오와의 게임 프로젝트에서 테크니컬 아티스트로 참여했고, Hyperallergic에 소개된 미디어 아티스트 Yaloo와는 디지털 휴먼 프로젝트의 테크니컬 디렉터로 현재도 협업하고 있다.'

          if old_en not in s:
              raise SystemExit('English sentence not found')
          if old_ko not in s:
              raise SystemExit('Korean sentence not found')
          s=s.replace(old_en,new_en)
          s=s.replace(old_ko,new_ko)

          payload=json.dumps({
              'message':'Clarify completed Erick Oh and ongoing Yaloo work',
              'content':base64.b64encode(s.encode()).decode(),
              'sha':meta['sha'],
              'branch':'gh-pages'
          }).encode()
          put=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/index.html',
              data=payload,headers=headers,method='PUT')
          with urllib.request.urlopen(put) as r:
              json.load(r)
          PY
