name: Fix K-Art layout
on:
  push:
    branches:
      - gh-pages
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Patch K-Art recognition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import re
          import urllib.request

          repo = 'reusahn/Portfolio'
          branch = 'gh-pages'
          token = __import__('os').environ['GH_TOKEN']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'kart-layout-fix'
          }

          def call(method, path, payload=None):
              url = f'https://api.github.com/repos/{repo}/{path}'
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          meta = call('GET', f'contents/index.html?ref={branch}')
          html = base64.b64decode(meta['content']).decode('utf-8-sig')

          old_strip = '.intro-recognition .recognition-strip{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:18px;margin:0;max-width:none}'
          new_strip = '.intro-recognition .recognition-strip{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:18px;margin:0;max-width:none;flex-wrap:wrap}'
          if old_strip in html:
              html = html.replace(old_strip, new_strip, 1)

          new_css = '''/* K-Art recognition */
.intro-recognition .kart-item{flex-basis:100%;justify-content:flex-start}
.kart-mark{border:1px solid #d5d5d5;background:#fff;color:#1f5f91;font-family:Arial,sans-serif;font-size:9px;font-weight:800;letter-spacing:-.02em}
@media(max-width:680px){.intro-recognition .kart-item{flex-basis:100%;justify-content:flex-start}}'''
          html, n = re.subn(r'/\* K-Art recognition \*/.*?(?=</style>)', new_css + '\n', html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('K-Art CSS block not found')

          new_item = '''<div class="recognition-item kart-item"><span class="recognition-mark kart-mark" aria-hidden="true">K</span><span class="recognition-copy" title="K-ART · Selected Artist ’26" data-en="K-ART ’26 · Selected Artist" data-ko="K-ART 청년 창작자 지원사업 선정자 ’26"><strong>K-ART ’26</strong> · Selected Artist</span></div>'''
          html, n = re.subn(r'<div class="recognition-item kart-item">.*?</div>', new_item, html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('K-Art recognition item not found')

          call('PUT', 'contents/index.html', {
              'message': 'Place K-Art below hero recognitions',
              'content': base64.b64encode(html.encode('utf-8')).decode('ascii'),
              'sha': meta['sha'],
              'branch': branch
          })
          PY