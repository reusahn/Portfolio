name: Fix K-Art recognition
on:
  push:
    branches: [gh-pages]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1
          sparse-checkout: |
            index.html
          sparse-checkout-cone-mode: false
      - name: Fix K-Art recognition layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8-sig')
          old='.intro-recognition .recognition-strip{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:18px;margin:0;max-width:none}'
          new='.intro-recognition .recognition-strip{display:flex;flex-direction:row;align-items:center;justify-content:flex-end;gap:18px;margin:0;max-width:none;flex-wrap:wrap}'
          if old in s:
              s=s.replace(old,new,1)
          css='''/* K-Art recognition */
.intro-recognition .kart-item{flex-basis:100%;justify-content:flex-start}
.kart-mark{border:1px solid #d5d5d5;background:#fff;color:#1f5f91;font-family:Arial,sans-serif;font-size:9px;font-weight:800;letter-spacing:-.02em}
@media(max-width:680px){.intro-recognition .kart-item{flex-basis:100%;justify-content:flex-start}}'''
          s,n=re.subn(r'/\* K-Art recognition \*/.*?(?=</style>)',css+'\n',s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('K-Art CSS not found')
          item='''<div class="recognition-item kart-item"><span class="recognition-mark kart-mark" aria-hidden="true">K</span><span class="recognition-copy" title="K-ART · Selected Artist ’26" data-en="K-ART ’26 · Selected Artist" data-ko="K-ART 청년 창작자 지원사업 선정자 ’26"><strong>K-ART ’26</strong> · Selected Artist</span></div>'''
          s,n=re.subn(r'<div class="recognition-item kart-item">.*?</div>',item,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('K-Art item not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Place K-Art below hero recognitions"
          git push origin gh-pages