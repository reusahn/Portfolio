name: Restore News section

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Restore curated News links
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')
          if 'href="#news"' not in s:
              s = s.replace('<a href="#cv">CV</a>', '<a href="#cv">CV</a><a href="#news" data-en="News" data-ko="뉴스">News</a>', 1)
          css = '\n/* News / press archive */\n.news-list{border-top:1px solid var(--line)}\n.news-row{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(0,2.2fr) auto;gap:28px;align-items:center;padding:19px 0;border-bottom:1px solid var(--line)}\n.news-source{font-size:12px;color:#6c6c6c;letter-spacing:.01em}\n.news-title{font-size:15px;line-height:1.5;color:#111}\n.news-link{font-size:12px;color:var(--blue);white-space:nowrap;text-decoration:none}\n.news-link:hover{text-decoration:underline}\n@media(max-width:760px){.news-row{grid-template-columns:1fr;gap:5px;padding:17px 0}.news-source{font-size:11px}.news-title{font-size:14px}.news-link{margin-top:3px}}\n'
          if '/* News / press archive */' not in s:
              s = s.replace('</style>', css + '</style>', 1)
          news_b64 = ''
          news = base64.b64decode(news_b64).decode('utf-8')
          if 'id="news"' not in s:
              if '</main>' not in s:
                  raise SystemExit('main closing tag not found')
              s = s.replace('</main>', news + '</main>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore News section and add Gwanak Culture Foundation article"
          git push origin gh-pages
