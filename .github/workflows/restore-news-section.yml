name: Restore News section

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Restore curated News links
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')

          # Add News to the compact hero navigation after CV.
          if 'href="#news"' not in s:
              s = s.replace('<a href="#cv">CV</a>', '<a href="#cv">CV</a><a href="#news" data-en="News" data-ko="뉴스">News</a>', 1)

          css = '''
/* News / press archive */
.news-list{border-top:1px solid var(--line)}
.news-row{display:grid;grid-template-columns:minmax(180px,.8fr) minmax(0,2.2fr) auto;gap:28px;align-items:center;padding:19px 0;border-bottom:1px solid var(--line)}
.news-source{font-size:12px;color:#6c6c6c;letter-spacing:.01em}
.news-title{font-size:15px;line-height:1.5;color:#111}
.news-link{font-size:12px;color:var(--blue);white-space:nowrap;text-decoration:none}
.news-link:hover{text-decoration:underline}
@media(max-width:760px){.news-row{grid-template-columns:1fr;gap:5px;padding:17px 0}.news-source{font-size:11px}.news-title{font-size:14px}.news-link{margin-top:3px}}
'''
          if '/* News / press archive */' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          news = '''
<section class="section" id="news"><div class="shell">
  <div class="section-head"><div class="label" data-en="News / Press" data-ko="뉴스 / 기사">News / Press</div><h2 data-en="News" data-ko="뉴스">News</h2></div>
  <div class="news-list">
    <div class="news-row"><div class="news-source">Seoul Culture Today · 2026</div><div class="news-title" data-en="Gwanak Cultural Foundation · Young Artist's Creation Notes" data-ko="관악문화재단 《젊은 예술가의 창작노트》">Gwanak Cultural Foundation · Young Artist's Creation Notes</div><a class="news-link" href="https://www.sctoday.co.kr/news/articleView.html?idxno=48043" target="_blank" rel="noopener" data-en="Open article ↗" data-ko="기사 보기 ↗">Open article ↗</a></div>
    <div class="news-row"><div class="news-source">Yonhap News · 2025</div><div class="news-title" data-en="Media Wall of Shinsegae Department Store" data-ko="신세계백화점 미디어월 관련 기사">Media Wall of Shinsegae Department Store</div><a class="news-link" href="https://www.yna.co.kr/view/AKR20250929031900005" target="_blank" rel="noopener" data-en="Open article ↗" data-ko="기사 보기 ↗">Open article ↗</a></div>
    <div class="news-row"><div class="news-source">CalArts</div><div class="news-title" data-en="UNBOUND · AI Symposium Speaker" data-ko="UNBOUND · AI 예술 비평 연구 심포지엄 연사">UNBOUND · AI Symposium Speaker</div><a class="news-link" href="https://calarts.edu/unbound/speakers" target="_blank" rel="noopener" data-en="Open ↗" data-ko="보기 ↗">Open ↗</a></div>
    <div class="news-row"><div class="news-source">CalArts Project Archive</div><div class="news-title" data-en="Generated Cinema · Project Archive" data-ko="Generated Cinema · 프로젝트 아카이브">Generated Cinema · Project Archive</div><a class="news-link" href="https://projectarchive.art.calarts.edu/project/generated-cinema/" target="_blank" rel="noopener" data-en="Open ↗" data-ko="보기 ↗">Open ↗</a></div>
    <div class="news-row"><div class="news-source">Independent Shorts Awards · 2024</div><div class="news-title">Non-Done Record</div><a class="news-link" href="https://independentshortsawards.com/2024/01/15/non-done-record/" target="_blank" rel="noopener" data-en="Open article ↗" data-ko="기사 보기 ↗">Open article ↗</a></div>
    <div class="news-row"><div class="news-source">VoyageLA</div><div class="news-title" data-en="Conversations with Jonghoon Ahn" data-ko="Jonghoon Ahn 인터뷰">Conversations with Jonghoon Ahn</div><a class="news-link" href="https://voyagela.com/interview/conversations-with-jonghoon-ahn/" target="_blank" rel="noopener" data-en="Open interview ↗" data-ko="인터뷰 보기 ↗">Open interview ↗</a></div>
    <div class="news-row"><div class="news-source">Wonju Today</div><div class="news-title" data-en="Wolseong Pharmacy" data-ko="월성약방 관련 기사">Wolseong Pharmacy</div><a class="news-link" href="https://www.wonjutoday.co.kr/news/articleView.html?idxno=201271" target="_blank" rel="noopener" data-en="Open article ↗" data-ko="기사 보기 ↗">Open article ↗</a></div>
    <div class="news-row"><div class="news-source">Maeil Newspaper · 2023</div><div class="news-title" data-en="Media art coverage" data-ko="미디어아트 관련 기사">Media art coverage</div><a class="news-link" href="https://www.imaeil.com/page/view/2023102610192087838" target="_blank" rel="noopener" data-en="Open article ↗" data-ko="기사 보기 ↗">Open article ↗</a></div>
    <div class="news-row"><div class="news-source">Asian Film Festival</div><div class="news-title">South Korea · The Silence We Share</div><a class="news-link" href="https://asianfilmfestival.us/south-korea-the-silence-we-share-%e9%9f%a9%e5%9b%bd%e5%89%a7%e6%9c%ac/" target="_blank" rel="noopener" data-en="Open ↗" data-ko="보기 ↗">Open ↗</a></div>
    <div class="news-row"><div class="news-source">IMDb</div><div class="news-title">Jonghoon Ahn</div><a class="news-link" href="https://www.imdb.com/name/nm17746174/?ref_=nv_sr_srsg_0_tt_0_nm_8_in_0_q_jonghoon%2520ahn" target="_blank" rel="noopener" data-en="Open profile ↗" data-ko="프로필 보기 ↗">Open profile ↗</a></div>
  </div>
</div></section>
'''

          if 'id="news"' not in s:
              if '</main>' not in s:
                  raise SystemExit('main closing tag not found')
              s = s.replace('</main>', news + '</main>', 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore News section and add Gwanak Culture Foundation article"
          git push origin gh-pages
