name: Add recognition strip

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Add compact recognition strip under artist name
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8-sig')

          css_anchor = ".artist h1 small{display:block;font-size:.3em;line-height:1.2;letter-spacing:-.02em;margin-top:16px;font-weight:520}"
          css_extra = """.recognition-strip{display:flex;flex-direction:column;gap:7px;margin-top:24px;max-width:560px}.recognition-item{display:flex;align-items:center;gap:8px;min-height:18px;font-size:10.5px;line-height:1.3;color:#666;letter-spacing:.005em}.recognition-mark{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;height:18px;color:#111}.nicholl-mark{width:22px;border:1px solid #b9a36c;border-radius:50%;font-family:Georgia,serif;font-size:10px;font-weight:700;color:#8d7947}.sundance-mark{width:22px;height:22px;border-radius:50%;background:#ffd400;font-size:9px;font-weight:800;letter-spacing:-.08em}.tiff-mark{width:30px;font-size:11px;font-weight:800;letter-spacing:-.08em;color:#f26b21}.recognition-copy{color:#666}.recognition-copy strong{font-weight:650;color:#333}@media(max-width:680px){.recognition-strip{margin-top:20px;gap:6px}.recognition-item{white-space:normal;font-size:10px}}"""
          if css_extra not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS anchor not found')
              s = s.replace(css_anchor, css_anchor + css_extra, 1)

          old = '<section class="artist"><div class="shell artist-grid"><div><h1>Jonghoon Ahn<small>안종훈</small></h1></div>'
          new = '''<section class="artist"><div class="shell artist-grid"><div><h1>Jonghoon Ahn<small>안종훈</small></h1><div class="recognition-strip" aria-label="Selected recognition"><div class="recognition-item"><span class="recognition-mark nicholl-mark" aria-hidden="true">N</span><span class="recognition-copy" data-en="Academy Nicholl Fellowships · Partner Entrant ’25" data-ko="아카데미 니콜 펠로우십 · 파트너 추천작 ’25"><strong>Academy Nicholl Fellowships</strong> · Partner Entrant ’25</span></div><div class="recognition-item"><span class="recognition-mark sundance-mark" aria-hidden="true">s</span><span class="recognition-copy" data-en="Sundance Ignite × Adobe Fellowship · Finalist ’24" data-ko="선댄스 이그나이트 × Adobe 펠로우십 · 파이널리스트 ’24"><strong>Sundance Ignite × Adobe Fellowship</strong> · Finalist ’24</span></div><div class="recognition-item"><span class="recognition-mark tiff-mark" aria-hidden="true">tiff.</span><span class="recognition-copy" data-en="CJ & TIFF K-Story Fund · Shortlist ’25" data-ko="CJ & TIFF K-Story Fund · 쇼트리스트 ’25"><strong>CJ & TIFF K-Story Fund</strong> · Shortlist ’25</span></div></div></div>'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'class="recognition-strip"' not in s:
              raise SystemExit('Hero anchor not found')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add compact fellowship recognition under artist name"
          git push origin gh-pages
