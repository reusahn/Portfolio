name: Mobile wordmark English only
on:
  push:
    branches: [gh-pages]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Keep English wordmark only on mobile
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8-sig')
          s=s.replace('<a class="wordmark" href="#top">JONGHOON AHN / 안종훈</a>','<a class="wordmark" href="#top"><span class="wordmark-en">JONGHOON AHN</span><span class="wordmark-ko"> / 안종훈</span></a>',1)
          css='\n/* Mobile wordmark */\n@media(max-width:680px){.wordmark-ko{display:none}.wordmark{white-space:nowrap}}\n'
          if '/* Mobile wordmark */' not in s:
              s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use English-only wordmark on mobile"
          git push origin gh-pages
