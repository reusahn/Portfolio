name: Move K-Art under TIFF
on:
  push:
    branches: [gh-pages]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Move K-Art below TIFF
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8-sig')
          old='.intro-recognition .kart-item{flex-basis:100%;justify-content:flex-start}'
          new='.intro-recognition .kart-item{flex-basis:100%;justify-content:flex-end}'
          if old not in s:
              raise SystemExit('K-Art desktop alignment rule not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Move K-Art recognition under TIFF"
          git push origin gh-pages
