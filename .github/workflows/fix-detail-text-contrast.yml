name: Fix detail text contrast

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Force legacy detail text to readable dark colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/museum-detail.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* 2026 detail contrast safety */'
          block = r'''

/* 2026 detail contrast safety */
/* Old detail pages originally used dark themes. These overrides prevent
   inherited white/light text from disappearing after the museum-style
   white background migration. */
.detail-content,
.detail-body,
.detail-desc,
.detail-meta,
.process-section,
.tech-section,
.detail-awards,
.press-section,
body>.container,
.description,
.image-text-block,
.image-text-block .text,
.card,
.panel,
.info-card,
.project-info,
.pipeline-info,
.collab-block,
.detail-quote{
  color:#111!important;
}
.detail-content p,
.detail-content li,
.detail-content span:not(.detail-meta-label):not(.tech-tag):not(.ptag),
.detail-body p,
.detail-body li,
.detail-body span:not(.detail-meta-label),
.detail-desc p,
.detail-desc li,
.process-section p,
.process-section li,
.tech-section p,
.tech-section li,
.detail-awards p,
.detail-awards li,
.press-section p,
.press-section li,
body>.container p,
body>.container li,
body>.container span,
.description p,
.description li,
.image-text-block p,
.image-text-block li,
.image-text-block .text,
.card p,.card li,.card span,
.panel p,.panel li,.panel span,
.info-card p,.info-card li,.info-card span,
.project-info p,.project-info li,.project-info span,
.pipeline-info p,.pipeline-info li,.pipeline-info span,
.collab-block p,.collab-block li,.collab-block span,
.detail-quote p{
  color:#333!important;
}
.detail-content h1,.detail-content h2,.detail-content h3,.detail-content h4,.detail-content h5,.detail-content h6,
.detail-body h1,.detail-body h2,.detail-body h3,.detail-body h4,.detail-body h5,.detail-body h6,
.process-section h1,.process-section h2,.process-section h3,.process-section h4,
.tech-section h1,.tech-section h2,.tech-section h3,.tech-section h4,
.detail-awards h1,.detail-awards h2,.detail-awards h3,.detail-awards h4,
.press-section h1,.press-section h2,.press-section h3,.press-section h4,
body>.container h1,body>.container h2,body>.container h3,body>.container h4,
.card h1,.card h2,.card h3,.card h4,
.panel h1,.panel h2,.panel h3,.panel h4,
.info-card h1,.info-card h2,.info-card h3,.info-card h4,
.project-info h1,.project-info h2,.project-info h3,.project-info h4,
.pipeline-title,.collab-block strong,.detail-quote strong{
  color:#111!important;
}
/* Keep intentional museum accent labels blue. */
.detail-cat,.process-label,.tech-label,.detail-awards-title,.press-label,.sec-label,
.tech-block-title,.pipeline-num,.tech-block-icon,
.collab-block a,.press-link:hover,.detail-nav .back{
  color:#1f5f91!important;
}
/* Links on light panels must also remain visible. */
.detail-content a:not(.press-link):not(.collab-block a),
.detail-body a,
body>.container a,
.card a,.panel a,.info-card a,.project-info a{
  color:#1f5f91!important;
}
'''
          if marker not in s:
              p.write_text(s.rstrip() + block + '\n', encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/museum-detail.css
          git commit -m "Fix unreadable white text on detail pages"
          git push origin gh-pages
