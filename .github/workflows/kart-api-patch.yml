name: Apply K-Art highlight via API

on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/kart-api-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch index and clean up temporary workflows
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'gh-pages';

            const file = await github.rest.repos.getContent({ owner, repo, path: 'index.html', ref: branch });
            let text = Buffer.from(file.data.content, 'base64').toString('utf8');
            let changed = false;

            const oldCss = `/* K-Art recognition */
            .kart-mark{border:0;background:#1f5f91;color:#fff;font-family:Arial,sans-serif;font-size:9px;font-weight:800;letter-spacing:-.02em}
            .intro-recognition .kart-item{flex-basis:100%;justify-content:flex-start}
            @media(max-width:680px){.intro-recognition .kart-item{flex-basis:100%}}`;

            const newCss = `/* K-Art recognition */
            .intro-recognition .kart-item{flex-basis:100%;justify-content:flex-end;gap:10px;margin-top:3px;padding-top:11px;border-top:1px solid var(--line);font-size:12.8px;line-height:1.3;color:#333}
            .intro-recognition .kart-item .kart-mark{flex:0 0 auto;width:auto;min-width:48px;height:28px;padding:0 8px;border:0;border-radius:2px;background:#1f5f91;color:#fff;font-family:Arial,sans-serif;font-size:10px;font-weight:800;letter-spacing:.02em}
            .intro-recognition .kart-item .recognition-copy{color:#333;font-weight:520}
            .intro-recognition .kart-item .recognition-copy strong{font-size:12.8px;font-weight:720;color:#111}
            @media(max-width:1050px){.intro-recognition .kart-item{justify-content:flex-start}}
            @media(max-width:680px){.intro-recognition .kart-item{flex-basis:100%;justify-content:flex-start;margin-top:2px;padding-top:10px;font-size:11.2px}.intro-recognition .kart-item .kart-mark{min-width:44px;height:26px;font-size:9px}.intro-recognition .kart-item .recognition-copy strong{font-size:11.2px}}`;

            const oldHtml = `<div class="recognition-item kart-item"><span class="recognition-mark kart-mark" aria-hidden="true">K</span><span class="recognition-copy" title="K-Art Young Artist Creation Support · Selected Artist ’26" data-en="K-Art Young Artist Creation Support ’26 · Selected Artist" data-ko="K-ART 청년 창작자 지원사업 선정자 ’26"><strong>K-Art ’26</strong> · Selected Artist</span></div>`;

            const newHtml = `<div class="recognition-item kart-item"><span class="recognition-mark kart-mark" aria-hidden="true">K·ART</span><span class="recognition-copy" title="K-ART Young Creators Support Program · Selected Artist ’26" data-en="K-ART Young Creators Support Program ’26 · Selected Artist" data-ko="K-ART 청년 창작자 지원사업 선정자 ’26"><strong>K-ART ’26</strong> · Selected Artist</span></div>`;

            if (text.includes(oldCss)) {
              text = text.replace(oldCss, newCss);
              changed = true;
            }
            if (text.includes(oldHtml)) {
              text = text.replace(oldHtml, newHtml);
              changed = true;
            }

            if (changed) {
              await github.rest.repos.createOrUpdateFileContents({
                owner, repo, path: 'index.html', branch,
                message: 'Highlight K-Art selected artist recognition',
                sha: file.data.sha,
                content: Buffer.from(text, 'utf8').toString('base64')
              });
            }

            for (const path of ['.github/workflows/kart-highlight.yml', '.github/workflows/kart-api-patch.yml']) {
              try {
                const wf = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                await github.rest.repos.deleteFile({
                  owner, repo, path, branch,
                  message: 'Remove temporary K-Art workflow',
                  sha: wf.data.sha
                });
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
