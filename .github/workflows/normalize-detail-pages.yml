name: Normalize detail page design

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Apply museum design to all legacy detail pages
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('detail_pages')
          stylesheet = '<link rel="stylesheet" href="../assets/css/museum-detail.css">'
          changed = []
          for path in sorted(root.glob('*.html')):
              if path.name == 'flower-of-waves.html':
                  continue
              text = path.read_text(encoding='utf-8-sig')
              old = text
              if stylesheet not in text:
                  text = text.replace('</head>', f'  {stylesheet}\n</head>', 1)
              text = text.replace('../index.html#media"', '../index.html#media-art"')
              text = text.replace("../index.html#media'", "../index.html#media-art'")
              text = text.replace('../index.html#about"', '../index.html#bio"')
              text = text.replace("../index.html#about'", "../index.html#bio'")
              text = text.replace('>About</a>', '>Biography</a>')
              text = text.replace('>Back to Portfolio</a>', '>All Works</a>')
              if text != old:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))
          print(f'Updated {len(changed)} detail pages')
          for p in changed:
              print(p)
          PY
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detail_pages
          git commit -m "Unify all detail pages with museum-style design"
          git push origin gh-pages
