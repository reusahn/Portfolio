name: Update Flower K-Art label
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/update-flower-kart-label.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Update featured work label through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'portfolio-kart-feature-update'
          }
          url=f'https://api.github.com/repos/{repo}/contents/index.html?ref=gh-pages'
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers)) as r:
              meta=json.load(r)
          s=base64.b64decode(meta['content']).decode('utf-8-sig')
          old='<div class="eyebrow">2026 · MEDIA ART SERIES</div>'
          new='<div class="eyebrow" data-en="2026 · K-ART YOUNG CREATOR SUPPORT" data-ko="2026 · K-ART 청년 창작자 지원사업">2026 · K-ART YOUNG CREATOR SUPPORT</div>'
          if old not in s:
              raise SystemExit('Featured work eyebrow not found')
          s=s.replace(old,new,1)
          payload=json.dumps({
              'message':'Identify featured work as K-Art supported project',
              'content':base64.b64encode(s.encode()).decode(),
              'sha':meta['sha'],
              'branch':'gh-pages'
          }).encode()
          put=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/contents/index.html',
              data=payload,headers=headers,method='PUT')
          with urllib.request.urlopen(put) as r:
              json.load(r)
          PY
