name: Refine recognition marks

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Refine marks and spacing
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8-sig')

          old_css=".recognition-strip{display:flex;flex-direction:column;gap:7px;margin-top:24px;max-width:560px}.recognition-item{display:flex;align-items:center;gap:8px;min-height:18px;font-size:10.5px;line-height:1.3;color:#666;letter-spacing:.005em}.recognition-mark{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;height:18px;color:#111}.nicholl-mark{width:22px;border:1px solid #b9a36c;border-radius:50%;font-family:Georgia,serif;font-size:10px;font-weight:700;color:#8d7947}.sundance-mark{width:22px;height:22px;border-radius:50%;background:#ffd400;font-size:9px;font-weight:800;letter-spacing:-.08em}.tiff-mark{width:30px;font-size:11px;font-weight:800;letter-spacing:-.08em;color:#f26b21}.recognition-copy{color:#666}.recognition-copy strong{font-weight:650;color:#333}@media(max-width:680px){.recognition-strip{margin-top:20px;gap:6px}.recognition-item{white-space:normal;font-size:10px}}"
          new_css=".recognition-strip{display:flex;flex-direction:column;gap:9px;margin-top:32px;max-width:560px}.recognition-item{display:flex;align-items:center;gap:10px;min-height:22px;font-size:10.5px;line-height:1.45;color:#666;letter-spacing:.005em}.recognition-mark{display:inline-flex;align-items:center;justify-content:center;flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:#fff;line-height:1}.nicholl-mark{border:1px solid #b08f52;font-family:Georgia,serif;font-size:11px;font-weight:700;color:#b08f52}.sundance-mark{border:0;background:#ffd400;color:#111;font-family:Arial,sans-serif;font-size:10px;font-weight:800}.tiff-mark{border:1px solid #d5d5d5;background:#fff;color:#111;font-family:Arial,sans-serif;font-size:7.5px;font-weight:800;letter-spacing:-.08em;text-transform:lowercase}.recognition-copy{color:#666}.recognition-copy strong{font-weight:650;color:#333}@media(max-width:680px){.recognition-strip{margin-top:26px;gap:8px}.recognition-item{white-space:normal;font-size:10px;gap:9px}}"
          if old_css not in s:
              raise SystemExit('Recognition CSS anchor not found')
          s=s.replace(old_css,new_css,1)

          s=s.replace('aria-hidden="true">N</span>','aria-hidden="true">A</span>',1)
          s=s.replace('aria-hidden="true">s</span>','aria-hidden="true">S</span>',1)
          s=s.replace('aria-hidden="true">tiff.</span>','aria-hidden="true">tiff</span>',1)
          s=s.replace('Academy Nicholl Fellowships · Partner Entrant ’25','Academy Nicholl Fellowships · Entrant ’25')
          s=s.replace('아카데미 니콜 펠로우십 · 파트너 추천작 ’25','아카데미 니콜 펠로우십 · Entrant ’25')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine recognition marks and spacing"
          git push origin gh-pages
