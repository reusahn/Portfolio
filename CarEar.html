  :root{
    --bg:#080808; --bg-panel:#101010; --line:#242424;
    --accent:#e8ff47; --accent-dim:#8a9a2b; --text:#e8e8e4; --text-dim:#8a8a86;
    --wave:#4fb8ff; --level:#e8ff47;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;}
  header{padding:48px 6vw 32px;border-bottom:1px solid var(--line);}
  header .eyebrow{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;}
  header h1{font-size:clamp(24px,3.4vw,38px);font-weight:900;margin:0 0 12px;line-height:1.2;}
  header h1 span{color:var(--accent);}
  header p{max-width:680px;color:var(--text-dim);font-size:14px;line-height:1.7;margin:0;}
  nav.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line);padding:0 6vw;position:sticky;top:0;background:rgba(8,8,8,.94);backdrop-filter:blur(6px);z-index:10;}
  nav.tabs button{font-family:'Space Mono',monospace;font-size:13px;background:none;border:none;color:var(--text-dim);padding:16px 18px;cursor:pointer;border-bottom:2px solid transparent;}
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);}
  main{padding:36px 6vw 90px;max-width:1200px;margin:0 auto;}
  .panel{display:none;}
  .panel.active{display:block;}
  .chart-box{border:1px solid var(--line);background:var(--bg-panel);padding:24px 24px 14px;margin-bottom:28px;}
  .chart-box .t{font-family:'Space Mono',monospace;font-size:12px;color:var(--text-dim);margin-bottom:16px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  canvas{max-width:100%;}
  .note{font-size:12px;color:var(--text-dim);line-height:1.7;border-top:1px solid var(--line);padding-top:16px;margin-top:4px;}
</style>
</head>

const YEARS = Object.keys(DATA);
Chart.defaults.font.family = "'Space Mono', monospace";
Chart.defaults.color = "#8a8a86";
Chart.defaults.borderColor = "#242424";

const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');

YEARS.forEach((y, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0 ? ' active' : '');
  btn.textContent = y + '년 7월';
  btn.dataset.year = y;
  btn.addEventListener('click', () => showYear(y));
  tabsEl.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'panel' + (i===0 ? ' active' : '');
  panel.id = 'panel-' + y;
  panel.innerHTML = `
    <div class="chart-box">
      <div class="t"><span><span class="dot" style="background:var(--wave)"></span>파고 (m) — 오전 06–12시 만조 시점</span></div>
      <canvas id="wave-${y}" height="90"></canvas>
    </div>
    <div class="chart-box">
      <div class="t"><span><span class="dot" style="background:var(--level)"></span>만조 수위 (cm) — 오전 06–12시</span></div>
      <canvas id="level-${y}" height="90"></canvas>
    </div>
    <div class="note">막대가 없는 날짜는 그 날 오전 06:00~12:00 사이에 만조가 없었다는 뜻(다른 시간대에 만조가 있었거나, 데이터 없음).</div>
  `;
  mainEl.appendChild(panel);
});

function showYear(y){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.year===y));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id==='panel-'+y));
}

YEARS.forEach(y => {
  const rows = DATA[y];
  const labels = rows.map(r => r.day);
  const waves = rows.map(r => r.wh);
  const levels = rows.map(r => r.cm);
  const times = rows.map(r => r.time);

  new Chart(document.getElementById('wave-'+y), {
    type: 'bar',
    data: { labels, datasets: [{ data: waves, backgroundColor: '#4fb8ff', borderRadius: 2, maxBarThickness: 22 }] },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => {
          const t = times[ctx.dataIndex];
          return t ? `만조 ${t} · 파고 ${ctx.parsed.y}m` : '만조 없음';
        }}}
      },
      scales: {
        x: { title: { display: true, text: '날짜 (7월)', color: '#8a8a86' }, grid: { display:false } },
        y: { title: { display: true, text: 'm', color: '#8a8a86' }, grid: { color: '#1a1a1a' }, beginAtZero: true }
      }
    }
  });

  new Chart(document.getElementById('level-'+y), {
    type: 'bar',
    data: { labels, datasets: [{ data: levels, backgroundColor: '#e8ff47', borderRadius: 2, maxBarThickness: 22 }] },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (ctx) => {
          const t = times[ctx.dataIndex];
          return t ? `만조 ${t} · 수위 ${ctx.parsed.y}cm` : '만조 없음';
        }}}
      },
      scales: {
        x: { title: { display: true, text: '날짜 (7월)', color: '#8a8a86' }, grid: { display:false } },
        y: { title: { display: true, text: 'cm', color: '#8a8a86' }, grid: { color: '#1a1a1a' } }
      }
    }
  });
});
